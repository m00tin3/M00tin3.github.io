{q:"有具体的内存泄漏和内存溢出的例子么请举例及解决方案", a:["**① 静态属性导致内存泄露**：大量使用 static 静态变量，静态属性的生命周期通常伴随着应用整个生命周期（除非 ClassLoader 符合垃圾回收的条件）。示例：public static List<Double> list = new ArrayList<>()，populateList 方法向 list 添加 1000000 个随机数——用 VisualVM 监控堆内存会发现打印 Point1 和 Point2 之间堆内存有明显增长，但执行完 populateList 后堆内存并没有被垃圾回收器回收；而把 list 前的 static 关键字去掉再次执行，程序执行完方法后不再有引用指向对应数据，垃圾回收器便进行了回收操作。**优化**：第一，尽量减少静态变量；第二，如果使用单例，尽量采用懒加载","**② 未关闭的资源**：无论什么时候创建连接或打开流，JVM 都会分配内存给这些资源，比如数据库连接、输入流和 session 对象。忘记关闭这些资源会阻塞内存，导致 GC 无法清理，特别是程序发生异常时没有在 finally 中进行资源关闭的情况——轻则影响程序性能，重则导致 OutOfMemoryError。**处理**：始终记得在 finally 中进行资源关闭；关闭连接的自身代码不能发生异常；Java7 以上版本可使用 try-with-resources 代码方式进行资源关闭","**③ 使用 ThreadLocal**：ThreadLocal 提供线程本地变量，保证访问到的变量属于当前线程，每个线程都保存有一个变量副本，相当于提供了一种线程隔离，将变量与线程相绑定从而实现线程安全的特性；但使用不当可能内存泄漏（详见下一题）"]},
{q:"ThreadLocal内存泄漏原理及解决方案", a:["ThreadLocal 的实现中，每个 Thread 维护一个 ThreadLocalMap 映射表，**key 是 ThreadLocal 实例本身，value 是真正需要存储的 Object**","**原理**：ThreadLocalMap 使用 ThreadLocal 的**弱引用**作为 key，如果一个 ThreadLocal 没有外部强引用来引用它，那么系统 GC 时这个 ThreadLocal 势必会被回收，这样一来 ThreadLocalMap 中就会出现 **key 为 null 的 Entry**，没有办法访问这些 key 为 null 的 Entry 的 value；如果当前线程迟迟不结束的话，这些 key 为 null 的 Entry 的 value 就会一直存在一条强引用链：**Thread Ref → Thread → ThreadLocalMap → Entry → value**，永远无法回收，造成内存泄漏","**解决**：第一，使用 ThreadLocal 提供的 **remove()** 方法，对当前线程中的 value 值进行移除；第二，**不要使用 ThreadLocal.set(null) 的方式清除 value**，它实际上并没有清除值，而是查找与当前线程关联的 Map 并将键值对分别设置为当前线程和 null；第三，最好将 ThreadLocal 视为需要在 **finally 块中关闭的资源**，确保即使在发生异常的情况下也始终关闭该资源——try { threadLocal.set(System.nanoTime()); ... } finally { threadLocal.remove(); }"]},
]},
{name:"类加载", qa:[
{q:"创建对象的过程", a:["**① 类加载检查**：虚拟机遇到一条 new 指令时，首先检查这个指令的参数是否能在常量池中定位到一个类的符号引用，并且检查这个符号引用代表的类是否已被加载过、解析和初始化过；如果没有，必须先执行相应的类加载过程","**② 分配内存**：在类加载检查通过后，虚拟机将为新生对象分配内存。对象所需的内存大小在类加载完成后便可确定，为对象分配空间的任务等同于把一块确定大小的内存从 Java 堆中划分出来","**③ 初始化零值**：内存分配完成后，虚拟机需要将分配到的内存空间都初始化为零值（**不包括对象头**），这一步保证了对象的实例字段在 Java 代码中可以不赋初始值就直接使用，程序能访问到这些字段的数据类型所对应的零值","**④ 必要设置（对象头）**：虚拟机要对对象进行必要的设置，例如这个对象是哪个类的实例、如何才能找到类的元数据信息、对象的哈希码、对象的 GC 分代年龄等信息，这些信息存放在对象头中；根据虚拟机当前运行状态的不同（如是否启用偏向锁），对象头会有不同的设置方式","**⑤ 执行 init 方法**：从虚拟机的视角来看，一个新的对象已经产生，但从 Java 程序的视角来看，对象创建才刚开始——构造函数（class 文件中的 init 方法）还没有执行，所有字段都还为零，对象需要的其他资源和状态信息还没有按照预定的意图构造好；所以一般来说，执行 new 指令之后会接着执行 init 方法，把对象按照程序员的意愿进行初始化，这样一个**真正可用的对象**才算完全被构造出来"]},
{q:"对象的生命周期", a:["对象的生命周期包括**创建、使用和销毁**三个阶段：","**创建**：对象通过关键字 new 在堆内存中被实例化，构造函数被调用，对象的内存空间被分配","**使用**：对象被引用并执行相应的操作，可以通过引用访问对象的属性和方法，在程序运行过程中被不断使用","**销毁**：当对象不再被引用时，通过垃圾回收机制自动回收对象所占用的内存空间；垃圾回收器会在适当的时候检测并回收不再被引用的对象，释放对象占用的内存空间，完成对象的销毁过程"]},
{q:"类加载器有哪些", a:["**启动类加载器（Bootstrap ClassLoader）**：最顶层的类加载器，负责加载 java 的核心库（如位于 jre/lib/rt.jar 中的类），用 C++ 编写，是 JVM 的一部分，**无法被 Java 程序直接引用**","**扩展类加载器（Extension ClassLoader）**：Java 语言实现，继承自 ClassLoader 类，负责加载 java 扩展目录（jre/lib/ext 或由系统变量 java.ext.dirs 指定的目录）下的 jar 包和类库；由启动类加载器加载，**父加载器就是启动类加载器**","**系统/应用程序类加载器（Application ClassLoader）**：Java 语言实现，负责加载用户类路径（ClassPath）上的指定类库，是平时编写 Java 程序时**默认使用**的类加载器；父加载器是扩展类加载器，可通过 ClassLoader.getSystemClassLoader() 方法获取","**自定义类加载器（Custom ClassLoader）**：开发者可以根据需求定制类的加载方式，比如从网络加载 class 文件、数据库、甚至是加密的文件中加载类；可以用来扩展 Java 应用程序的灵活性和安全性，是 Java 动态性的一个重要体现"]},
{q:"双亲委派模型的作用", a:["这些类加载器之间的关系形成双亲委派模型：**当一个类加载器收到类加载请求时，首先不会自己去尝试加载这个类，而是把这个请求委派给父类加载器去完成**，每一层次的类加载器都是如此，所有加载请求最终都传送到顶层的启动类加载器；只有当父加载器反馈自己无法完成这个加载请求（搜索范围中没有找到所需类）时，子加载器才会尝试自己去加载","**① 保证类的唯一性**：通过委托机制，确保所有加载请求都传递到启动类加载器，避免不同类加载器重复加载相同类的情况，保证 Java 核心类库的统一性，也防止用户自定义类覆盖核心类库的可能","**② 保证安全性**：由于 Java 核心库被启动类加载器加载，而启动类加载器只加载信任的类路径中的类，防止不可信的类假冒核心类——例如恶意代码无法自定义一个 java.lang.System 类并加载到 JVM 中","**③ 支持隔离和层次划分**：不同层次的类加载器服务于不同的类加载需求（应用加载用户代码、扩展加载扩展框架、启动加载核心库），层次化划分有助于实现沙箱安全机制，保证各层级类加载器职责清晰，便于维护和扩展","**④ 简化了加载流程**：通过委派，大部分类能够被正确的类加载器加载，减少了每个加载器需要处理的类的数量，简化加载过程，提高加载效率"]},
{q:"讲一下类加载过程", a:["类从被加载到虚拟机内存开始到卸载出内存为止，整个生命周期包括 **7 个阶段**：加载、验证、准备、解析、初始化、使用、卸载（其中验证、准备、解析统称为连接）","**加载**：通过类的全限定名（包名+类名）获取到该类的 .class 文件的二进制字节流，将二进制字节流所代表的静态存储结构转化为方法区运行时的数据结构，在内存中生成一个代表该类的 java.lang.Class 对象，作为方法区这个类的各种数据的访问入口","**验证**：确保 class 文件中的字节流包含的信息符合当前虚拟机的要求，保证被加载的 class 类的正确性，不会危害虚拟机的安全。大致完成四个阶段的检验：**文件格式校验、元数据验证、字节码验证、符号引用验证**","**准备**：为类中的静态字段分配内存，并设置默认的初始值，比如 int 类型初始值是 0；**被 final 修饰的 static 字段不会设置**，因为 final 在编译的时候就分配了","**解析**：虚拟机将常量池的「符号引用」直接替换为「直接引用」的过程。符号引用是以一组符号来描述所引用的目标，可以是任何形式的字面量；直接引用可以是直接指向目标的指针、相对偏移量或是一个能间接定位到目标的句柄，直接引用和虚拟机实现的内存布局相关，有了直接引用则引用的目标必定已经存在内存中","**初始化**：整个类加载过程的最后一个阶段，简单来说就是执行类的构造器方法 <clinit>，注意这里的构造器方法并不是开发者写的，而是**编译器自动生成**的","**使用**：使用类或者创建对象","**卸载**：满足以下情况类就会被卸载——① 该类所有的实例都已经被回收（Java 堆中不存在该类的任何实例）；② 加载该类的 ClassLoader 已经被回收；③ 类对应的 java.lang.Class 对象没有任何地方被引用，无法在任何地方通过反射访问该类的方法"]},
{q:"讲一下类的加载和双亲委派原则", a:["把 Java 的类加载过程分为三个主要步骤：**加载、链接、初始化**","**加载阶段**：将字节码数据从不同的数据源读取到 JVM 中，并映射为 JVM 认可的数据结构（Class 对象），数据源可能是各种形态，如 jar 文件、class 文件、甚至是网络数据源；如果输入数据不是 ClassFile 的结构，则会抛出 ClassFormatError。**加载阶段是用户参与的阶段**，可以自定义类加载器实现自己的类加载过程","**链接阶段**：核心步骤，简单说是把原始的类定义信息平滑地转化入 JVM 运行的过程中，细分为三个步骤：**验证**——虚拟机安全的重要保障，JVM 需要核验字节信息符合 Java 虚拟机规范，否则被认为是 VerifyError，防止恶意信息或不合规的信息危害 JVM 运行，验证阶段有可能触发更多 class 的加载；**准备**——创建类或接口中的静态变量并初始化静态变量的初始值，侧重点在于分配所需要的内存空间，不会执行更进一步的 JVM 指令；**解析**——将常量池中的符号引用替换为直接引用","**初始化阶段**：真正去执行类初始化的代码逻辑，包括静态字段赋值的动作，以及执行类定义中的静态初始化块内的逻辑；编译器在编译阶段就会把这部分逻辑整理好，**父类型的初始化逻辑优先于当前类型的逻辑**","**双亲委派原则**：当类加载器试图加载某个类型的时候，除非父加载器找不到相应类型，否则尽量将这个任务代理给当前加载器的父加载器去做。**使用委派模型的目的是避免重复加载 Java 类型**"]},
]},
{name:"垃圾回收", qa:[
{q:"什么是Java里的垃圾回收？如何触发垃圾回收", a:["垃圾回收（GC）是**自动管理内存**的一种机制，负责自动释放不再被程序引用的对象所占用的内存，这种机制减少了内存泄漏和内存管理错误的可能性","触发方式：**① 内存不足时**——JVM 检测到堆内存不足、无法为新的对象分配内存时，自动触发垃圾回收；**② 手动请求**——开发者可以通过调用 System.gc() 或 Runtime.getRuntime().gc() 建议 JVM 进行垃圾回收，不过这只是一个建议，**并不能保证立即执行**；**③ JVM 参数**——启动 Java 应用时可以通过 JVM 参数调整垃圾回收的行为，比如 -Xmx（最大堆大小）、-Xms（初始堆大小）等；**④ 对象数量或内存使用达到阈值**——垃圾收集器内部实现了一些策略，监控对象的创建和内存使用，达到某个阈值时触发垃圾回收"]},
{q:"判断垃圾的方法有哪些", a:["在 Java 中，判断对象是否为垃圾主要依据**两种主流的垃圾回收算法**：","**引用计数法（Reference Counting）**：为每个对象分配一个引用计数器，每当有一个地方引用它时计数器加 1，当引用失效时计数器减 1；当计数器为 0 时表示对象不再被任何变量引用，可以被回收。**缺点：不能解决循环引用的问题**——两个对象相互引用但不再被其他任何对象引用时，引用计数器不会为 0，导致对象无法被回收","**可达性分析算法（Reachability Analysis）**：Java 虚拟机主要采用此算法。原理：从一组称为 GC Roots（垃圾收集根）的对象出发，向下追溯它们引用的对象，以及这些对象引用的其他对象，以此类推；如果一个对象到 GC Roots 没有任何引用链相连（即不可达），那么这个对象就被认为是不可达的，可以被回收。**GC Roots 对象包括**：虚拟机栈（栈帧中的本地变量表）中引用的对象、方法区中类静态属性引用的对象、本地方法栈中 JNI 引用的对象、活跃线程的引用等"]},
{q:"垃圾回收算法是什么，是为了解决了什么问题", a:["JVM 有垃圾回收机制是为了解决**内存管理的问题**：在传统的编程语言中，开发人员需要手动分配和释放内存，这可能导致内存泄漏、内存溢出等问题；而 Java 作为一种高级语言，旨在提供更简单、更安全的编程环境，因此引入了垃圾回收机制来自动管理内存","垃圾回收机制的主要目标是**自动检测和回收不再使用的对象，释放它们所占用的内存空间**：避免内存泄漏（一些对象被分配了内存却无法被释放，导致内存资源浪费）；防止内存溢出（程序需要的内存超过了可用内存的情况）","通过垃圾回收机制，JVM 可以在程序运行时自动识别和清理不再使用的对象，使开发人员无需手动管理内存，从而提高开发效率、减少错误，使程序更加可靠和稳定"]},
{q:"垃圾回收算法有哪些", a:["**标记-清除算法**：分为“标记”和“清除”两个阶段，首先通过可达性分析标记出所有需要回收的对象，然后统一回收所有被标记的对象。**两个缺陷**：一个是效率问题——标记和清除的过程效率都不高；另一个是清除结束后会造成**大量的碎片空间**，有可能造成在申请大块内存的时候因为没有足够的连续空间导致再次 GC","**复制算法**：为了解决碎片空间的问题，将内存分成两块，每次申请内存时只使用其中一块，当内存不够时将这一块内存中所有存活的对象复制到另一块上，然后把已使用的内存整个清理掉。复制算法解决了碎片空间问题，但也带来新问题：**每次申请内存时只能使用一半的内存空间，内存利用率严重不足**","**标记-整理算法**：复制算法在 GC 之后存活对象较少的情况下效率比较高，但如果存活对象比较多时，会执行较多的复制操作效率下降；而老年代的对象在 GC 之后的存活率比较高，所以提出标记-整理算法——标记过程与标记-清除算法的标记过程一致，但**标记之后不会直接清理，而是将所有存活对象都移动到内存的一端，移动结束后直接清理掉剩余部分**，适合老年代存活率高的场景","**分代回收算法**：将内存划分成新生代和老年代，分配的依据是对象的生存周期或经历过的 GC 次数。对象创建时一般在新生代申请内存，当经历一次 GC 之后如果对象还存活，那么对象的年龄 +1；当年龄超过一定值（**默认是 15**，可以通过参数 -XX:MaxTenuringThreshold 设定）后如果对象还存活，该对象会进入老年代"]},
{q:"垃圾回收器有哪些", a:["**Serial**（新生代，串行回收，复制算法，响应速度优先）：单线程收集器，标记和清理都是单线程，优点是简单高效，适用于单核 CPU 环境下的 Client 模式","**Serial Old**（老年代，串行回收，标记-压缩算法，响应速度优先）：Serial 收集器的老年代版本，适用于单核 CPU 环境下的 Client 模式","**ParNew**（新生代，并行回收，复制算法，响应速度优先）：实际上是 Serial 收集器的多线程版本，在多核 CPU 环境下比 Serial 有更好的表现，多核 CPU 环境中 Server 模式下与 CMS 配合使用","**Parallel Scavenge**（新生代，并行回收，复制算法，吞吐量优先）：追求高吞吐量，高效利用 CPU——吞吐量 = 用户线程时间/(用户线程时间+GC 线程时间)，适合后台应用等对交互相应要求不高的场景","**Parallel Old**（老年代，并行回收，标记-压缩算法，吞吐量优先）：Parallel Scavenge 收集器的老年代版本","**CMS（Concurrent Mark-Sweep）**（老年代，并发回收，标记-清除算法，响应速度优先）：以获取最短回收停顿时间为目标的收集器，具有高并发、低停顿的特点，适用于 BS 业务（交互多的场景）","**G1（Garbage-First）**（新生代&老年代整堆收集器，并发、并行回收，复制算法&标记-压缩算法，响应速度优先）：JDK 1.7 提供的新收集器，基于“标记-整理”算法实现不会产生内存碎片；**重要特点：G1 回收的范围是整个 Java 堆（包括新生代、老年代）**，而前六种收集器回收的范围仅限于新生代或老年代，面向服务端的应用"]},
{q:"标记清除算法的缺点是什么", a:["主要缺点有两个：","**一个是效率问题**：标记和清除过程的效率都不高","**另外一个是空间问题**：标记清除之后会产生大量**不连续的内存碎片**，空间碎片太多可能会导致当程序在以后的运行过程中需要分配较大对象时，无法找到足够的连续内存而不得不提前触发另一次垃圾收集动作"]},
{q:"垃圾回收算法哪些阶段会stop the world", a:["标记-复制算法应用在 CMS 新生代（ParNew 是 CMS 默认的新生代垃圾回收器）和 G1 中，可以分为三个阶段：**标记阶段**（从 GC Roots 集合开始标记活跃对象）、**转移阶段**（把活跃对象复制到新的内存地址上）、**重定位阶段**（转移导致对象地址变化，所有指向对象旧地址的指针都要调整到对象新的地址上）","以 G1 的混合回收为例（标记阶段、清理阶段、复制阶段）：","**标记阶段停顿分析**：**初始标记 STW**——从 GC Roots 出发标记全部直接子节点，由于 GC Roots 数量不多，通常该阶段耗时非常短；**并发标记非 STW**——从 GC Roots 开始对堆中对象进行可达性分析找出存活对象，应用线程和 GC 线程可以同时活动，并发标记耗时相对长很多，但因为不是 STW 所以不太关心该阶段耗时长短；**再标记 STW**——重新标记那些在并发标记阶段发生变化的对象","**清理阶段停顿分析**：清点出有存活对象的分区和没有存活对象的分区，该阶段**不会清理垃圾对象，也不会执行存活对象的复制**，该阶段是 STW 的","**复制阶段停顿分析**：转移阶段需要分配新内存和复制对象的成员变量，转移阶段是 STW 的——其中**内存分配通常耗时非常短**，但**对象成员变量的复制耗时有可能较长**，因为复制耗时与存活对象数量与对象复杂度成正比，对象越复杂复制耗时越长","四个 STW 过程中：初始标记只标记 GC Roots 耗时较短，再标记因为对象数少耗时也较短，清理阶段因为内存分区数量少耗时也较短，**转移阶段要处理所有存活的对象耗时会较长**。因此，**G1 停顿时间的瓶颈主要是标记-复制中的转移阶段 STW**"]},
{q:"minorGC、majorGC、fullGC的区别，什么场景触发full GC", a:["**Minor GC（Young GC）**：作用范围**只针对年轻代**进行回收（Eden 区和两个 Survivor 区 S0/S1）。触发条件：当 **Eden 区空间不足**时，JVM 触发一次 Minor GC，将 Eden 区和一个 Survivor 区中的存活对象移动到另一个 Survivor 区或老年代。特点：通常发生得非常频繁（年轻代中对象生命周期较短），回收效率高，暂停时间相对较短","**Major GC**：作用范围**主要针对老年代**进行回收，但不一定只回收老年代。触发条件：当**老年代空间不足**时，或者系统检测到年轻代对象晋升到老年代的速度过快，可能会触发 Major GC。特点：相比 Minor GC 频率较低，但每次回收可能需要更长的时间（老年代中的对象存活率较高）","**Full GC**：作用范围**对整个堆内存**（年轻代、老年代以及永久代/元空间）进行回收。触发条件：① 直接调用 System.gc() 或 Runtime.getRuntime().gc() 方法时（虽然不能保证立即执行，但 JVM 会尝试执行 Full GC）；② Minor GC 时如果存活的对象**无法全部放入老年代**，或者老年代空间不足以容纳存活的对象，则会触发 Full GC；③ 当**永久代（Java 8 之前的版本）或元空间（Java 8 及以后的版本）空间不足**时。特点：**Full GC 是最昂贵的操作**，需要停止所有的工作线程（Stop The World）遍历整个堆内存，应尽量减少 Full GC 的触发"]},
{q:"垃圾回收器CMS和G1的区别", a:["**区别一：使用的范围不一样**——CMS 收集器是老年代的收集器，可以配合新生代的 Serial 和 ParNew 收集器一起使用；**G1 收集器收集范围是老年代和新生代，不需要结合其他收集器使用**","**区别二：STW 的时间**——CMS 收集器以**最小的停顿时间**为目标的收集器；G1 收集器**可预测垃圾回收的停顿时间**（建立可预测的停顿时间模型）","**区别三：垃圾碎片**——CMS 收集器使用“标记-清除”算法，容易产生内存碎片；G1 收集器使用“标记-整理”算法，进行了空间整合，**没有内存空间碎片**","**区别四：垃圾回收的过程不一样**——CMS：1. 初始标记 → 2. 并发标记 → 3. 重新标记 → 4. 并发清除；G1：1. 初始标记 → 2. 并发标记 → 3. 最终标记 → 4. 筛选回收（注意两个收集器第四阶段的不同）","**区别五：CMS 会产生浮动垃圾**——CMS 清除垃圾时是并发清除的，垃圾回收线程和用户线程同时工作会产生浮动垃圾，意味着 CMS 必须预留一部分内存空间用于存放浮动垃圾，**浮动垃圾过多时会退化为 serial old，效率低**；而 G1 没有浮动垃圾，G1 的筛选回收是多个垃圾回收线程并行 gc，执行并发清理步骤时用户线程也会同时产生一部分可回收对象，但这部分可回收对象只能在下次执行清理时才会被回收——如果在清理过程中预留给用户线程的内存不足就会出现 **Concurrent Mode Failure**，一旦出现此错误便会切换到 SerialOld 收集方式"]},
{q:"什么情况下使用CMS，什么情况使用G1", a:["**CMS 适用场景**：**低延迟需求**——适用于对停顿时间要求敏感的应用程序；**老年代收集**——主要针对老年代的垃圾回收；**碎片化管理**——容易出现内存碎片，可能需要定期进行 Full GC 来压缩内存空间","**G1 适用场景**：**大堆内存**——适用于需要管理大内存堆的场景，能够有效处理数 GB 以上的堆内存；**对内存碎片敏感**——G1 通过紧凑整理来减少内存碎片，降低碎片化对性能的影响；**比较平衡的性能**——G1 在提供较低停顿时间的同时，也保持了相对较高的吞吐量"]},
{q:"G1回收器的特色是什么", a:["G1 最大的特点是**引入分区的思路，弱化了分代的概念**；合理利用垃圾收集各个周期的资源，解决了其他收集器、甚至 CMS 的众多缺陷","**G1 相较 CMS 的改进**：**算法**——G1 基于标记-整理算法，不会产生空间碎片，在分配大对象时不会因无法得到连续的空间而提前触发一次 Full GC；**停顿时间可控**——G1 可以通过设置预期停顿时间（Pause Time）来控制垃圾收集时间，避免应用雪崩现象；**并行与并发**——G1 能更充分地利用 CPU 多核环境下的硬件优势，来缩短 stop the world 的停顿时间"]},
{q:"GC只会对堆进行GC吗", a:["**不是**。JVM 的垃圾回收器不仅仅会对堆进行垃圾回收，它还会对方法区进行垃圾回收","**堆（Heap）**：用于存储对象实例的内存区域，**大部分的垃圾回收工作都发生在堆上**，因为大多数对象都会被分配在堆上，垃圾回收的重点通常也是回收堆中不再被引用的对象以释放内存空间","**方法区（Method Area）**：用于存储类信息、常量、静态变量等数据的区域，虽然方法区中的垃圾回收与堆有所不同，但是**同样存在对不再需要的常量、无用的类信息等进行清理的过程**"]},
]},
]});
SECTIONS.push({id:"spring", title:"Spring面试篇", chapters:[
{name:"Spring基础", qa:[
{q:"说一下你对Spring的理解", a:["Spring 框架核心特性包括：","**IoC 容器**：Spring 通过控制反转实现了对象的创建和对象间的依赖关系管理——开发者只需要定义好 Bean 及其依赖关系，Spring 容器负责创建和组装这些对象","**AOP**：面向切面编程，允许开发者定义横切关注点（例如事务管理、安全控制等），独立于业务逻辑的代码；通过 AOP 可以将这些关注点模块化，提高代码的可维护性和可重用性","**事务管理**：Spring 提供了一致的事务管理接口，支持**声明式和编程式事务**，开发者可以轻松地进行事务管理而无需关心具体的事务 API","**MVC 框架**：Spring MVC 是一个基于 Servlet API 构建的 Web 框架，采用了模型-视图-控制器（MVC）架构，支持灵活的 URL 到页面控制器的映射，以及多种视图技术"]},
{q:"spring的核心思想说说你的理解", a:["**IOC**：解决的问题是**对象创建与依赖管理的高耦合**——由容器管理 Bean 生命周期，实现手段是容器管理 Bean 生命周期，典型应用场景：动态替换数据库实现、服务组装","**DI**：解决的问题是**依赖关系的硬编码问题**——通过 Setter/构造器/注解注入实现，典型应用场景：注入数据源、服务层依赖 DAO 层","**AOP**：解决的问题是**横切逻辑分散在业务代码中**——通过动态代理与切面配置实现，典型应用场景：日志、事务、权限校验统一处理","Spring 通过这 IOC、DI、AOP 三大核心思想，实现了轻量级、高内聚低耦合的企业级应用开发框架，成为 Java 生态中不可或缺的基石"]},
{q:"Spring IoC和AOP介绍一下", a:["**IoC（控制反转）**：它是一种创建和获取对象的技术思想，依赖注入（DI）是实现这种技术的一种方式。传统开发过程中需要**通过 new 关键字创建对象**；使用 IoC 思想开发的话，不通过 new 关键字创建对象，而是**通过 IoC 容器来帮我们实例化对象**，大大降低对象之间的耦合度","**AOP（面向切面编程）**：能够将那些与业务无关、却为业务模块所共同调用的逻辑封装起来，以减少系统的重复代码，降低模块间的耦合度","**Spring AOP 基于动态代理**：如果要代理的对象实现了某个接口，Spring AOP 会使用 **JDK Proxy** 创建代理对象；对于没有实现接口的对象，无法使用 JDK Proxy 代理，此时 Spring AOP 会使用 **Cglib 生成一个被代理对象的子类来作为代理**","**IOC 和 AOP 结合使用**：可以更好地实现代码的模块化和分层管理——通过 IOC 容器管理 Service 层和 DAO 层的依赖关系，然后通过 AOP 在 Service 层实现事务管理、日志记录等横切功能，使得业务逻辑更加清晰和可维护"]},
{q:"Spring的aop介绍一下", a:["Java 是面向对象编程的语言，OOP 中最小的单元是“Class 对象”，但在 AOP 中**最小的单元是“切面”**。一个“切面”可以包含很多种类型和对象，对它们进行模块化管理（例如事务管理）","在面向切面编程的思想中，把功能分为两种：**核心业务**（登录、注册、增删改查）和**周边功能**（日志、事务管理）。核心业务功能和周边功能是分别独立进行开发、两者不耦合的，然后把切面功能和核心业务功能“**编织**”在一起，这就叫 AOP","AOP 概念：**Aspect（切面）**——只是一个概念，没有具体的接口或类与之对应，是 Join point、Advice 和 Pointcut 的统称；**Join point（连接点）**——指程序执行过程中的一个点（方法调用、异常处理等），在 Spring AOP 中**仅支持方法级别的连接点**；**Advice（通知）**——在切面中定义的横切逻辑，有“around”“before”“after”三种类型，在很多 AOP 实现框架中 Advice 通常作为拦截器，也可以包含多个拦截器作为一条链路围绕 Join point 处理；**Pointcut（切点）**——用于匹配连接点，一个切面中包含哪些 Join point 需要由 Pointcut 筛选；**Introduction（引介）**——让一个切面可以声明被通知的对象实现任何他们没有真正实现的额外接口（例如让一个代理对象代理两个目标类）；**Weaving（织入）**——在切点的引导下，将通知逻辑插入到目标方法上，使得通知逻辑在方法调用时得以执行"]},
{q:"IOC和AOP是通过什么机制来实现的", a:["**Spring IOC 实现机制**：**反射**——Spring IOC 容器利用 Java 的反射机制动态地加载类、创建对象实例及调用对象方法，反射允许在运行时检查类、方法、属性等信息，从而实现灵活的对象实例化和管理；**依赖注入**——容器负责管理应用程序组件之间的依赖关系，通过构造函数注入、属性注入或方法注入，将依赖关系描述在配置文件中或使用注解；**设计模式-工厂模式**——容器作为工厂负责实例化 Bean 并管理它们的生命周期；**容器实现**——通常使用 BeanFactory 或 ApplicationContext 管理 Bean，BeanFactory 是 IOC 容器的基本形式提供基本 IOC 功能，ApplicationContext 是 BeanFactory 的扩展提供更多企业级功能","**Spring AOP 实现机制**：依赖于**动态代理技术**——在运行时动态生成代理对象（而不是编译时），允许在运行时指定要代理的接口和行为，实现在不修改源码的情况下增强方法的功能。两种动态代理：**基于 JDK 的动态代理**——使用 java.lang.reflect.Proxy 类和 InvocationHandler 接口实现，需要代理的类实现一个或多个接口；**基于 CGLIB 的动态代理**——当被代理的类没有实现接口时，Spring 使用 CGLIB 库生成被代理类的子类作为代理（CGLIB 是第三方代码生成库，通过继承方式实现代理）"]},
{q:"怎么理解SpringIoc", a:["IOC 即 **Inversion Of Control（控制反转）**，是一种设计思想。在传统的 Java SE 程序设计中，我们直接在对象内部通过 new 的方式来创建对象，是程序主动创建依赖对象；而在 Spring 程序设计中，IOC 是**有专门的容器去控制对象**的——根据配置加载并实例化相关 Bean 保存到 IOC 容器，开发者通过 ApplicationContext.getBean() 从容器中获取 Bean","所谓控制就是对象的**创建、初始化、销毁**：**创建对象**——原来是 new 一个，现在是由 Spring 容器创建；**初始化对象**——原来是对象自己通过构造器或者 setter 方法给依赖的对象赋值，现在是由 Spring 容器自动注入；**销毁对象**——原来是直接给对象赋值 null 或做一些销毁操作，现在是 Spring 容器管理生命周期负责销毁对象","总结：IOC 解决了繁琐的对象生命周期的操作，解耦了我们的代码；所谓反转其实是反转控制权——对象的控制权完全脱离了我们的控制交给了 Spring，我们由对象的控制者变成了 IOC 的被动控制者"]},
{q:"依赖倒置，依赖注入，控制反转分别是什么", a:["**控制反转**：“控制”指的是对程序执行流程的控制，而“反转”指的是在没有使用框架之前，程序员自己控制整个程序的执行；在使用框架之后，整个程序的执行流程通过框架来控制，**流程的控制权从程序员“反转”给了框架**","**依赖注入**：依赖注入和控制反转恰恰相反，它是一种**具体的编码技巧**——不通过 new 的方式在类内部创建依赖类的对象，而是将依赖的类对象在外部创建好之后，通过构造函数、函数参数等方式传递（或注入）给类来使用","**依赖倒置**：这条原则跟控制反转有点类似，主要用来**指导框架层面的设计**——高层模块不依赖低层模块，它们共同依赖同一个抽象；抽象不要依赖具体实现细节，具体实现细节依赖抽象"]},
{q:"依赖注入了解吗？怎么实现依赖注入的", a:["在传统编程中，当一个类需要使用另一个类的对象时，通常会在该类内部通过 new 关键字创建依赖对象，使得类与类之间耦合度较高。而依赖注入则是**将对象的创建和依赖关系的管理交给 Spring 容器来完成**——类只需要声明自己所依赖的对象，容器会在运行时将这些依赖对象注入到类中，从而降低耦合度、提高代码的可维护性和可测试性","常见的实现方式：**构造器注入**——通过构造函数传递依赖对象，保证对象初始化时依赖已就绪（Spring 4.3+ 自动识别单构造器，无需显式 @Autowired）；**Setter 方法注入**——通过 Setter 方法设置依赖，灵活性高，但依赖可能未完全初始化；**字段注入**——直接通过 @Autowired 注解字段，代码简洁但隐藏依赖关系，不推荐生产代码"]},
]},
{name:"循环依赖", qa:[
{q:"spring是如何解决循环依赖的", a:["循环依赖指的是**两个类中的属性相互依赖对方**：例如 A 类中有 B 属性，B 类中有 A 属性，从而形成一个依赖闭环。循环依赖问题在 Spring 中主要有三种情况：①通过构造方法进行依赖注入时产生的循环依赖；②通过 setter 方法注入且在多例（原型）模式下产生的循环依赖；③通过 setter 方法注入且是在单例模式下产生的循环依赖。**只有第三种方式的循环依赖被 Spring 解决了**，其他两种遇到循环依赖时 Spring 都会产生异常","Spring 在 **DefaultSingletonBeanRegistry** 类中维护了三个重要的 Map 缓存（“三级缓存”）：**singletonObjects（一级缓存）**——存放完全初始化好的、可用的 Bean 实例，getBean() 方法最终返回的就是这里面的 Bean（已实例化、属性已填充、初始化方法已执行、AOP 代理如需要也已生成）；**earlySingletonObjects（二级缓存）**——存放提前暴露的 Bean 的原始对象引用或早期代理对象引用，专门用来处理循环依赖（已实例化调了构造函数，但属性尚未填充、初始化尚未执行，可能是原始对象也可能是为解 AOP 代理问题提前生成的代理对象）；**singletonFactories（三级缓存）**——存放 Bean 的 ObjectFactory 工厂对象，是解决循环依赖和 AOP 代理协同工作的关键，getObject() 负责返回该 Bean 的早期引用（可能是原始对象，也可能是提前生成的代理对象）","**处理流程**：第一步，创建 BeanA 的实例并提前暴露工厂——调用构造函数实例化得到原始对象，紧接着将 ObjectFactory 存入三级缓存；第二步，填充 BeanA 的属性时触发 BeanB 的创建——同样实例化 BeanB 并把其工厂存入三级缓存；第三步，BeanB 属性注入时发现循环依赖——在一级、二级缓存中均未找到 BeanA，最终在三级缓存定位到 BeanA 的工厂，调用 getObject()：若 BeanA 需要 AOP 代理则动态生成代理对象，无需代理则返回原始对象，得到早期引用放入二级缓存并清理三级缓存条目，注入 BeanB；第四步，完成 BeanB 生命周期——执行初始化方法后提升到一级缓存；第五步，回溯完成 BeanA 构建——将完备的 BeanB 注入 BeanA，执行 BeanA 初始化（若之前生成过早期代理则复用二级缓存中的代理对象），完全初始化的 BeanA 入驻一级缓存，循环闭环完成","**精髓**：三级缓存工厂（singletonFactories）负责在实例化后立刻暴露对象生成能力，兼顾 AOP 代理的提前生成；二级缓存（earlySingletonObjects）临时存储已确定的早期引用，避免重复生成代理；一级缓存（singletonObjects）最终交付完整 Bean。整个机制通过中断初始化流程、逆向注入半成品、延迟代理生成三大策略，将循环依赖的死结转化为有序的接力协作。**注意：此方案仅适用于 Setter/Field 注入的单例 Bean，构造器注入因必须在实例化前获得依赖，仍会导致无解的死锁**"]},
{q:"Spring为什么用3级缓存解决循环依赖问题？用2级缓存不行吗", a:["**Spring 必须用三级缓存解决循环依赖，核心是为了正确处理需要 AOP 代理的 Bean**。如果只用二级缓存，会导致注入的对象形态错误，甚至破坏单例原则","举个例子：假设 Bean A 依赖 B，B 又依赖 A，且 A 需要被动态代理（比如加了 @Transactional）。如果只有二级缓存，当 B 创建时去注入 A，拿到的是 A 的**原始对象**；但 A 在后续初始化完成后才会生成代理对象，结果就是：B 拿着原始对象 A，而 Spring 容器里存的是代理对象 A——**同一个 Bean 出现了两个不同实例，直接违反了单例的核心约束**","三级缓存中的 ObjectFactory 就是解决这个问题的关键：它不是直接缓存对象，而是存了一个**能生产对象的工厂**。当发生循环依赖时，调用这个工厂的 getObject() 方法，Spring 会智能判断——如果这个 Bean 最终需要代理，就提前生成代理对象并放入二级缓存；如果不需要代理，就返回原始对象。这样一来，B 注入的 A 就是最终形态（可能是代理对象），后续 A 初始化完成后也不会再创建新代理，**保证了对象全局唯一**","简单说，三级缓存的本质是“**按需延迟生成正确引用**”——既维持了 Bean 生命周期的完整性（正常流程在初始化后生成代理），又在循环依赖时特殊处理避免逻辑矛盾；而二级缓存缺乏这种动态决策能力，因此无法替代三级缓存"]},
{q:"spring三级缓存的数据结构是什么", a:["都是 **Map 类型的缓存**，比如 Map<name, bean>：","**一级缓存（Singleton Objects）**：Map 类型，存储已经完全初始化好的 bean（完全准备好可以使用的实例），键是 bean 的名称、值是 bean 的实例，在 DefaultSingletonBeanRegistry 类中的 singletonObjects 属性中","**二级缓存（Early Singleton Objects）**：Map 类型，存储早期的 bean 引用（已经实例化但还未完全初始化的 bean，可能还没有进行属性注入等操作），在 earlySingletonObjects 属性中","**三级缓存（Singleton Factories）**：Map 类型，存储 ObjectFactory 对象，这些对象可以生成早期的 bean 引用——当一个 bean 正在创建过程中被其他 bean 依赖时，就会通过这个 ObjectFactory 创建一个早期引用，从而解决循环依赖问题，在 singletonFactories 属性中"]},
]},
{name:"设计模式与注解", qa:[
{q:"spring框架中都用到了哪些设计模式", a:["**工厂设计模式**：Spring 使用工厂模式通过 BeanFactory、ApplicationContext 创建 bean 对象","**代理设计模式**：Spring AOP 功能的实现","**单例设计模式**：Spring 中的 Bean 默认都是单例的","**模板方法模式**：Spring 中 jdbcTemplate、hibernateTemplate 等以 Template 结尾的对数据库操作的类使用了模板模式","**包装器设计模式**：项目需要连接多个数据库且不同客户每次访问根据需要访问不同数据库，这种模式让我们可以根据客户需求动态切换不同的数据源","**观察者模式**：Spring 事件驱动模型是观察者模式很经典的一个应用","**适配器模式**：Spring AOP 的增强或通知（Advice）使用到了适配器模式，Spring MVC 中也用到适配器模式适配 Controller"]},
{q:"spring常用注解有什么", a:["**@Autowired**：主要用于自动装配 bean——当 Spring 容器中存在与要注入的属性类型匹配的 bean 时，它会自动将 bean 注入到属性中","**@Component**：用于标记一个类作为 Spring 的 bean，被标记后 Spring 会将其实例化为一个 bean 并添加到 Spring 容器中","**@Configuration**：用于标记一个类作为 Spring 的配置类，配置类可以包含 @Bean 注解的方法，作为全局配置","**@Bean**：用于标记一个方法作为 Spring 的 bean 工厂方法，Spring 会将该方法的返回值作为一个 bean 添加到容器中，自定义配置时经常用到","**@Service**：标记一个类作为服务层的组件，是 @Component 注解的特例，一般标记在业务 service 的实现类","**@Repository**：标记一个类作为数据访问层的组件，也是 @Component 的特例，这个注解很容易被忽略导致数据库无法访问","**@Controller**：标记一个类作为控制层的组件，是 MVC 结构的另一个部分，加在控制层","**@RestController**：结合 @Controller 和 @ResponseBody，返回 RESTful 风格的数据","**@Value**：注入配置属性值","**@RequestMapping/@GetMapping/@PostMapping/@PutMapping/@DeleteMapping**：映射 HTTP 请求路径到 Controller 的处理方法"]},
]},
{name:"事务", qa:[
{q:"Spring的事务什么情况下会失效", a:["**① 未捕获异常**：如果一个事务方法中发生了未捕获的异常，并且异常未被处理或传播到事务边界之外，那么事务会失效，所有的数据库操作会回滚","**② 非受检异常**：默认情况下，Spring 对非受检异常（RuntimeException 或其子类）进行回滚处理，这意味着当事务方法中抛出这些异常时，事务会回滚","**③ 事务传播属性设置不当**：如果在多个事务之间存在事务嵌套，且事务传播属性配置不正确，可能导致事务失效，特别是在方法内部调用有 @Transactional 注解的方法时要特别注意","**④ 多数据源的事务管理**：如果在使用多数据源时，事务管理没有正确配置或者存在多个 @Transactional 注解时，可能会导致事务失效","**⑤ 跨方法调用事务问题**：如果一个事务方法内部调用另一个方法，而这个被调用的方法没有 @Transactional 注解，这种情况下外层事务可能会失效","**⑥ 事务在非公开方法中失效**：如果 @Transactional 注解标注在私有方法上或者非 public 方法上，事务也会失效"]},
{q:"Spring的事务，使用this调用是否生效", a:["**不能生效**。","因为 Spring 事务是通过**代理对象**来控制的，只有通过代理对象的方法调用才会应用事务管理的相关规则；当使用 this 直接调用时，是**绕过了 Spring 的代理机制**，因此不会应用事务设置"]},
]},
{name:"Bean生命周期", qa:[
{q:"Bean的生命周期说一下", a:["整体流程：**启动 ApplicationContext → 创建 BeanFactory → 初始化 BeanFactory → 执行 BeanFactory 后置处理器（扫描就是在执行 BeanFactory 后置处理器过程中进行的）→ 进行扫描 → 生成 BeanDefinition → 合并 BeanDefinition → 加载类 → 实例化前 → 推断构造方法 → 实例化 → BeanDefinition 的后置处理 → 实例化后 → 填充属性 → 填充属性后 → 执行 Aware → 初始化前 → 初始化 → 初始化后**","详细步骤：1. Spring 启动，查找并加载需要被 Spring 管理的 bean，进行 Bean 的实例化；2. Bean 实例化后将 Bean 的引入和值注入到 Bean 的属性中；3. 如果 Bean 实现了 BeanNameAware 接口，Spring 将 Bean 的 Id 传递给 setBeanName() 方法；4. 如果 Bean 实现了 BeanFactoryAware 接口，Spring 将调用 setBeanFactory() 方法，将 BeanFactory 容器实例传入；5. 如果 Bean 实现了 ApplicationContextAware 接口，Spring 将调用 setApplicationContext() 方法，将 bean 所在应用上下文引用传入","6. 如果 Bean 实现了 BeanPostProcessor 接口，Spring 将调用他们的 postProcessBeforeInitialization() 方法；7. 如果 Bean 实现了 InitializingBean 接口，Spring 将调用 afterPropertiesSet() 方法；类似的，如果 bean 使用 init-method 声明了初始化方法，该方法也会被调用；8. 如果 Bean 实现了 BeanPostProcessor 接口，Spring 将调用 postProcessAfterInitialization() 方法","9. 此时 Bean 已经准备就绪，可以被应用程序使用了，他们将一直驻留在应用上下文中直到应用上下文被销毁；10. 如果 bean 实现了 DisposableBean 接口，Spring 将调用它的 destroy() 接口方法；同样，如果 bean 使用了 destroy-method 声明销毁方法，该方法也会被调用"]},
{q:"Bean是否单例", a:["**Spring 中的 Bean 默认都是单例的**——每个 Bean 的实例只会被创建一次，并且会被存储在 Spring 容器的缓存中，以便在后续的请求中重复使用，这种单例模式可以提高应用程序的性能和内存效率","Spring 也支持将 Bean 设置为**多例模式**（每次请求都会创建一个新的 Bean 实例），可以在 Bean 定义中通过设置 **scope 属性为 \"prototype\"** 来实现","注意：虽然在创建状态不可变的 Bean 或有状态 Bean 时使用多例模式更为合适，但如果 **Bean 单例是有状态的，在使用时需要考虑线程安全性问题**"]},
{q:"Bean的单例和非单例，生命周期是否一样", a:["**不一样的**。Spring Bean 的生命周期完全由 IoC 容器控制，**Spring 只帮我们管理单例模式 Bean 的完整生命周期，对于 prototype 的 Bean，Spring 在创建好交给使用者之后则不会再管理后续的生命周期**","**创建时机**：单例——容器启动时创建（或首次请求时，取决于配置）；非单例——每次请求时创建新实例","**初始化流程**：单例——完整执行生命周期流程（属性注入、Aware 接口、初始化方法等）；非单例——每次创建新实例时都会完整执行生命周期流程（仅到初始化完成）","**销毁时机**：单例——容器关闭时销毁，触发 DisposableBean 或 destroy-method；非单例——容器不管理销毁，需由调用者自行释放资源（Spring 不跟踪实例）","**内存占用**：单例——单实例常驻内存，高效但需注意线程安全；非单例——每次请求生成新实例，内存开销较大，需手动管理资源释放","**适用场景**：单例——无状态服务（如 Service、DAO 层）；非单例——有状态对象（如用户会话、临时计算对象）"]},
{q:"Spring bean的作用域有哪些", a:["**Singleton（单例）**：在整个应用程序中只存在一个 Bean 实例，默认作用域，容器中只会创建一个实例并在整个生命周期中共享","**Prototype（原型）**：每次请求时都会创建一个新的 Bean 实例，适用于状态非常瞬时的 Bean","**Request（请求）**：每个 HTTP 请求都会创建一个新的 Bean 实例，仅在 Spring Web 应用程序中有效，适用于 Web 应用中需求局部性的 Bean","**Session（会话）**：Session 范围内只会创建一个 Bean 实例，在用户会话范围内共享，仅在 Spring Web 应用程序中有效，适用于与用户会话相关的 Bean","**Application**：当前 ServletContext 中只存在一个 Bean 实例，在整个 ServletContext 范围内共享，仅 Web 应用有效","**WebSocket**：在 WebSocket 范围内只存在一个 Bean 实例，仅在支持 WebSocket 的应用程序中有效","**Custom scopes（自定义作用域）**：Spring 允许开发者通过实现 Scope 接口来创建新的 Bean 作用域"]},
{q:"Spring容器里存的是什么", a:["在 Spring 容器中，存储的**主要是 Bean 对象**","Bean 是 Spring 框架中的基本组件，用于表示应用程序中的各种对象。当应用程序启动时，Spring 容器会根据配置文件或注解的方式创建和管理这些 Bean 对象，负责**创建、初始化、注入依赖以及销毁** Bean 对象"]},
{q:"在Spring中，在bean加载/销毁前后，如果想实现某些逻辑，可以怎么做", a:["① **XML 配置 init-method 和 destroy-method 属性**：在 XML 配置中通过 init-method 和 destroy-method 属性指定 Bean 初始化后和销毁前需要调用的方法（如 <bean id=\"myBean\" class=\"com.example.MyBeanClass\" init-method=\"init\" destroy-method=\"destroy\"/>）","② **实现 InitializingBean 和 DisposableBean 接口**：实现 org.springframework.beans.factory.InitializingBean 和 DisposableBean 接口，分别实现 afterPropertiesSet 和 destroy 方法","③ **使用 @PostConstruct 和 @PreDestroy 注解**：在方法上加 @PostConstruct（初始化逻辑）和 @PreDestroy（销毁逻辑）注解","④ **@Bean 注解的 initMethod 和 destroyMethod 属性**：在基于 Java 的配置中，可以在 @Bean 注解中指定 initMethod 和 destroyMethod 属性"]},
]},
{name:"扩展点与SpringMVC", qa:[
{q:"Spring给我们提供了很多扩展点，这些有了解吗", a:["**1. BeanFactoryPostProcessor**：允许在 Spring 容器实例化 bean 之前**修改 bean 的定义**，常用于修改 bean 属性或改变 bean 的作用域","**2. BeanPostProcessor**：可以在 bean 实例化、配置以及初始化之后对其进行额外处理，常用于**代理 bean**、修改 bean 属性等","**3. PropertySource**：用于定义不同的属性源（如文件、数据库等），以便在 Spring 应用中使用","**4. ImportSelector 和 ImportBeanDefinitionRegistrar**：用于根据条件**动态注册 bean 定义**，实现配置类的模块化","**5. HandlerInterceptor**：Spring MVC 中用于拦截处理请求，可以在请求处理前、处理中和处理后执行特定逻辑","**6. ControllerAdvice**：用于全局处理控制器的异常、数据绑定和数据校验","**7. Spring Boot 的自动配置**：通过创建自定义的自动配置类，可以实现对框架和第三方库的自动配置","**8. 自定义注解**：创建自定义注解，用于实现特定功能或约定，如权限控制、日志记录等"]},
{q:"MVC分层介绍一下", a:["MVC 全名是 **Model View Controller**（模型-视图-控制器），是一种软件设计典范，用业务逻辑、数据、界面显示分离的方法组织代码，将业务逻辑聚集到一个部件里面，在改进和个性化定制界面及用户交互的同时，不需要重新编写业务逻辑","**视图（view）**：为用户提供使用界面，与用户直接进行交互","**模型（model）**：代表一个存取数据的对象或 JAVA POJO（Plain Old Java Object），也可以带有逻辑，主要用于承载数据，并对用户提交请求进行计算。模型分为两类——**数据承载 Bean**（实体类如 User 类，专门为用户承载业务数据）和**业务处理 Bean**（Service 或 Dao 对象，专门用于处理用户提交请求）","**控制器（controller）**：用于将用户请求转发给相应的 Model 进行处理，并根据 Model 的计算结果向用户提供相应响应，它使视图与模型分离"]},
{q:"了解SpringMVC的处理流程吗", a:["**1. 用户发送请求至前端控制器 DispatcherServlet**；**2. DispatcherServlet 收到请求调用处理器映射器 HandlerMapping**；**3. HandlerMapping 根据请求 url 找到具体的处理器，生成处理器执行链 HandlerExecutionChain（包括处理器对象和处理器拦截器）一并返回给 DispatcherServlet**","**4. DispatcherServlet 根据处理器 Handler 获取处理器适配器 HandlerAdapter 执行**，HandlerAdapter 处理一系列操作，如：参数封装、数据格式转换、数据验证等；**5. 执行处理器 Handler（Controller，也叫页面控制器）**；**6. Handler 执行完成返回 ModelAndView**","**7. HandlerAdapter 将 Handler 执行结果 ModelAndView 返回到 DispatcherServlet**；**8. DispatcherServlet 将 ModelAndView 传给 ViewResolver 视图解析器**；**9. ViewResolver 解析后返回具体 View**；**10. DispatcherServlet 对 View 进行渲染视图**（即将模型数据 model 填充至视图中）；**11. DispatcherServlet 响应用户**"]},
{q:"Handlermapping和handleradapter有了解吗", a:["**HandlerMapping**：作用——负责将请求映射到处理器（Controller）；功能——根据请求的 URL、请求参数等信息找到处理请求的 Controller；类型——Spring 提供了多种实现，如 **BeanNameUrlHandlerMapping、RequestMappingHandlerMapping** 等；工作流程——根据请求信息确定要请求的处理器","**HandlerAdapter**：作用——负责调用处理器（Controller）来处理请求；功能——处理器可能有不同的接口类型（Controller 接口、HttpRequestHandler 接口等），HandlerAdapter 根据处理器的类型选择合适的方法来调用处理器；类型——Spring 提供了多个 HandlerAdapter 实现，用于适配不同类型的处理器","**工作流程**：1. 客户端发送请求时，HandlerMapping 根据请求信息找到对应的处理器（Controller）；2. HandlerAdapter 根据处理器的类型选择合适的方法来调用处理器；3. 处理器执行相应的业务逻辑生成 ModelAndView；4. HandlerAdapter 将处理器的执行结果包装成 ModelAndView；5. 视图解析器根据 ModelAndView 找到对应的视图进行渲染；6. 将渲染后的视图返回给客户端。两者协同工作，实现了请求处理的流程，灵活性使得 Spring MVC 支持多种处理器和处理方式，提高了框架的扩展性和适应性"]},
]},
{name:"SpringBoot", qa:[
{q:"为什么使用springboot", a:["**简化开发**：Spring Boot 通过提供一系列的开箱即用的组件和自动配置，简化了项目的配置和开发过程，开发人员可以更专注于业务逻辑的实现，而不需要花费过多时间在繁琐的配置上","**快速启动**：Spring Boot 提供了快速的应用程序启动方式，可通过内嵌的 Tomcat、Jetty 或 Undertow 等容器快速启动应用程序，无需额外的部署步骤，方便快捷","**自动化配置**：Spring Boot 通过自动配置功能，根据项目中的依赖关系和约定俗成的规则来配置应用程序，减少了配置的复杂性，使开发者更容易实现应用的最佳实践"]},
{q:"SpringBoot比Spring好在哪里", a:["**自动化配置**：Spring Boot 提供了自动化配置，大大简化了项目的配置过程，通过约定优于配置的原则，很多常用的配置可以自动完成，开发者可以专注于业务逻辑的实现","**快速的项目启动器**：通过引入不同的 Starter，可以快速集成常用的框架和库（如数据库、消息队列、Web 开发等），极大地提高了开发效率","**内置多种服务器**：Spring Boot 默认集成了多种内嵌服务器（如 Tomcat、Jetty、Undertow），无需额外配置，即可将应用打包成可执行的 JAR 文件，方便部署和运行"]},
{q:"SpringBoot用到哪些设计模式", a:["**代理模式**：Spring 的 AOP 通过动态代理实现方法级别的切面增强，有静态和动态两种代理方式，采用动态代理方式","**策略模式**：Spring AOP 支持 JDK 和 Cglib 两种动态代理实现方式，通过策略接口和不同策略类，运行时动态选择，其创建一般通过工厂方法实现","**装饰器模式**：Spring 用 TransactionAwareCacheDecorator 解决缓存与数据库事务问题，增加对事务的支持","**单例模式**：Spring Bean 默认是单例模式，通过单例注册表（如 HashMap）实现","**简单工厂模式**：Spring 中的 BeanFactory 是简单工厂模式的体现，通过工厂类方法获取 Bean 实例","**工厂方法模式**：Spring 中的 FactoryBean 体现工厂方法模式，为不同产品提供不同工厂","**观察者模式**：包含 Event 事件、Listener 监听者、Publisher 发送者，通过定义事件、监听器和发送者实现，观察者注册在 ApplicationContext 中，消息发送由 ApplicationEventMulticaster 完成","**模板模式**：Spring Bean 的创建过程涉及模板模式，体现扩展性，类似 Callback 回调实现方式","**适配器模式**：Spring MVC 中针对不同方式定义的 Controller，利用适配器模式统一函数定义，定义了统一接口 HandlerAdapter 及对应适配器类"]},
{q:"怎么理解SpringBoot中的约定大于配置", a:["约定大于配置是 Spring Boot 的**核心设计理念**，它通过预设合理的默认行为和项目规范，大幅减少开发者需要手动配置的步骤，从而提升开发效率和项目标准化程度，可以从三个方面理解：","**自动化配置**：Spring Boot 提供大量自动化配置，通过分析项目的依赖和环境自动配置应用程序的行为，开发者无需显式配置每个细节——例如引入 spring-boot-starter-web 后，Spring Boot 会自动配置内嵌 Tomcat 和 Spring MVC，无需手动编写 XML","**默认配置**：Spring Boot 为诸多方面提供大量默认配置，如连接数据库、设置 Web 服务器、处理日志等——例如默认的日志配置可让应用程序快速输出日志信息，无需开发者额外繁琐配置日志级别、输出格式与位置等","**约定的项目结构**：Spring Boot 提倡特定项目结构，通常主应用程序类（含 main 方法）置于根包，控制器类、服务类、数据访问类等分别放在相应子包（如 com.example.demo.controller 放控制器类、com.example.demo.service 放服务类），此约定使团队成员更易理解项目结构，新成员能快速定位各功能代码位置，提升协作效率"]},
{q:"SpringBoot的项目结构是怎么样的", a:["按《阿里巴巴Java开发手册》一个正常企业项目通用的分层指导意见：**开放接口层**（可直接封装 Service 接口暴露成 RPC 接口、通过 Web 封装成 http 接口、网关控制层等）、**终端显示层**（各个端的模板渲染并执行显示的层，如 velocity 渲染、JS 渲染、JSP 渲染、移动端展示）、**请求处理层（Web 层）**（对访问控制进行转发、各类基本参数校验、不复用的业务简单处理）、**业务逻辑层（Service 层）**（相对具体的业务逻辑服务层）、**通用逻辑层（Manager 层）**（①对第三方平台封装的层，预处理返回结果及转化异常信息、适配上层接口；②对 Service 层通用能力的下沉，如缓存方案、中间件通用处理；③与 DAO 层交互，对多个 DAO 的组合复用）、**数据持久层（DAO 层）**（与底层 MySQL、Oracle、Hbase、OceanBase 等进行数据交互）、**第三方服务**（其它部门 RPC 服务接口、基础平台、其它公司 HTTP 接口）、**数据存储系统**与**外部数据接口**","**用户请求流转**：用户 → 页面（前后端分离则独立页面和路由，不分离则页面由后台驱动/渲染）→ Controller（控制层，负责请求/响应控制，调用 Service 层业务逻辑，返回装填好数据的页面或数据到前端，控制层与服务层之间用 DTO/VO 传输）→ Service 层（真正的业务逻辑处理层，一般分 Service 接口 + Service 实现，面向接口编程，调用 DAO 层，服务层与 DAO 层之间用 DO/Entity 传输）→ DAO（数据操作层/mapper 层，向数据库发送 SQL 语句）→ SQL → 数据库"]},
{q:"SpringBoot自动装配原理是什么", a:["SpringBoot 的自动装配原理是**基于 Spring Framework 的条件化配置和 @EnableAutoConfiguration 注解**实现的——这种机制允许开发者在项目中引入相关依赖，SpringBoot 将根据这些依赖自动配置应用程序的上下文和功能","SpringBoot 定义了一套接口规范：**启动时会扫描外部引用 jar 包中的 META-INF/spring.factories 文件，将文件中配置的类型信息加载到 Spring 容器（涉及 JVM 类加载机制与 Spring 容器知识），并执行类中定义的各种操作**。对于外部 jar，只需要按照 SpringBoot 定义的标准，就能将自己的功能装置进 SpringBoot","**@SpringBootApplication 注解内部**：@Target({ElementType.TYPE})（指定注解可以用来标记在类上，标记配置类）、@Retention(RetentionPolicy.RUNTIME)（指定注解生命周期在运行时保留，因为 SpringBoot 在运行时扫描类路径上的注解实现自动配置）、@Documented（包含在 Java 文档中）、@Inherited（注解可被继承）、@SpringBootConfiguration（表明这是 Spring Boot 配置类，与标准 @Configuration 没啥区别，只是专门用于 SpringBoot 的配置）、**@EnableAutoConfiguration**（Spring Boot 自动装配的核心，告诉 Spring Boot 启用自动配置机制，根据项目依赖和配置自动配置应用程序的上下文）、**@ComponentScan**（配置组件扫描规则，在指定包及其子包中查找组件，excludeFilters 参数指定排除哪些组件，这里使用 TypeExcludeFilter 和 AutoConfigurationExcludeFilter 两个自定义过滤器）","**@EnableAutoConfiguration 内部**：**@AutoConfigurationPackage**——将项目 src/main 包下的所有组件注册到容器中（如标注了 Component 注解的类等）；**@Import({AutoConfigurationImportSelector.class})**——自动装配的核心。AutoConfigurationImportSelector 实现 ImportSelector 接口：①**扫描类路径**——扫描 META-INF/spring.factories 文件（getCandidateConfigurations 方法），获取所有实现了 AutoConfiguration 接口的自动配置类；②**条件判断/过滤**——使用条件判断机制（通常通过 @ConditionalOnXxx 注解，条件可以是配置属性、类是否存在、Bean 是否存在等）过滤掉不满足条件的自动配置类（filter 方法）；③**排序**——根据 @AutoConfigureOrder 和 @AutoConfigureAfter/@AutoConfigureBefore 注解指定的顺序排序（sort 方法）；④**导入**——将满足条件的自动配置类的类名数组返回，导入到应用程序上下文中"]},
{q:"说几个启动器（starter）", a:["**spring-boot-starter-web**：最常用的起步依赖之一，包含 Spring MVC 和 Tomcat 嵌入式服务器，用于快速构建 Web 应用程序","**spring-boot-starter-security**：提供 Spring Security 的基本配置，帮助开发者快速实现应用的安全性，包括认证和授权功能","**mybatis-spring-boot-starter**：由 MyBatis 团队提供，用于简化在 Spring Boot 应用中集成 MyBatis——自动配置了 MyBatis 的相关组件（包括 SqlSessionFactory、MapperScannerConfigurer 等），使开发者能快速开始使用 MyBatis 进行数据库操作","**spring-boot-starter-data-jpa**：包含 Hibernate 等 JPA 实现以及数据库连接池等必要库，可轻松与 MySQL 数据库交互；如果倾向于直接使用 JDBC 而不通过 JPA，可以使用 **spring-boot-starter-jdbc**（提供基本的 JDBC 支持）","**spring-boot-starter-data-redis**：用于集成 Redis 缓存和数据存储服务，包含与 Redis 交互所需的客户端（默认是 Jedis 客户端，也可以配置为 Lettuce 客户端）以及 Spring Data Redis 的支持","**spring-boot-starter-test**：包含单元测试和集成测试所需的库（如 JUnit、Spring Test、AssertJ 等），便于进行测试驱动开发（TDD）"]},
{q:"写过SpringBoot starter吗", a:["**步骤 1：创建 Maven 项目**——在 pom.xml 中添加 Spring Boot 的 starter parent（spring-boot-starter-parent）和一些必要的依赖（如 spring-boot-starter-web）","**步骤 2：添加自动配置**——在 src/main/resources/META-INF/spring.factories 中添加自动配置的元数据（org.springframework.boot.autoconfigure.EnableAutoConfiguration=com.example.starter.MyAutoConfiguration）；然后创建 MyAutoConfiguration 类，该类需要 **@Configuration 和 @EnableConfigurationProperties** 注解（用于启用定义的配置属性类），并在其中用 @Bean 创建服务 Bean","**步骤 3：创建配置属性类**——创建配置属性类，使用 **@ConfigurationProperties(prefix = \"my\")** 注解来绑定配置文件中的属性","**步骤 4：创建服务和控制器**——创建一个服务类和服务实现类（@Service 接口 + 实现类，构造器注入 MyProperties），以及一个控制器（@RestController + @GetMapping(\"/name\")）来展示 starter 的功能","**步骤 5：发布 Starter**——将 starter 发布到 Maven 仓库，无论是私有的还是公共的（如 Nexus 或 Maven Central）","**步骤 6：使用 Starter**——在主应用的 pom.xml 中添加 starter 依赖，然后在 application.yml 或 application.properties 中配置属性（如 my: name: Hello World）"]},
{q:"SpringBoot里面有哪些重要的注解？还有一个配置相关的注解是哪个", a:["**@SpringBootApplication**：用于标注主应用程序类，标识一个 Spring Boot 应用程序的入口点，同时启用自动配置和组件扫描","**@Controller**：标识控制器类，处理 HTTP 请求；**@RestController**：结合 @Controller 和 @ResponseBody，返回 RESTful 风格的数据","**@Service**：标识服务类，通常用于标记业务逻辑层；**@Repository**：标识数据访问组件，通常用于标记数据访问层","**@Component**：通用的 Spring 组件注解，表示一个受 Spring 管理的组件；**@Autowired**：用于自动装配 Spring Bean；**@Value**：用于注入配置属性值","**@RequestMapping**：用于映射 HTTP 请求路径到 Controller 的处理方法；**@GetMapping、@PostMapping、@PutMapping、@DeleteMapping**：简化 @RequestMapping 的 GET、POST、PUT 和 DELETE 请求","**配置相关的注解是 @Configuration**：用于指定一个类为配置类，其中定义的 bean 会被 Spring 容器管理，通常与 @Bean 配合使用（@Bean 用于声明一个 Bean 实例，由 Spring 容器进行管理）"]},
{q:"springboot怎么开启事务", a:["在 Spring Boot 中开启事务非常简单，**只需在服务层的方法上添加 @Transactional 注解即可**","例如在 UserServiceImpl 的 saveUser 方法上加 @Transactional：当调用 saveUser() 方法时，Spring 就会自动为该方法开启一个事务——**如果方法执行成功，事务会自动提交；如果方法执行失败，事务会自动回滚**"]},
{q:"Springboot怎么做到导入就可以直接使用的", a:["主要依赖于**自动配置、起步依赖和条件注解**等特性：","**起步依赖**：一种特殊的 Maven 或 Gradle 依赖，将项目所需的一系列依赖打包在一起——例如 spring-boot-starter-web 起步依赖就包含了 Spring Web MVC、Tomcat 等构建 Web 应用所需的核心依赖；开发者只需添加一个起步依赖，Maven 或 Gradle 就会自动下载并管理与之关联的所有依赖，避免了手动添加大量依赖的繁琐过程","**自动配置**：Spring Boot 的自动配置机制会根据**类路径下的依赖和开发者的配置**，自动创建和配置应用所需的 Bean——它通过 **@EnableAutoConfiguration** 注解启用，该注解会触发 Spring Boot 去查找 META-INF/spring.factories 文件；文件中定义了一系列自动配置类，Spring Boot 会根据当前项目的依赖情况选择合适的自动配置类加载（例如项目中包含 spring-boot-starter-web 依赖，Spring Boot 会加载 WebMvcAutoConfiguration 类，自动配置 DispatcherServlet、视图解析器等 Spring MVC 组件）；开发者可以通过自定义配置覆盖自动配置的默认行为（在 application.properties 或 application.yml 中定义特定配置，或在代码中定义同名 Bean，Spring Boot 会优先使用开发者的配置）","**条件注解**：用于控制 Bean 的创建和加载，只有在满足特定条件时才会创建相应的 Bean——如 **@ConditionalOnClass**（只有当类路径中存在指定的类时才会创建该 Bean，例如 WebMvcAutoConfiguration 上的 @ConditionalOnClass({ Servlet.class, DispatcherServlet.class, WebMvcConfigurer.class })）、**@ConditionalOnMissingBean** 等"]},
{q:"SpringBoot过滤器和拦截器说一下", a:["**过滤器（Filter）**：属于 **Servlet 规范**（javax.servlet.Filter）——作用范围**全局**（所有请求、静态资源）；执行顺序在 **Servlet 之前执行**；**无法直接注入 Spring Bean**（需间接获取）；doFilter() 在请求前/响应后被调用；适用场景：全局请求处理（编码、日志、安全）","**拦截器（Interceptor）**：属于 **Spring MVC 框架**（org.springframework.web.servlet.HandlerInterceptor）——作用范围 **Controller 层**（仅拦截 Spring 管理的请求）；执行顺序在 **DispatcherServlet 之后、Controller 方法前后执行**；**支持自动注入 Spring Bean**；preHandle、postHandle、afterCompletion 分阶段触发；适用场景：业务逻辑相关的处理（权限、参数校验）","**执行顺序**：过滤器是 Java Servlet 规范的一部分，可对进入 Servlet 容器的请求和响应进行预处理和后处理——请求进入 Servlet 容器时，按配置顺序依次经过各个过滤器，然后再到达目标 Servlet 或控制器；响应返回时，也按照相反的顺序再次经过这些过滤器。拦截器是 Spring 框架提供的机制——请求到达控制器时先经过 preHandle 方法，返回 true 则继续执行后续控制器方法和其他拦截器；控制器方法执行完成后调用 postHandle；请求处理完成后调用 afterCompletion"]},
]},
{name:"MyBatis", qa:[
{q:"与传统的JDBC相比，MyBatis的优点", a:["**基于 SQL 语句编程，相当灵活**：不会对应用程序或者数据库的现有设计造成任何影响，SQL 写在 XML 里，解除 sql 与程序代码的耦合，便于统一管理","**提供 XML 标签，支持编写动态 SQL 语句，并可重用**","**与 JDBC 相比，减少了 50% 以上的代码量**：消除了 JDBC 大量冗余的代码，不需要手动开关连接","**很好的与各种数据库兼容**：因为 MyBatis 使用 JDBC 来连接数据库，所以只要 JDBC 支持的数据库 MyBatis 都支持","**能够与 Spring 很好的集成**，开发效率高","**提供映射标签**：支持对象与数据库的 ORM 字段关系映射；提供对象关系映射标签，支持对象关系组件维护"]},
{q:"MyBatis觉得在哪方面做的比较好", a:["**SQL 与代码解耦，灵活可控**：MyBatis 允许开发者直接编写和优化 SQL，相比全自动 ORM（如 Hibernate），MyBatis 让开发者明确知道每条 SQL 的执行逻辑，便于性能调优","**动态 SQL 的强大支持**：可以动态拼接 SQL，通过 <if>、<choose>、<foreach> 等标签动态生成 SQL，避免 Java 代码中繁琐的字符串拼接","**自动映射与自定义映射结合**：自动将查询结果字段名与对象属性名匹配（如驼峰转换），也支持 resultMap 自定义映射（如关联查询用户与角色）","**与 Spring 生态无缝集成**：通过 @MapperScan 快速扫描 Mapper 接口，结合 Spring 事务管理，配置简洁高效","**插件扩展机制**：可编写插件拦截 SQL 执行过程，实现分页、性能监控、SQL 改写等通用逻辑"]},
{q:"还记得JDBC连接数据库的步骤吗", a:["**1. 加载数据库驱动程序**：在使用 JDBC 连接数据库之前，需要加载相应的数据库驱动程序，可以通过 Class.forName(\"com.mysql.cj.jdbc.Driver\") 加载 MySQL 数据库驱动程序（不同数据库的驱动类名会有所不同）","**2. 建立数据库连接**：使用 DriverManager 类的 getConnection(url, username, password) 方法连接数据库，其中 url 是数据库的连接字符串（包括数据库类型、主机、端口等）、username 是数据库用户名、password 是密码","**3. 创建 Statement 对象**：通过 Connection 对象的 createStatement() 方法创建一个 Statement 对象，用于执行 SQL 查询或更新操作","**4. 执行 SQL 查询或更新操作**：使用 Statement 对象的 executeQuery(sql) 方法执行 SELECT 查询操作，或者使用 executeUpdate(sql) 方法执行 INSERT、UPDATE 或 DELETE 操作","**5. 处理查询结果**：如果是 SELECT 查询操作，通过 ResultSet 对象处理查询结果——使用 ResultSet 的 next() 方法遍历查询结果集，然后通过 getXXX() 方法获取各个字段的值","**6. 关闭连接**：完成数据库操作后逐级关闭数据库连接相关对象，即**先关闭 ResultSet，再关闭 Statement，最后关闭 Connection**","注意：在实际应用中，需要进行异常处理以确保资源的正确释放，以及使用 try-with-resources 来简化代码和确保资源的及时关闭"]},
{q:"如果项目中要用到原生的mybatis去查询，该怎样写", a:["**步骤概述**：1. 配置 MyBatis；2. 创建实体类；3. 编写 SQL 映射文件；4. 编写 DAO 接口；5. 编写具体的 SQL 查询语句；6. 调用查询方法","**详细步骤**：**① 配置 MyBatis**——在配置文件中配置数据源、MyBatis 的 Mapper 文件位置等信息；**② 创建实体类**——创建与数据库表对应的实体类，字段名和类型需与数据库表保持一致（如 User 类含 id、username、email 字段及 getters/setters）；**③ 编写 SQL 映射文件**——在 resources 目录下创建 XML 文件，定义 SQL 语句和映射关系（<mapper namespace=\"com.example.dao.UserMapper\">，<select id=\"selectUserById\" resultType=\"com.example.model.User\">SELECT * FROM users WHERE id = #{id}</select>）；**④ 编写 DAO 接口**——创建 DAO 接口定义查询方法（public interface UserMapper { User selectUserById(Long id); }）；**⑤ 编写具体的 SQL 查询语句**——在 XML 文件中编写对应的 SQL 语句；**⑥ 调用查询方法**——在服务层或控制层中调用 DAO 接口中的方法进行查询（User user = userMapper.selectUserById(1)）","通过以上步骤可以利用原生的 MyBatis 框架进行数据库查询操作，请确保配置正确、SQL 语句准确并与数据库字段匹配，以确保查询的准确性和高效性"]},
{q:"Mybatis里的#和$的区别", a:["**#{}**：Mybatis 在处理 #{} 时，会创建**预编译的 SQL 语句**，将 SQL 中的 #{} 替换为 ? 号；在执行 SQL 时会为预编译 SQL 中的占位符（?）赋值，调用 **PreparedStatement 的 set 方法**来赋值——**预编译的 SQL 语句执行效率高，并且可以防止 SQL 注入**，提供更高的安全性，适合传递参数值","**${}**：Mybatis 在处理 ${} 时，只是创建**普通的 SQL 语句**，然后在执行 SQL 语句时 MyBatis 将参数**直接拼接到 SQL 里**——**不能防止 SQL 注入**，因为参数直接拼接到 SQL 语句中，如果参数未经过验证、过滤，可能会导致安全问题","**${} 的适用场景**：动态表名、列名等无法用占位符的场景"]},
{q:"MybatisPlus和Mybatis的区别", a:["MybatisPlus 是一个**基于 Mybatis 的增强工具库**，旨在简化开发并提高效率，主要区别：","**CRUD 操作**：MybatisPlus 通过继承 BaseMapper 接口，提供了一系列内置的快捷方法，使 CRUD 操作更加简单，无需编写重复的 SQL 语句","**代码生成器**：MybatisPlus 提供了代码生成器功能，可以根据数据库表结构自动生成实体类、Mapper 接口以及 XML 映射文件，减少手动编写的工作量","**通用方法封装**：封装了许多常用的方法，如条件构造器、排序、分页查询等，简化开发过程、提高开发效率","**分页插件**：内置了分页插件，支持各种数据库的分页查询，开发者可以轻松实现分页功能，而传统 MyBatis 需要自己手动实现分页逻辑","**多租户支持**：提供了多租户的支持，可以轻松实现多租户数据隔离的功能","**注解支持**：引入了更多的注解支持，开发者可以通过注解来配置实体与数据库表之间的映射关系，减少了 XML 配置文件的编写"]},
{q:"MyBatis运用了哪些常见的设计模式", a:["**建造者模式（Builder）**：如 SqlSessionFactoryBuilder、XMLConfigBuilder、XMLMapperBuilder、XMLStatementBuilder、CacheBuilder 等","**工厂模式**：如 SqlSessionFactory、ObjectFactory、MapperProxyFactory","**单例模式**：例如 ErrorContext 和 LogFactory","**代理模式**：Mybatis 实现的核心——比如 MapperProxy、ConnectionLogger 用的是 JDK 动态代理；executor.loader 包使用了 cglib 或者 javassist 来达到延迟加载的效果","**组合模式**：例如 SqlNode 和各个子类 ChooseSqlNode 等","**模板方法模式**：例如 BaseExecutor 和 SimpleExecutor，还有 BaseTypeHandler 和所有子类（如 IntegerTypeHandler）","**适配器模式**：例如 Log 的 Mybatis 接口和它对 jdbc、log4j 等各种日志框架的适配实现","**装饰者模式**：例如 Cache 包中的 cache.decorators 子包中等各个装饰者的实现","**迭代器模式**：例如迭代器模式 PropertyTokenizer"]},
]},
{name:"SpringCloud", qa:[
{q:"了解SpringCloud吗，说一下他和SpringBoot的区别", a:["**Spring Boot 是用于构建单个 Spring 应用的框架**，而 **Spring Cloud 则是用于构建分布式系统中的微服务架构的工具**","Spring Cloud 提供了**服务注册与发现、负载均衡、断路器、网关**等功能","两者可以结合使用：通过 Spring Boot 构建微服务应用，然后用 Spring Cloud 来实现微服务架构中的各种功能"]},
{q:"用过哪些微服务组件", a:["**注册中心**：微服务架构**最核心**的组件。作用是对新节点的注册与状态维护，解决了“如何发现新节点以及检查各节点的运行状态的问题”——微服务节点启动时将服务名称、IP、端口等信息在注册中心登记，注册中心定时检查该节点运行状态，通常采用**心跳机制**最大程度保证已登记的服务节点都是可用的","**负载均衡**：解决了“如何发现服务及负载均衡如何实现的问题”——微服务互相调用时并不是直接通过 IP、端口访问，而是先通过服务名在注册中心查询该服务拥有哪些节点，注册中心将可用节点列表返回给服务调用者，这个过程叫**服务发现**；因服务高可用要求，服务调用者会接收到多个节点，必须在调用者一端**内置负载均衡器**，通过负载均衡策略选择合适的节点发起实质性的通信请求","**服务通信**：解决了“服务间如何进行消息通信的问题”——服务间通信采用轻量级协议，通常是 HTTP RESTful 风格；但 RESTful 风格过于灵活必须加以约束，通常应用时对其封装，如 SpringCloud 中提供了 **Feign 和 RestTemplate** 两种技术屏蔽底层实现细节","**配置中心**：解决了“如何集中管理各节点配置文件的问题”——微服务架构下所有节点都包含自己的配置文件（jdbc 配置、自定义配置、环境配置、运行参数配置等），有的微服务可能有几十个节点，分散存储配置更改时需逐个调整；配置中心将各节点配置文件从服务中剥离，集中转存到配置中心，一般都有 UI 界面方便大规模集群配置调整","**集中式日志管理**：解决“如何收集各节点日志并统一管理的问题”——微服务架构默认将应用日志分别保存在部署节点上，业内常见方案有 **ELK、EFK**，通过搭建独立的日志收集系统，定时抓取各节点增量日志形成有效的统计报表","**分布式链路追踪**：解决“如何直观的了解各节点间的调用服务链路的问题”——系统中一个复杂的业务流程可能连续调用多个微服务，通过**可视化链路图**展现，帮助开发人员快速分析系统瓶颈及出错的服务","**服务保护**：解决“如何对系统进行链路保护，避免服务雪崩的问题”——如果某个微服务出现高延迟导致线程池满载，或业务处理失效，需要引入服务保护组件实现**高延迟服务的快速降级**，避免系统崩溃"]},
{q:"SpringCloud Alibaba实现的微服务架构", a:["**SpringCloud Alibaba 架构组件**：Nacos 服务注册中心 + 配置管理；Seata 分布式事务；RocketMQ 分布式消息；Redis 缓存；日志服务 SLS；K8s 日志链路追踪；OSS 对象存储；ARMS 业务实时监控；SchedulerX 分布式任务调度；SMS 短信服务","**注册中心**：使用 Alibaba Nacos 组件实现，Nacos 提供了一组简单易用的特性集，可快速实现**动态服务发现、服务配置、服务元数据及流量管理**","**负载均衡**：使用 **Nacos 服务端均衡**实现——与 Ribbon 在调用端负载不同，Nacos 是在服务发现的同时利用负载均衡返回服务节点数据","**服务通信**：使用 **Netflix Feign 和 Alibaba Dubbo** 组件实现——前者与 SpringCloud 采用相同方案，后者对自家的 RPC 框架 Dubbo 也给予支持，为服务间通信提供另一种选择","**API 服务网关**：使用与 SpringCloud 相同的组件，即 **SpringCloud Gateway**","**配置中心**：使用 **Nacos 内置配置中心**，可将配置信息存储在指定数据库中","**日志集中式管理**：在原有 ELK 方案外，还可以使用**阿里云日志服务（LOG）**实现","**分布式链路追踪**：采用与 SpringCloud 相同的方案，即 **Sleuth/Zipkin Server**","**系统保护**：使用 Alibaba **Sentinel** 实现——Sentinel 不仅功能更强大，实现系统保护比 Hystrix 更优雅，而且还拥有更好的 UI 界面"]},
{q:"负载均衡有哪些算法", a:["**简单轮询**：将请求按顺序分发给后端服务器，不关心服务器当前的状态（如性能、当前负载）","**加权轮询**：根据服务器自身的性能给服务器设置不同的权重，将请求按顺序和权重分发，可以让性能高的机器处理更多的请求","**简单随机**：将请求随机分发给后端服务器，请求越多各个服务器接收到的请求越平均","**加权随机**：根据服务器自身的性能设置不同的权重，将请求按各个服务器的权重随机分发","**一致性哈希**：根据请求的客户端 ip、或请求参数通过哈希算法得到一个数值，利用该数值取模映射出对应的后端服务器，这样能保证**同一个客户端或相同参数的请求每次都使用同一台服务器**","**最小活跃数**：统计每台服务器上当前正在处理的请求数（请求活跃数），将请求分发给**活跃数最少**的后台服务器"]},
{q:"如何实现一直均衡给一个用户", a:["可以通过**一致性哈希算法**来实现","根据请求的客户端 ip、或请求参数通过哈希算法得到一个数值，利用该数值取模映射出对应的后端服务器，这样能保证**同一个客户端或相同参数的请求每次都使用同一台服务器**"]},
{q:"介绍一下服务熔断", a:["服务熔断是**应对微服务雪崩效应的一种链路保护机制**，类似股市、保险丝","**雪崩效应**：微服务之间的数据交互是通过远程调用来完成的——服务 A 调用服务 B，服务 B 调用服务 C，某一时间链路上对服务 C 的调用响应时间过长或者服务 C 不可用，随着时间增长对服务 C 的调用越来越多，然后服务 C 崩溃了，但是链路调用还在，对服务 B 的调用也在持续增多，然后服务 B 崩溃，随之 A 也崩溃，导致雪崩效应","**熔断机制**：在高压电路中，如果某个地方的电压过高，熔断器就会熔断对电路进行保护；同样，在微服务架构中，当调用链路的某个微服务**不可用或者响应时间太长时，会进行服务熔断**，不再有该节点微服务的调用，快速返回错误的响应信息；当检测到该节点微服务调用响应正常后，恢复调用链路","**Spring Cloud 实现**：熔断机制通过 **Hystrix** 实现——Hystrix 会监控微服务间调用的状况，当失败的调用到一定阈值（缺省是 **5 秒内 20 次调用失败**），就会启动熔断机制"]},
{q:"介绍一下服务降级", a:["服务降级一般是指**在服务器压力剧增的时候**，根据实际业务使用情况以及流量，对一些服务和页面**有策略的不处理或者用一种简单的方式进行处理**，从而释放服务器资源以保证核心业务的正常高效运行，可以理解为**舍小保大**","**原因**：服务器的资源是有限的而请求是无限的，在用户使用即并发高峰期，会影响整体服务的性能，严重的话会导致宕机，以至于某些重要服务不可用；故高峰期为了保证核心功能服务的可用性，就需要对某些服务降级处理","服务降级是从整个系统的负荷情况出发和考虑的，对某些负荷会比较高的情况，为了预防某些功能（业务场景）出现负荷过载或者响应慢的情况，**在其内部暂时舍弃对一些非核心的接口和数据的请求，而直接返回一个提前准备好的 fallback（退路）错误处理信息**","这样，虽然提供的是一个有损坏的服务，但**保证了整个系统的稳定性和可用性**"]},
]},
]});
SECTIONS.push({id:"mysql", title:"MySQL面试篇", chapters:[
{name:"SQL基础", qa:[
{q:"NOSQL和SQL的区别", a:["**SQL 数据库**：指关系型数据库，主要代表 SQL Server、Oracle、MySQL（开源）、PostgreSQL（开源）。关系型数据库存储**结构化数据**，逻辑上以**行列二维表**的形式存在——每一列代表数据的一种属性，每一行代表一个数据实体","**NoSQL 数据库**：指非关系型数据库，主要代表 MongoDB、Redis。逻辑上提供了**不同于二维表的存储方式**，存储方式可以是 JSON 文档、哈希表或者其他方式","**选择考虑因素一：ACID vs BASE**——关系型数据库支持 ACID（原子性、一致性、隔离性、持久性）；相对而言 NoSQL 采用更宽松的模型 BASE（基本可用、软状态、最终一致性）。从实用角度出发，需要判断 ACID 是否是必须的：比如**银行应用就必须保证 ACID**（否则一笔钱可能被使用两次）；又比如**社交软件不必保证 ACID**（一条状态的更新对于所有用户读取先后时间有数秒不同并不影响使用）。需要保证 ACID 的应用优先考虑 SQL，反之优先考虑 NoSQL","**选择考虑因素二：扩展性对比**——NoSQL 数据之间无关系，非常容易扩展（如 redis 自带主从复制模式、哨兵模式、切片集群模式），在架构层面带来可扩展能力；相反关系型数据库的数据之间存在关联性，**水平扩展较难**，需要解决跨服务器 JOIN、分布式事务等问题"]},
{q:"数据库三大范式是什么", a:["**第一范式（1NF）**：要求数据库表的每一列都是**不可分割的原子数据项**。举例：学生表中“家庭信息”列存“3口人，北京”、“学校信息”列存“硕士，研二”就不满足原子性，需要拆分为家庭人口、户籍、学历、所在年级四列","**第二范式（2NF）**：在 1NF 的基础上，**非码属性必须完全依赖于候选码**（消除非主属性对主码的部分函数依赖）。需要确保数据库表中的每一列都和主键相关，而不能只与主键的某一部分相关（主要针对联合主键）。举例：订单表主键是“订单号+产品号”联合组成，产品数量、产品折扣、产品价格与两者都相关，但**订单金额和订单时间仅与订单号相关**，不满足 2NF，需拆成两个表","**第三范式（3NF）**：在 2NF 基础上，**任何非主属性不依赖于其它非主属性**（消除传递依赖），需要确保数据表中的每一列数据都和主键直接相关，而不能间接相关。举例：学生表中“班主任性别”“班主任年龄”直接依赖的是“班主任姓名”而不是主键“学号”，需把班主任信息拆成单独的表"]},
{q:"MySQL怎么连表查询", a:["**1. 内连接（INNER JOIN）**：返回两个表中有匹配关系的行——SELECT employees.name, departments.name FROM employees INNER JOIN departments ON employees.department_id = departments.id，返回每个员工及其所在的部门名称","**2. 左外连接（LEFT JOIN）**：返回左表中的所有行，即使在右表中没有匹配的行，未匹配的右表列会包含 NULL——返回所有员工及其部门名称，包括那些没有分配部门的员工","**3. 右外连接（RIGHT JOIN）**：返回右表中的所有行，即使左表中没有匹配的行，未匹配的左表列会包含 NULL——返回所有部门及其员工，包括那些没有分配员工的部门","**4. 全外连接（FULL JOIN）**：返回两个表中所有行，包括非匹配行。**在 MySQL 中，FULL JOIN 需要使用 UNION 来实现**，因为 MySQL 不直接支持 FULL JOIN——LEFT JOIN ... UNION RIGHT JOIN ... 返回所有员工和所有部门，包括没有匹配行的记录"]},
]},
{name:"数据操作", qa:[
{q:"MySQL如何避免重复插入数据", a:["**方式一：使用 UNIQUE 约束**——在表的相关列上添加 UNIQUE 约束确保每个值在该列中唯一（CREATE TABLE users (email VARCHAR(255) UNIQUE, ...)），如果尝试插入重复的 email，MySQL 会返回错误。**如果需要保证全局唯一性，使用 UNIQUE 约束是最佳做法**","**方式二：使用 INSERT ... ON DUPLICATE KEY UPDATE**——允许在插入记录时处理重复键的情况，如果插入的记录与现有记录冲突，可以选择更新现有记录（INSERT INTO users (email, name) VALUES (...) ON DUPLICATE KEY UPDATE name = VALUES(name)）。**适合需要插入和更新结合的场景**","**方式三：使用 INSERT IGNORE**——该语句会在插入记录时忽略那些因重复键而导致的插入错误（INSERT IGNORE INTO users ...），如果 email 已经存在，这条插入语句将被忽略而不会返回错误。**对于快速忽略重复插入是合适的选择**"]},
{q:"CHAR和VARCHAR有什么区别", a:["**CHAR 是固定长度的字符串类型**：定义时需要指定固定长度，存储时会在末尾补足空格。CHAR 适合存储**长度固定的数据**（如固定长度的代码、状态等），存储空间固定，对于短字符串效率较高","**VARCHAR 是可变长度的字符串类型**：定义时需要指定最大长度，实际存储时**根据实际长度占用存储空间**。VARCHAR 适合存储**长度可变的数据**（如用户输入的文本、备注等），节约存储空间"]},
{q:"varchar后面代表字节还是字符", a:["**VARCHAR 后面括号里的数字代表的是字符数，而不是字节数**","比如 VARCHAR(10)，这里的 10 表示该字段最多可以存储 10 个字符；字符的字节长度取决于所使用的字符集","如果字符集是 **ASCII** 字符集：每个字符占用 1 个字节，VARCHAR(10) 最多可以存储 10 个 ASCII 字符，占用存储空间最多为 10 个字节（不考虑额外的长度记录开销）；如果字符集是 **UTF-8** 字符集：每个字符可能占用 1 到 4 个字节，VARCHAR(10) 最多可以存储 10 个字符，但占用的字节数会根据字符的不同而变化"]},
{q:"int(1) int(10)在mysql有什么不同", a:["**INT(1) 和 INT(10) 的区别主要在于显示宽度，而不是存储范围或数据类型本身的大小**","**本质是显示宽度，不改变存储方式**：INT 的存储固定为 4 字节，所有 INT（无论写成 INT(1) 还是 INT(10)）占用的存储空间均为 4 字节；括号内的数值（如 1 或 10）是显示宽度，用于在特定场景下控制数值的展示格式","**唯一作用场景：ZEROFILL 补零显示**——当字段设置 ZEROFILL 时，数字显示时会用前导零填充至指定宽度。比如字段类型为 INT(4) ZEROFILL：实际存入 5 → 显示为 0005；实际存入 12345 → 显示仍为 12345（宽度超限时不截断）","举例：num1 INT(1) ZEROFILL 插入 1 显示为 1；num2 INT(10) ZEROFILL 插入 1 会填充零显示为 0000000001"]},
{q:"Text数据类型可以无限大吗", a:["**不能**。MySQL 的 3 种 text 类型的最大长度如下：","**TEXT**：65,535 bytes（约 64kb）；**MEDIUMTEXT**：16,777,215 bytes（约 16Mb）；**LONGTEXT**：4,294,967,295 bytes（约 4Gb）"]},
{q:"IP地址如何在数据库里存储", a:["IPv4 地址是一个 **32 位的二进制数**，通常以点分十进制表示法呈现，例如 192.168.1.1。两种常见存储方式：","**字符串类型的存储方式**：直接将 IP 地址作为字符串存储在数据库中，比如可以用 VARCHAR(15) 来存储。**优点**：直观易懂，方便直接进行数据的插入、查询和显示，不需要进行额外的转换操作；**缺点**：占用存储空间较大，字符串比较操作的性能相对较低，不利于进行范围查询","**整数类型的存储方式**：将 IPv4 地址转换为 32 位无符号整数进行存储，常用的数据类型有 **INT UNSIGNED**——插入时用 INET_ATON('192.168.1.1') 转换，查询时用 INET_NTOA(ip_address) 转回 IP 地址。**优点**：占用存储空间小，整数比较操作的性能较高，便于进行范围查询；**缺点**：需要进行额外的转换操作，不够直观，增加了开发的复杂度"]},
{q:"说一下外键约束", a:["外键约束的作用是**维护表与表之间的关系，确保数据的完整性和一致性**","举例：有两个表——学生表和课程表，一个学生可以选修多门课程、一门课程也可以被多个学生选修。可以在学生表中定义一个指向课程表的外键：CREATE TABLE students (id INT PRIMARY KEY, name VARCHAR(50), course_id INT, **FOREIGN KEY (course_id) REFERENCES courses(id)**)——这里 students 表中的 course_id 字段是一个外键，指向 courses 表中的 id 字段","这个外键约束**确保了每个学生所选的课程在 courses 表中都存在**，从而维护了数据的完整性和一致性；如果没有定义外键约束，就有可能出现学生选了不存在的课程，或者删除了一个课程而忘记从学生表中删除选修该课程的学生的情况，这会破坏数据的完整性和一致性"]},
{q:"MySQL的关键字in和exist", a:["**IN 关键字**：用于检查左边的表达式是否存在于右边的列表或子查询的结果集中，如果存在则 IN 返回 TRUE，否则返回 FALSE（SELECT * FROM Customers WHERE Country IN ('Germany', 'France');）","**EXISTS 关键字**：用于判断子查询是否至少能返回一行数据，它**不关心子查询返回什么数据，只关心是否有结果**；如果子查询有结果则 EXISTS 返回 TRUE，否则返回 FALSE（SELECT * FROM Customers WHERE EXISTS (SELECT 1 FROM Orders WHERE Orders.CustomerID = Customers.CustomerID);）","**区别与选择**：**性能差异**——在很多情况下 EXISTS 的性能优于 IN，特别是当子查询的表很大时，因为 EXISTS 一旦找到匹配项就会**立即停止查询**，而 IN 可能会扫描整个子查询结果集；**使用场景**——如果子查询结果集较小且不频繁变动，IN 可能更直观易懂，而当子查询涉及外部查询的每一行判断、且子查询效率较高时 EXISTS 更为合适；**NULL 值处理**——IN 能够正确处理子查询中包含 NULL 值的情况，而 EXISTS 不受子查询结果中 NULL 值的影响，因为它关注的是行的存在性而不是具体值"]},
]},
{name:"函数与执行顺序", qa:[
{q:"mysql中的一些基本函数", a:["**一、字符串函数**：**CONCAT(str1, str2, ...)**——连接多个字符串返回合并后的字符串（SELECT CONCAT('Hello', ' ', 'World')）；**LENGTH(str)**——返回字符串的长度（字符数）；**SUBSTRING(str, pos, len)**——从指定位置开始截取指定长度的子字符串；**REPLACE(str, from_str, to_str)**——将字符串中的某部分替换为另一个字符串","**二、数值函数**：**ABS(num)**——返回数字的绝对值；**POWER(num, exponent)**——返回指定数字的指定幂次方","**三、日期和时间函数**：**NOW()**——返回当前日期和时间；**CURDATE()**——返回当前日期","**四、聚合函数**：**COUNT(column)**——计算指定列中的非 NULL 值的个数；**SUM(column)**——计算指定列的总和；**AVG(column)**——计算指定列的平均值；**MAX(column)**——返回指定列的最大值；**MIN(column)**——返回指定列的最小值"]},
{q:"SQL查询语句的执行顺序", a:["SQL 执行顺序：**FROM（读取资料、笛卡尔积）→ ON（主表保留）→ OUTER JOIN（外部连接）→ WHERE（过滤资料）→ GROUP BY（分组）→ AGG FUNC（聚合计算 COUNT/AVG/MIN/SUM/MAX）→ HAVING（分组过滤）→ SELECT（返回查询栏位、表达式计算）→ DISTINCT（行去重）→ ORDER BY（排序）→ LIMIT/OFFSET（选择指定数量行、分页）**","**所有的查询语句都是从 FROM 开始执行**，在执行过程中，每个步骤都会生成一个虚拟表，这个虚拟表将作为下一个执行步骤的输入，最后一个步骤产生的虚拟表即为输出结果","**书写顺序**：SELECT(9) DISTINCT(10) <column> AGG_FUNC(6) <expression> FROM(1) <left_table> <join_type>JOIN(3) <right_table> ON(2) <join_condition> WHERE(4) <where_condition> GROUP BY(5) <group_by_list> WITH(7) {CUBE|ROLLUP} HAVING(8) <having_condition> ORDER BY(11) <order_by_list> LIMIT(12) <limit_number>"]},
{q:"sql题：求不存在01课程但存在02课程的学生的成绩", a:["有两张表：**Student 表**（包含 sid 学生编号和其他相关信息）、**Score 表**（包含 sid 学生编号、cid 课程编号和 score 分数）","**方法 1：使用 LEFT JOIN 和 IS NULL**——SELECT s.sid, s.sname, sc2.cid, sc2.score FROM Student s LEFT JOIN Score AS sc1 ON s.sid = sc1.sid AND sc1.cid = '01' LEFT JOIN Score AS sc2 ON s.sid = sc2.sid AND sc2.cid = '02' WHERE sc1.cid IS NULL AND sc2.cid IS NOT NULL","**方法 2：使用 NOT EXISTS**——SELECT s.sid, s.sname, sc.cid, sc.score FROM Student s JOIN Score sc ON s.sid = sc.sid AND sc.cid = '02' WHERE NOT EXISTS (SELECT 1 FROM Score sc1 WHERE sc1.sid = s.sid AND sc1.cid = '01')"]},
{q:"sql题：查询总分排名在5-10名的学生", a:["给定一个学生表 student_score (stu_id, subject_id, score)，查询总分排名在 5-10 名的学生 id 及对应的总分。可以先计算每个学生的总分，然后为其分配一个排名，最后检索排名在 5 到 10 之间的记录：","**WITH StudentTotalScores AS (SELECT stu_id, SUM(score) AS total_score FROM student_score GROUP BY stu_id), RankedStudents AS (SELECT stu_id, total_score, RANK() OVER (ORDER BY total_score DESC) AS ranking FROM StudentTotalScores) SELECT stu_id, total_score FROM RankedStudents WHERE ranking BETWEEN 5 AND 10;**","解释：① 子查询 StudentTotalScores 中通过对 student_score 表中的 stu_id 分组来计算每个学生的总分；② 子查询 RankedStudents 中使用 RANK() 函数为每个学生分配排名，按总分从高到低排序；③ 最后在主查询中选择排名在 5 到 10 之间的学生"]},
{q:"SQL题：查某个班级下所有学生的选课情况", a:["三张表：**学生信息表 students**（student_id INT PRIMARY KEY 学生的唯一标识主键、student_name VARCHAR(50) 学生姓名、class_id INT 学生所属班级的标识用于关联班级表）；**学生选课表 course_selections**（selection_id INT PRIMARY KEY 选课记录唯一标识、student_id INT 选课学生的标识、course_name VARCHAR(50) 所选课程的名称）；**学生班级表 classes**（class_id INT PRIMARY KEY 班级唯一标识、class_name VARCHAR(50) 班级名称）","查询某个班级（例如班级名称为 'Class A'）下所有学生的选课情况：**SELECT s.student_id, s.student_name, cs.course_name FROM students s JOIN course_selections cs ON s.student_id = cs.student_id JOIN classes c ON s.class_id = c.class_id WHERE c.class_name = 'Class A';**"]},
{q:"如何用MySQL实现一个可重入的锁", a:["创建一个保存锁记录的表：**CREATE TABLE lock_table (id INT AUTO_INCREMENT PRIMARY KEY, lock_name VARCHAR(255) NOT NULL（存储锁的名称作为锁的唯一标识符）, holder_thread VARCHAR(255)（存储当前持有锁的线程名称）, reentry_count INT DEFAULT 0（存储锁的重入次数，用于实现锁的可重入性）);**","**加锁的实现逻辑**：1. 开启事务；2. 执行 SELECT holder_thread, reentry_count FROM lock_table WHERE lock_name = ? FOR UPDATE 查询是否存在该记录——如果记录不存在，则直接加锁，执行 INSERT INTO lock_table (lock_name, holder_thread, reentry_count) VALUES (?, ?, 1)；如果记录存在且持有者是同一个线程，则可重入，增加重入次数，执行 UPDATE lock_table SET reentry_count = reentry_count + 1 WHERE lock_name = ?；3. 提交事务","**解锁的逻辑**：1. 开启事务；2. 查询记录——如果记录存在且持有者是同一个线程且可重入数大于 1，则减少重入次数 UPDATE lock_table SET reentry_count = reentry_count - 1 WHERE lock_name = ?；如果记录存在且持有者是同一个线程且可重入数小于等于 0，则完全释放锁 DELETE FROM lock_table WHERE lock_name = ?；3. 提交事务"]},
]},
{name:"存储引擎", qa:[
{q:"执行一条SQL请求的过程", a:["**上帝视角**：客户端 → Server 层 → 存储引擎层。Server 层包含：**连接器**（建立连接、管理连接、校验用户身份）；**查询缓存**（查询语句如果命中查询缓存则直接返回，否则继续往下执行，**MySQL 8.0 已删除该模块**）；**解析器**（对 SQL 查询语句进行词法分析、语法分析，然后构建语法树，方便后续模块读取表名、字段、语句类型）","**执行 SQL 共有三个阶段**：**预处理阶段**——检查表或字段是否存在，将 select * 中的 * 符号扩展为表上的所有列；**优化阶段**——基于查询成本的考虑，选择查询成本最小的执行计划；**执行阶段**——根据执行计划执行 SQL 查询语句，从存储引擎读取记录，返回给客户端","**存储引擎层**：InnoDB、MyISAM 等"]},
{q:"讲一讲mysql的引擎", a:["**InnoDB**：MySQL 的**默认存储引擎**，具有 ACID 事务支持、行级锁、外键约束等特性，适用于高并发的读写操作，支持较好的数据完整性和并发控制","**MyISAM**：MySQL 另一种常见的存储引擎，具有**较低的存储空间和内存消耗**，适用于大量读操作的场景；然而 **MyISAM 不支持事务、行级锁和外键约束**，在并发写入和数据完整性方面有一定的限制","**Memory**：Memory 引擎将数据存储在**内存**中，适用于对性能要求较高的读操作，但是**在服务器重启或崩溃时数据会丢失**；它不支持事务、行级锁和外键约束"]},
{q:"MySQL为什么InnoDB是默认引擎", a:["InnoDB 引擎在**事务支持、并发性能、崩溃恢复**等方面具有优势，因此被 MySQL 选择为默认的存储引擎：","**事务支持**：InnoDB 引擎提供了对事务的支持，可以进行 ACID（原子性、一致性、隔离性、持久性）属性的操作，而 MyISAM 存储引擎是不支持事务的","**并发性能**：InnoDB 引擎采用了**行级锁定**的机制，可以提供更好的并发性能；MyISAM 存储引擎只支持表锁，锁的粒度比较大","**崩溃恢复**：InnoDB 引擎通过 **redo log 日志**实现了崩溃恢复，可以在数据库发生异常情况（如断电）时通过日志文件进行恢复，保证数据的持久性和一致性；MyISAM 是不支持崩溃恢复的"]},
{q:"mysql的innodb与MyISAM的区别", a:["**事务**：InnoDB 支持事务，MyISAM 不支持事务——这是 MySQL 将默认存储引擎从 MyISAM 变成 InnoDB 的重要原因之一","**索引结构**：InnoDB 是**聚簇索引**，MyISAM 是**非聚簇索引**。聚簇索引的文件存放在主键索引的叶子节点上，因此 **InnoDB 必须要有主键**，通过主键索引效率很高；但辅助索引需要**两次查询**（先查询到主键，再通过主键查询到数据），因此**主键不应该过大**（主键太大其他索引也都会很大）。而 MyISAM 是非聚簇索引，**数据文件是分离的，索引保存的是数据文件的指针**，主键索引和辅助索引是独立的","**锁粒度**：InnoDB 最小的锁粒度是**行锁**，MyISAM 最小的锁粒度是**表锁**——MyISAM 一个更新语句会锁住整张表，导致其他查询和更新都被阻塞，并发访问受限","**count 的效率**：InnoDB **不保存表的具体行数**，执行 select count(*) from table 时需要全表扫描；而 MyISAM 用一个**变量保存了整个表的行数**，执行上述语句时只需要读出该变量即可，速度很快"]},
{q:"数据文件大体分成哪几种", a:["每创建一个 database（数据库）都会在 /var/lib/mysql/ 目录里面创建一个以 database 为名的目录，保存表结构和表数据的文件都存放在这个目录里（如 my_test 数据库下有 t_order 表，进入 /var/lib/mysql/my_test 目录可以看到三个文件）：","**db.opt**：用来存储当前数据库的**默认字符集和字符校验规则**","**t_order.frm**：t_order 的**表结构**会保存在这个文件。在 MySQL 中建立一张表都会生成一个 .frm 文件，该文件用来保存每个表的元数据信息，主要包含表结构定义","**t_order.ibd**：t_order 的**表数据**会保存在这个文件。表数据既可以存在共享表空间文件（文件名 ibdata1）里，也可以存放在独占表空间文件（文件名 表名字.ibd）里——这个行为由参数 **innodb_file_per_table** 控制，若设置为 1 则会将存储的数据、索引等信息单独存储在一个独占表空间，从 **MySQL 5.6.6 版本开始默认值就是 1**，此后 MySQL 中每一张表的数据都存放在一个独立的 .ibd 文件"]},
]},
{name:"索引", qa:[
{q:"索引是什么？有什么好处", a:["**索引类似于书籍的目录，可以减少扫描的数据量，提高查询效率**","如果查询的时候没有用到索引就会**全表扫描**，这时候查询的时间复杂度是 O(n)；如果用到了索引，那么查询的时候可以基于**二分查找算法**通过索引快速定位到目标数据，MySQL 索引的数据结构一般是 B+ 树，其搜索复杂度为 **O(logdN)**，其中 d 表示节点允许的最大子节点个数"]},
{q:"讲讲索引的分类", a:["MySQL 可以按照四个角度来分类索引：","**按「数据结构」分类**：B+tree 索引、Hash 索引、Full-text 索引","**按「物理存储」分类**：聚簇索引（主键索引）、二级索引（辅助索引）","**按「字段特性」分类**：主键索引、唯一索引、普通索引、前缀索引","**按「字段个数」分类**：单列索引、联合索引","**各存储引擎支持情况**：B+Tree 索引——InnoDB/MyISAM/Memory 都支持（InnoDB 是 MySQL 5.5 之后默认存储引擎，B+Tree 索引类型也是 MySQL 存储引擎采用最多的索引类型）；HASH 索引——InnoDB 不支持（但在内存结构中有一个自适应 hash 索引）、MyISAM 不支持、Memory 支持；Full-Text 索引——InnoDB 在 MySQL 5.6 版本后支持、MyISAM 支持、Memory 不支持"]},
{q:"聚簇索引的索引键选择规则", a:["在创建表时，InnoDB 存储引擎会根据不同的场景选择不同的列作为聚簇索引的索引键：","**① 如果有主键，默认会使用主键作为聚簇索引的索引键（key）**；**② 如果没有主键，就选择第一个不包含 NULL 值的唯一列作为聚簇索引的索引键**；**③ 在上面两个都没有的情况下，InnoDB 将自动生成一个隐式自增 id 列作为聚簇索引的索引键**","其它索引都属于**辅助索引（Secondary Index）**，也被称为二级索引或非聚簇索引；创建的主键索引和二级索引默认使用的是 B+Tree 索引"]},
{q:"覆盖索引与回表", a:["从物理存储的角度来看：**主键索引的 B+Tree 的叶子节点存放的是实际数据**，所有完整的用户记录都存放在主键索引的 B+Tree 的叶子节点里；**二级索引的 B+Tree 的叶子节点存放的是主键值，而不是实际数据**","所以，在查询时使用了二级索引：**如果查询的数据能在二级索引里查询得到，那么就不需要回表，这个过程就是覆盖索引**；**如果查询的数据不在二级索引里，就会先检索二级索引，找到对应的叶子节点，获取到主键值后，然后再检索主键索引，就能查询到数据了，这个过程就是回表**"]},
{q:"索引类型创建方式", a:["**主键索引**：建立在主键字段上的索引，通常在创建表的时候一起创建，**一张表最多只有一个主键索引**，索引列的值不允许有空值——创建方式：CREATE TABLE table_name (.... PRIMARY KEY (index_column_1) USING BTREE);","**唯一索引**：建立在 UNIQUE 字段上的索引，**一张表可以有多个唯一索引**，索引列的值必须唯一，但是**允许有空值**——创建表时：UNIQUE KEY(index_column_1, index_column_2, ...)；建表后：CREATE UNIQUE INDEX index_name ON table_name(index_column_1, ...)","**普通索引**：建立在普通字段上的索引，既不要求字段为主键，也不要求字段为 UNIQUE——建表后：CREATE INDEX index_name ON table_name(index_column_1, ...)","**前缀索引**：对字符类型字段的**前几个字符**建立的索引，而不是在整个字段上建立索引，可以建立在字段类型为 **char、varchar、binary、varbinary** 的列上——使用前缀索引的目的是为了**减少索引占用的存储空间，提升查询效率**——建表时：INDEX(column_name(length))；建表后：CREATE INDEX index_name ON table_name(column_name(length))"]},
{q:"联合索引与最左匹配原则", a:["**联合索引**：将多个字段组合成一个索引，该索引就被称为联合索引（如将商品表中的 product_no 和 name 字段组合成联合索引(product_no, name)，CREATE INDEX index_product_no_name ON product(product_no, name)）","**联合索引的 B+Tree 结构**：非叶子节点用两个字段的值作为 B+Tree 的 key 值。查询时**先按 product_no 字段比较，在 product_no 相同的情况下再按 name 字段比较**，即先按 product_no 排序，product_no 相同再按 name 排序","**最左匹配原则**：使用联合索引时存在最左匹配原则，即**按照最左优先的方式进行索引的匹配**；如果不遵循最左匹配原则，联合索引会失效","**能匹配上**：where a=1; where a=1 and b=2 and c=3; where a=1 and b=2（注意：因为有查询优化器，所以 a 字段在 where 子句的顺序并不重要）","**无法匹配导致失效**：where b=2; where c=3; where b=2 and c=3——因为 (a,b,c) 联合索引先按 a 排序、a 相同按 b 排序、b 相同按 c 排序，**b 和 c 是全局无序、局部相对有序的**，不遵循最左匹配原则就无法利用索引","**特殊情况（范围查询）**：最左匹配原则会一直向右匹配直到遇到「范围查询」就会**停止匹配**——范围查询的字段可以用到联合索引，但是在范围查询字段的后面的字段无法用到联合索引"]},
{q:"创建联合索引时需要注意什么", a:["**建立联合索引时的字段顺序，对索引效率也有很大影响**：越靠前的字段被用于索引过滤的概率越高，实际开发工作中建立联合索引时，要**把区分度大的字段排在前面**，这样区分度大的字段越有可能被更多的 SQL 使用到","**区分度计算公式**：区分度 = distinct(column) / count(*)","**举例**：性别的区分度就很小，不适合建立索引或不适合排在联合索引列的靠前的位置，而 **UUID 这类字段就比较适合做索引或排在联合索引列的靠前的位置**","**为什么区分度小不适合**：如果索引的区分度很小，假设字段的值分布均匀，那么无论搜索哪个值都可能得到一半的数据；在这些情况下还不如不要索引，因为 MySQL 的查询优化器发现某个值出现在表的数据行中的百分比（惯用的百分比界线是“30%”）很高的时候，它一般会忽略索引，进行全表扫描"]},
{q:"联合索引ABC，A=XXX and C<XXX索引怎么走", a:["**根据最左匹配原则，A 可以走联合索引，C 不会走联合索引**","但是 **C 可以走索引下推**（5.6 版本后，能减少回表查询的次数）"]},
{q:"联合索引(a,b,c) where b>xxx and a=x 会生效吗", a:["**会生效**，a 和 b 字段都能利用联合索引","因为符合联合索引**最左匹配原则**（where 条件中同时包含 a 和 b，范围查询的 b 字段本身可用）"]},
{q:"联合索引(a,b,c) where a=2 and c=1 能用到吗", a:["**会用到联合索引，但是只有 a 才能走索引，c 无法走索引**，因为不符合最左匹配原则","虽然 c 无法走索引，但是 **c 字段在 5.6 版本之后，会有索引下推的优化，能减少回表查询的次数**"]},
{q:"索引失效有哪些（6种）", a:["**① 使用左或者左右模糊匹配**：like %xx 或者 like %xx% 这两种方式都会造成索引失效","**② 在查询条件中对索引列使用函数**：会导致索引失效","**③ 在查询条件中对索引列进行表达式计算**：也是无法走索引的","**④ 字符串和数字比较发生隐式类型转换**：MySQL 在遇到字符串和数字比较的时候会自动把字符串转为数字再比较；如果字符串是索引列、条件语句中的输入参数是数字，那么索引列会发生隐式类型转换，由于隐式类型转换是通过 **CAST 函数**实现的，等同于对索引列使用了函数，所以就会导致索引失效","**⑤ 联合索引不遵循最左匹配原则**：需要按照最左优先的方式进行索引的匹配，否则就会导致索引失效","**⑥ WHERE 子句中 OR 前后条件不一致**：如果在 OR 前的条件列是索引列，而在 OR 后的条件列不是索引列，那么索引会失效"]},
{q:"什么情况下会回表查询", a:["**使用二级索引查询，且查询的数据不在二级索引里**（即查询列超出索引覆盖范围）时就会回表","过程：先检索二级索引，找到对应的叶子节点，获取到主键值后，然后再检索主键索引，就能查询到数据了，这个过程就是回表","如果查询的数据能在二级索引里查询得到，那么就不需要回表，这个过程就是**覆盖索引**"]},
{q:"什么是覆盖索引", a:["**覆盖索引是指一个索引包含了查询所需的所有列，因此不需要访问表中的数据行就能完成查询**","换句话说，查询所需的所有数据都能从索引中直接获取，而不需要进行回表查询；覆盖索引能够**显著提高查询性能**，因为减少了访问数据页的次数，从而减少了 I/O 操作","**示例**：假设有一张表 employees (id, name, age, department, salary)，创建索引 CREATE INDEX idx_name_age_department ON employees(name, age, department)；查询 SELECT name, age, department FROM employees WHERE name = 'John'——在这种情况下 idx_name_age_department 是一个覆盖索引，因为它包含了查询所需的所有列 name、age 和 department，查询可以完全在索引层完成，不需要访问表中的数据行"]},
{q:"一个列既是单列索引又是联合索引，单独查它先走哪个", a:["**mysql 优化器会分析每个索引的查询成本，然后选择成本最低的方案来执行 sql**","如果单列索引是 a，联合索引是 (a, b)，那么针对查询 select a, b from table where a = ? and b = ?：**优化器会选择联合索引**，因为查询成本更低，查询也不需要回表，直接索引覆盖了"]},
{q:"插入数据索引会有哪些变化", a:["**插入新数据可能导致 B+树结构的调整和索引信息的更新**，以保持 B+树的平衡性和正确性，这些变化通常由数据库系统自动处理，确保数据的一致性和索引的有效性","如果插入的数据导致**叶子节点已满**，可能会触发**叶子节点的分裂操作**，以保持 B+树的平衡性"]},
{q:"索引字段是不是建的越多越好", a:["**不是**，建的越多会占用越多的空间，而且在**写入频繁的场景下，对于 B+树的维护所付出的性能消耗也会越大**"]},
{q:"status值为0或1适合建索引吗", a:["**不适合**，**区分度低的字段不适合建立索引**"]},
{q:"索引的优缺点", a:["**索引最大的好处是提高查询速度**，但是索引也是有缺点的：","**① 需要占用物理空间**，数量越大，占用空间越大；**② 创建索引和维护索引要耗费时间**，这种时间随着数据量的增加而增大；**③ 会降低表的增删改的效率**，因为每次增删改索引，B+ 树为了维护索引有序性，都需要进行动态维护","所以，索引不是万能钥匙，它也是根据场景来使用的"]},
{q:"怎么决定建立哪些索引", a:["**什么时候适用索引**：**字段有唯一性限制的**（比如商品编码）；**经常用于 WHERE 查询条件的字段**——能够提高整个表的查询速度，如果查询条件不是一个字段，可以建立联合索引；**经常用于 GROUP BY 和 ORDER BY 的字段**——查询的时候就不需要再去做一次排序了，因为建立索引之后在 B+Tree 中的记录都是排好序的","**什么时候不需要创建索引**：**WHERE 条件、GROUP BY、ORDER BY 里用不到的字段**——索引的价值是快速定位，起不到定位作用的字段通常不需要创建索引，因为索引会占用物理空间；**字段中存在大量重复数据**——比如性别字段只有男女，男女记录分布均匀时无论搜索哪个值都可能得到一半数据，此时还不如不要索引（查询优化器发现某值出现百分比很高会忽略索引全表扫描）；**表数据太少的时候**；**经常更新的字段不用创建索引**——比如不要对电商项目的用户余额建立索引，因为索引字段频繁修改，更新代价大"]},
{q:"常见优化索引的方法", a:["**前缀索引优化**：使用前缀索引是为了减小索引字段大小，可以增加一个索引页中存储的索引值，有效提高索引的查询速度；在一些大字符串的字段作为索引时，使用前缀索引可以帮助减小索引项的大小","**覆盖索引优化**：覆盖索引是指 SQL 中 query 的所有字段在索引 B+Tree 的叶子节点上都能找得到的那些索引，从二级索引中查询得到记录而不需要通过聚簇索引查询获得，可以**避免回表的操作**","**主键索引最好是自增的**：使用自增主键时，每次插入的新数据就会按顺序添加到当前索引节点的位置，不需要移动已有的数据，当页面写满就会自动开辟一个新页面——每次插入都是追加操作，效率非常高；如果使用**非自增主键**，每次插入的索引值都是随机的，可能插入到现有数据页中间的某个位置，不得不移动其它数据，甚至需要从一个页面复制数据到另外一个页面，这种情况称为**页分裂**，页分裂还有可能造成大量的内存碎片，导致索引结构不紧凑，影响查询效率","**防止索引失效**：不要使用左/左右模糊匹配（like %xx 或 like %xx%）、不要在查询条件中对索引列做计算/函数/类型转换操作、联合索引要遵循最左匹配原则、避免 WHERE 中 OR 前后条件不一致"]},
{q:"了解过前缀索引吗", a:["**使用前缀索引是为了减小索引字段大小，可以增加一个索引页中存储的索引值，有效提高索引的查询速度**","在一些**大字符串的字段**作为索引时，使用前缀索引可以帮助我们减小索引项的大小"]},
]},
{name:"事务", qa:[
{q:"事务的特性是什么？如何实现的", a:["**原子性（Atomicity）**：一个事务中的所有操作，要么全部完成，要么全部不完成，不会结束在中间某个环节；事务在执行过程中发生错误会被回滚到事务开始前的状态，就像这个事务从来没有执行过一样（好比买商品：购买成功则给商家付了钱商品到手，购买失败则商品在商家手中、消费者的钱也没花出去）","**一致性（Consistency）**：事务操作前和操作后，数据满足完整性约束，数据库保持一致性状态。比如用户 A 和用户 B 在银行分别有 800 元和 600 元总共 1400 元，A 给 B 转账 200 元分两个步骤（从 A 的账户扣除 200 元、对 B 的账户增加 200 元），一致性要求操作后结果是 A 还有 600 元、B 有 800 元、总共 1400 元，而不会出现 A 扣除了 200 元但 B 未增加的情况","**隔离性（Isolation）**：数据库允许多个并发事务同时对其数据进行读写和修改，隔离性可以防止多个事务并发执行时由于交叉执行而导致数据的不一致——多个事务同时使用相同的数据时不会相互干扰，每个事务都有一个完整的数据空间，对其他并发事务是隔离的","**持久性（Durability）**：事务处理结束后，对数据的修改就是永久的，即便系统故障也不会丢失","**实现技术**：持久性通过 **redo log（重做日志）** 保证；原子性通过 **undo log（回滚日志）** 保证；隔离性通过 **MVCC（多版本并发控制）或锁机制** 保证；一致性则是通过**持久性+原子性+隔离性**来保证"]},
{q:"mysql可能出现什么并发相关问题", a:["MySQL 服务端允许多个客户端连接，会出现同时处理多个事务的情况，可能产生三种问题：","**脏读（dirty read）**：一个事务「读到」了另一个「未提交事务修改过的数据」。举例：事务 A 读取小林的余额数据并执行更新操作（还没提交），此时事务 B 也从数据库读取余额数据，读到的是事务 A 更新后的数据——因为事务 A 随时可能发生回滚，如果 A 回滚了，那么事务 B 得到的数据就是过期的数据","**不可重复读（non-repeatable read）**：在一个事务内多次读取同一个数据，前后两次读到的数据不一样。举例：事务 A 先读取余额，继续执行代码逻辑的过程中，事务 B 更新了这条数据并提交了事务，那么事务 A 再次读取该数据时，就会发现前后两次读到的数据是不一致的","**幻读（phantom read）**：在一个事务内多次查询某个符合查询条件的「记录数量」，前后两次查询到的记录数量不一样。举例：事务 A 查询账户余额大于 100 万的记录发现有 5 条，然后事务 B 插入了一条余额超过 100 万的账号并提交，数据库超过 100 万余额的账号个数变为 6，事务 A 再次查询时发现查询到的记录数量变了，就像发生幻觉一样"]},
{q:"哪些场景不适合脏读", a:["脏读是指一个事务读取到另一个事务**未提交**的数据时发生，可能导致不一致的数据被读取并引起问题，以下场景不适合脏读：","**银行系统**：如果一个账户的余额正在被调整但尚未提交，另一个事务读取了这个临时的余额，可能会导致客户看到不正确的余额","**库存管理系统**：如果一个商品的数量正在被更新但尚未提交，另一个事务读取了这个临时的数量，可能会导致库存管理错误","**在线订单系统**：如果一个订单正在被修改但尚未提交，另一个事务读取了这个临时的订单状态，可能导致订单状态显示错误，客户收到不准确的信息","在以上这些场景中，脏读可能导致严重的问题，因此应该避免发生脏读，保证数据的一致性和准确性"]},
{q:"mysql是怎么解决并发问题的", a:["**锁机制**：Mysql 提供了多种锁机制来保证数据的一致性，包括**行级锁、表级锁、页级锁**等——通过锁机制，可以在读写操作时对数据进行加锁，确保同时只有一个操作能够访问或修改数据","**事务隔离级别**：Mysql 提供了多种事务隔离级别，包括**读未提交、读已提交、可重复读和串行化**——通过设置合适的事务隔离级别，可以在多个事务并发执行时控制事务之间的隔离程度，避免数据不一致的问题","**MVCC（多版本并发控制）**：Mysql 使用 MVCC 来管理并发访问，它通过在数据库中**保存不同版本的数据**来实现不同事务之间的隔离——在读取数据时，Mysql 会根据事务的隔离级别来选择合适的数据版本，从而保证数据的一致性"]},
{q:"事务的隔离级别有哪些", a:["**读未提交（read uncommitted）**：指一个事务还没提交时，它做的变更就能被其他事务看到（可能发生脏读、不可重复读和幻读）","**读提交（read committed）**：指一个事务提交之后，它做的变更才能被其他事务看到（可能发生不可重复读和幻读，但不可能发生脏读）","**可重复读（repeatable read）**：指一个事务执行过程中看到的数据，一直跟这个事务启动时看到的数据是一致的，**MySQL InnoDB 引擎的默认隔离级别**（可能发生幻读，但不可能脏读和不可重复读）","**串行化（serializable）**：会对记录加上读写锁，在多个事务对这条记录进行读写操作时，如果发生了读写冲突，后访问的事务必须等前一个事务执行完成才能继续执行（脏读、不可重复读和幻读都不可能会发生）","按隔离水平从高到低排序：**串行化 → 可重复读 → 读已提交 → 读未提交**"]},
{q:"四种隔离级别如何实现", a:["**「读未提交」隔离级别**：因为可以读到未提交事务修改的数据，所以**直接读取最新的数据**就好了","**「串行化」隔离级别**：通过**加读写锁**的方式来避免并行访问","**「读提交」和「可重复读」隔离级别**：通过 **Read View** 来实现，它们的区别在于**创建 Read View 的时机不同**——「读提交」隔离级别是在「每个语句执行前」都会重新生成一个 Read View，而「可重复读」隔离级别是「启动事务时」生成一个 Read View，然后整个事务期间都在用这个 Read View"]},
{q:"mysql默认级别是什么", a:["**可重复读（repeatable read）**，是 MySQL InnoDB 引擎的默认隔离级别"]},
{q:"可重复读隔离级别下A事务提交的数据B事务能看见吗", a:["可重复读隔离级是由 **MVCC（多版本并发控制）** 实现的","实现方式：**开始事务后（执行 begin 语句后），在执行第一个查询语句后会创建一个 Read View**，后续的查询语句利用这个 Read View，通过这个 Read View 就可以在 **undo log 版本链**找到事务开始时的数据","所以事务过程中**每次查询的数据都是一样的**，即使中途有其他事务插入了新纪录，也是查询不出来这条数据的"]},
{q:"可重复读下的幻读问题举例", a:["可重复读隔离级别下虽然很大程度上避免了幻读，但是**还是没有能完全解决幻读**，举例（t_stu 表有 id=1~4 四条记录）：","① 事务 A 执行 begin，查询 id = 5 的记录，此时表中没有该记录，查询不出来；② 事务 B 插入一条 id = 5 的记录（'小美', 18）并提交；③ 事务 A 更新 id = 5 这条记录——对，事务 A 看不到 id = 5 这条记录，但是他去更新了这条记录，这场景确实很违和；④ 然后事务 A 再次查询 id = 5 的记录，就能看到事务 B 插入的记录了，**幻读就是发生在这种违和的场景**","**原因**：事务 A 第一次执行普通的 select 语句时生成了一个 ReadView，之后事务 B 向表中新插入了一条 id = 5 的记录并提交；接着事务 A 对 id = 5 这条记录进行了更新操作，在这个时刻，这条新记录的 **trx_id 隐藏列的值就变成了事务 A 的事务 id**，之后事务 A 再使用普通 select 语句去查询这条记录时就可以看到这条记录了，于是就发生了幻读","**结论**：因为这种特殊现象的存在，我们认为 MySQL InnoDB 中的 **MVCC 并不能完全避免幻读现象**"]},
{q:"可重复读怎么保证不发生幻读", a:["**尽量在开启事务之后，马上执行 select ... for update 这类锁定读的语句**","因为它会对记录加 **next-key lock**，从而避免其他事务插入一条新记录，就避免了幻读的问题"]},
{q:"串行化隔离级别通过什么实现", a:["**是通过行级锁来实现的**","串行化隔离级别下，普通的 select 查询会**对记录加 S 型的 next-key 锁**，其他事务就没办法对这些已经加锁的记录进行增删改操作了，从而**避免了脏读、不可重复读和幻读**现象"]},
{q:"介绍MVCC实现原理", a:["**MVCC 允许多个事务同时读取同一行数据而不会彼此阻塞**，每个事务看到的数据版本是该事务开始时的数据版本——如果其他事务在此期间修改了数据，正在运行的事务仍然看到的是它开始时的数据状态，从而实现了**非阻塞读**操作","对于「读提交」和「可重复读」隔离级别的事务来说，它们是通过 **Read View** 来实现的（可以把 Read View 理解成一个数据快照）：「读提交」是在**每个 select 语句执行前**重新生成一个 Read View；「可重复读」是**执行第一条 select 时**生成一个 Read View，然后整个事务期间都在用这个 Read View","**Read View 有四个重要的字段**：**m_ids**——在创建 Read View 时，当前数据库中「活跃事务」（启动了但还没提交的事务）的事务 id 列表；**min_trx_id**——创建 Read View 时当前数据库中活跃事务中事务 id 最小的事务，也就是 m_ids 的最小值；**max_trx_id**——**并不是 m_ids 的最大值**，而是创建 Read View 时当前数据库中应该给下一个事务的 id 值，也就是全局事务中最大的事务 id + 1；**creator_trx_id**——创建该 Read View 的事务的事务 id"]},
{q:"InnoDB聚簇索引记录隐藏列", a:["对于使用 InnoDB 存储引擎的数据库表，它的聚簇索引记录中都包含下面两个隐藏列：","**trx_id**：当一个事务对某条聚簇索引记录进行改动时，就会把该事务的事务 id 记录在 trx_id 隐藏列里","**roll_pointer**：每次对某条聚簇索引记录进行改动时，都会把旧版本的记录写入到 **undo 日志**中，然后这个隐藏列是个指针，指向每一个旧版本记录，于是就可以通过它找到修改前的记录"]},
{q:"MVCC记录可见性判断规则", a:["一个事务去访问记录的时候，**除了自己的更新记录总是可见之外**，还有这几种情况：","**① 如果记录的 trx_id 值小于 Read View 中的 min_trx_id 值**：表示这个版本的记录是在创建 Read View 前已经提交的事务生成的，所以该版本的记录对当前事务**可见**","**② 如果记录的 trx_id 值大于等于 Read View 中的 max_trx_id 值**：表示这个版本的记录是在创建 Read View 后才启动的事务生成的，所以该版本的记录对当前事务**不可见**","**③ 如果记录的 trx_id 值在 Read View 中的 min_trx_id 和 max_trx_id 之间**：需要判断 trx_id 是否在 m_ids 列表中——**如果在 m_ids 列表中**，表示生成该版本记录的活跃事务依然活跃着（还没提交事务），所以该版本的记录对当前事务**不可见**；**如果不在 m_ids 列表中**，表示生成该版本记录的活跃事务已经被提交，所以该版本的记录对当前事务**可见**","这种通过「版本链」来控制并发事务访问同一个记录时的行为就叫 **MVCC（多版本并发控制）**"]},
{q:"一条update是不是原子性的", a:["**是原子性，主要通过锁 + undolog 日志保证原子性的**","执行 update 的时候，会加**行级别锁**，保证了一个事务更新一条记录的时候，不会被其他事务干扰","事务执行过程中，会生成 **undolog**，如果事务执行失败，就可以通过 undolog 日志进行回滚"]},
{q:"滥用事务或一个事务特别多sql的弊端", a:["事务的资源（比如存储资源、锁）**在事务提交之后才会释放**，如果一个事务特别多 sql，会带来这些问题：","**① 锁定的数据太多，容易造成大量的死锁和锁超时**","**② 回滚记录会占用大量存储空间，事务回滚时间长**——在 MySQL 中，实际上每条记录在更新的时候都会同时记录一条回滚操作，记录上的最新值通过回滚操作都可以得到前一个状态的值，sql 越多，所需要保存的回滚数据就越多","**③ 执行时间长，容易造成主从延迟**——主库上必须等事务执行完成才会写入 binlog，再传给备库；所以如果一个主库上的语句执行 10 分钟，那这个事务很可能就会导致从库延迟 10 分钟"]},
]},
{name:"锁", qa:[
{q:"讲一下mysql里有哪些锁", a:["在 MySQL 里，**根据加锁的范围，可以分为全局锁、表级锁和行锁三类**：","**全局锁**：通过 **flush tables with read lock**（FTWRL）语句会将整个数据库处于只读状态，这时其他线程执行增删改或者表结构修改都会阻塞。全局锁主要应用于做**全库逻辑备份**，这样在备份数据库期间，不会因为数据或表结构的更新而出现备份文件的数据与预期的不一样","**表级锁**（MySQL 里面表级别的锁有这几种）：**表锁**——通过 lock tables 语句可以对表加表锁，表锁除了会限制别的线程的读写外，也会限制本线程接下来的读写操作；**元数据锁（MDL）**——对数据库表进行操作时自动加 MDL，对一张表进行 CRUD 操作时加的是 **MDL 读锁**，对一张表做结构变更操作时加的是 **MDL 写锁**，MDL 是为了保证当用户对表执行 CRUD 操作时防止其他线程对这个表结构做了变更；**意向锁**——当执行插入、更新、删除操作时，需要先对表加上「意向独占锁」，然后对该记录加独占锁，意向锁的目的是为了**快速判断表里是否有记录被加锁**；**AUTO-INC 锁**（自增锁）","**行级锁**：InnoDB 引擎是支持行级锁的，而 MyISAM 引擎并不支持行级锁。**记录锁（Record Lock）**——锁住的是一条记录，记录锁有 S 锁和 X 锁之分，满足**读写互斥、写写互斥**；**间隙锁（Gap Lock）**——只存在于可重复读隔离级别，目的是为了解决可重复读隔离级别下幻读的现象；**临键锁（Next-Key Lock）**——是 Record Lock + Gap Lock 的组合，**锁定一个范围，并且锁定记录本身**"]},
{q:"数据库的表锁和行锁有什么作用", a:["**表锁的作用**：**整体控制**——表锁可以用来控制整个表的并发访问，当一个事务获取了表锁时，其他事务无法对该表进行任何读写操作，从而确保数据的完整性和一致性；**粒度大**——表锁的粒度比较大，在锁定表的情况下可能会影响到整个表的其他操作，可能引起锁竞争和性能问题；**适用于大批量操作**——适合需要大批量操作表中数据的场景，例如表的重建、大量数据的加载等","**行锁的作用**：**细粒度控制**——行锁可以精确控制对表中某行数据的访问，使得其他事务可以同时访问表中的其他行数据，在并发量大的系统中能够提升并发性能；**减少锁冲突**——行锁不会像表锁那样造成整个表的锁冲突，减少了锁竞争的可能性，提高了并发访问的效率；**适用于频繁单行操作**——适合需要频繁对表中单独行进行操作的场景，例如订单系统中的订单修改、删除等操作"]},
{q:"两个线程update同一条数据会不会阻塞", a:["**会阻塞**。如果是两个事务同时更新了 id = 1（比如 update ... where id = 1），是会发生阻塞的","因为 **InnoDB 存储引擎实现了行级锁**：当 A 事务对 id = 1 这行记录进行更新时，会对主键 id 为 1 的记录加 **X 类型的记录锁**，这样第二事务对 id = 1 进行更新时，发现已经有记录锁了，就会陷入阻塞状态"]},
{q:"两条update不同主键范围（<10和>15）会不会阻塞", a:["**不会**，因为锁住的范围不一样，不会形成冲突","第一条 update sql（id < 10）锁住的范围是 **(-∞, 10)**；第二条 update sql（id > 15）锁住的范围是 **(15, +∞)**"]},
{q:"如果不是主键或索引的范围update会阻塞吗", a:["**会阻塞**。如果 2 个范围查询的字段不是索引的话，那就代表 update 没有用到索引，这时候触发了**全表扫描**，全部索引都会加行级锁，这时候第二条 update 执行的时候就会阻塞了","因为如果 update 没有用到索引，在扫描过程中会对索引加锁，所以全表扫描的场景下所有记录都会被加锁——这条 update 语句产生了 **4 个记录锁和 5 个间隙锁**（区间分别为 (-∞,1)、(1,5)、(5,10)、(10,15)、(15,+∞)），**相当于锁住了全表**"]},
]},
{name:"日志", qa:[
{q:"日志文件分成哪几种", a:["**redo log 重做日志**：InnoDB 存储引擎层生成的日志，实现了事务中的**持久性**，主要用于掉电等故障恢复","**undo log 回滚日志**：InnoDB 存储引擎层生成的日志，实现了事务中的**原子性**，主要用于事务回滚和 MVCC","**bin log 二进制日志**：Server 层生成的日志，主要用于**数据备份和主从复制**","**relay log 中继日志**：用于**主从复制**场景下，slave 通过 io 线程拷贝 master 的 bin log 后本地生成的日志","**慢查询日志**：用于记录执行时间过长的 sql，需要设置阈值后手动开启"]},
{q:"讲一下binlog", a:["MySQL 在完成一条更新操作后，Server 层还会生成一条 binlog，等之后**事务提交的时候**，会将该事务执行过程中产生的所有 binlog **统一写入 binlog 文件**；binlog 是 MySQL 的 **Server 层**实现的日志，所有存储引擎都可以使用","binlog 是**追加写**，写满一个文件就创建一个新的文件继续写，**不会覆盖以前的日志**，保存的是全量的日志，用于**备份恢复、主从复制**","binlog 文件记录了所有**数据库表结构变更和表数据修改**的日志，**不会记录查询类的操作**（比如 SELECT 和 SHOW 操作）","**binlog 有 3 种格式类型**：**STATEMENT（默认格式）**——每一条修改数据的 SQL 都会被记录到 binlog 中（相当于记录了逻辑操作，所以这种格式的 binlog 可以称为**逻辑日志**），主从复制中 slave 端根据 SQL 语句重现；但 STATEMENT 有**动态函数的问题**，比如用了 uuid 或者 now 这些函数，在主库上执行的结果并不是在从库执行的结果，这种随时在变的函数会导致复制的数据不一致；**ROW**——记录**数据最终被修改成什么样**（这种格式的日志不能称为逻辑日志），不会出现 STATEMENT 下动态函数的问题；但 ROW 的缺点是**每行数据的变化结果都会被记录**，比如执行批量 update 语句，更新多少行数据就会产生多少条记录，使 binlog 文件过大，而在 STATEMENT 格式下只会记录一个 update 语句而已；**MIXED**——包含了 STATEMENT 和 ROW 模式，它会根据不同的情况自动使用 ROW 模式和 STATEMENT 模式"]},
{q:"UndoLog日志的作用", a:["undo log 是一种**用于撤销回退的日志**，它保证了事务的 ACID 特性中的**原子性（Atomicity）**","**在事务没提交之前，MySQL 会先记录更新前的数据到 undo log 日志文件里面，当事务回滚时，可以利用 undo log 来回滚**","每当 InnoDB 引擎对一条记录进行操作（修改、删除、新增）时，要把回滚时需要的信息都记录到 undo log 里：**插入一条记录时**——把这条记录的主键记下来，这样之后回滚时只需要把这个主键值对应的记录删掉就好了；**删除一条记录时**——把这条记录中的内容都记下来，这样之后回滚时再把由这些内容组成的记录插入到表中就好了；**更新一条记录时**——把被更新的列的旧值记下来，这样之后回滚时再把这些列更新为旧值就好了","在发生回滚时，就读取 undo log 里的数据，然后做**原先相反操作**——比如当 delete 一条记录时，undo log 中会把记录中的内容都记下来，然后执行回滚操作的时候，就读取 undo log 里的数据，然后进行 insert 操作"]},
{q:"有了undolog为啥还需要redolog", a:["**Buffer Pool 是提高了读写效率没错，但 Buffer Pool 是基于内存的，而内存总是不可靠**——万一断电重启，还没来得及落盘的脏页数据就会丢失","**为了防止断电导致数据丢失的问题**：当有一条记录需要更新的时候，InnoDB 引擎就会**先更新内存（同时标记为脏页），然后将本次对这个页的修改以 redo log 的形式记录下来**，这个时候更新就算完成了","后续，InnoDB 引擎会在适当的时候由后台线程将缓存在 Buffer Pool 的脏页**刷新到磁盘**里，这就是 **WAL（Write-Ahead Logging）技术**——MySQL 的写操作并不是立刻写到磁盘上，而是**先写日志，然后在合适的时间再写到磁盘上**"]},
{q:"redo log和undo log区别", a:["**redo log 记录了此次事务「完成后」的数据状态，记录的是更新之后的值**；它是**物理日志**，记录了某个数据页做了什么修改——比如对 XXX 表空间中的 YYY 数据页 ZZZ 偏移量的地方做了 AAA 更新，每当执行一个事务就会产生这样的一条或者多条物理日志","**undo log 记录了此次事务「开始前」的数据状态，记录的是更新之前的值**","**崩溃恢复的区别**：事务提交之前发生了崩溃，重启后会通过 **undo log 回滚**事务；事务提交之后发生了崩溃，重启后会通过 **redo log 恢复**事务","**redo log 保证持久性**：有了 redo log，再通过 WAL 技术，InnoDB 就可以保证即使数据库发生异常重启，之前已提交的记录都不会丢失，这个能力称为 **crash-safe（崩溃恢复）**","**写入性能区别**：写入 redo log 的方式使用了**追加操作**，所以磁盘操作是**顺序写**；而写入数据需要先找到写入位置然后才写到磁盘，所以磁盘操作是**随机写**——磁盘的「顺序写」比「随机写」高效得多，因此 redo log 写入磁盘的开销更小","**为什么需要 redo log 的两个答案**：① **实现事务的持久性，让 MySQL 有 crash-safe 的能力**——能够保证 MySQL 在任何时间段突然崩溃，重启后之前已提交的记录都不会丢失；② **将写操作从「随机写」变成了「顺序写」**，提升 MySQL 写入磁盘的性能"]},
{q:"redo log怎么保证持久性", a:["**1. Write-ahead logging (WAL)**：在事务提交之前，将事务所做的修改操作记录到 redo log 中，然后再将数据写入磁盘——这样即使在数据写入磁盘之前发生了宕机，系统可以通过 redo log 中的记录来恢复数据","**2. Redo log 的顺序写入**：redo log 采用**追加写入**的方式，将 redo 日志记录追加到文件末尾，而不是随机写入——这样可以减少磁盘的随机 I/O 操作，提高写入性能","**3. Checkpoint 机制**：MySQL 会**定期将内存中的数据刷新到磁盘**，同时将最新的 **LSN（Log Sequence Number）** 记录到磁盘中，这个 LSN 可以确保 redo log 中的操作是按顺序执行的；在恢复数据时，系统会根据 LSN 来确定**从哪个位置开始应用 redo log**"]},
{q:"能不能只用binlog不用redo log", a:["**不行**","binlog 是 **server 层**的日志，**没办法记录哪些脏页还没有刷盘**；redo log 是**存储引擎层**的日志，可以记录哪些脏页还没有刷盘，这样崩溃恢复的时候，就能恢复那些**还没有被刷盘的脏页数据**"]},
{q:"binlog两阶段提交过程", a:["**为什么需要两阶段提交**：事务提交后，redo log 和 binlog 都要持久化到磁盘，但是这两个是独立的逻辑，可能出现**半成功的状态**，这样就造成两份日志之间的逻辑不一致","**解决方式**：在 MySQL 的 InnoDB 存储引擎中开启 binlog 的情况下，MySQL 会同时维护 binlog 日志与 InnoDB 的 redo log，为了保证这两个日志的一致性，MySQL 使用了**内部 XA 事务**（由 binlog 作为**协调者**，存储引擎是**参与者**）","**prepare 阶段**：将 XID（内部 XA 事务的 ID）写入到 redo log，同时将 redo log 对应的事务状态设置为 prepare，然后将 redo log 持久化到磁盘（innodb_flush_log_at_trx_commit = 1 的作用）","**commit 阶段**：把 XID 写入到 binlog，然后将 binlog 持久化到磁盘（sync_binlog = 1 的作用），接着调用引擎的提交事务接口，将 redo log 状态设置为 commit——此时该状态并不需要持久化到磁盘，只需要 write 到文件系统的 page cache 中就够了，因为只要 binlog 写磁盘成功，就算 redo log 的状态还是 prepare 也没有关系，一样会被认为事务已经执行成功","**崩溃恢复**：不管是时刻 A（redo log 已经写入磁盘，binlog 还没写入磁盘）还是时刻 B（redo log 和 binlog 都已经写入磁盘、还没写入 commit 标识）崩溃，此时的 redo log 都处于 prepare 状态。MySQL 重启后会按顺序扫描 redo log 文件，碰到处于 prepare 状态的 redo log，就拿着 redo log 中的 **XID 去 binlog 查看是否存在此 XID**：① 如果 **binlog 中没有**当前内部 XA 事务的 XID，说明 redo log 完成刷盘但是 binlog 还没有刷盘，则**回滚事务**（对应时刻 A 崩溃恢复的情况）；② 如果 **binlog 中有**当前内部 XA 事务的 XID，说明 redo log 和 binlog 都已经完成了刷盘，则**提交事务**（对应时刻 B 崩溃恢复的情况）","**结论**：对于处于 prepare 阶段的 redo log，既可以提交事务也可以回滚事务，这取决于是否能在 binlog 中查找到与 redo log 相同的 XID；两阶段提交是**以 binlog 写成功为事务提交成功的标识**，因为 binlog 写成功了就意味着能在 binlog 中查找到与 redo log 相同的 XID"]},
{q:"update语句的具体执行过程", a:["具体更新一条记录 UPDATE t_user SET name = 'xiaolin' WHERE id = 1; 的流程如下：","**1. 执行器负责具体执行**，调用存储引擎的接口，通过主键索引树搜索获取 id = 1 这一行记录——如果 id=1 这一行所在的数据页本来就在 buffer pool 中，就直接返回给执行器更新；如果记录不在 buffer pool，将数据页从磁盘读入到 buffer pool，返回记录给执行器","**2. 执行器得到聚簇索引记录后**，看一下更新前的记录和更新后的记录是否一样——如果一样的话就不进行后续更新流程；如果不一样的话就把更新前的记录和更新后的记录都当作参数传给 InnoDB 层，让 InnoDB 真正执行更新记录的操作","**3. 开启事务**，InnoDB 层更新记录前，首先要记录相应的 **undo log**（因为这是更新操作，需要把被更新的列的旧值记下来），undo log 会写入 Buffer Pool 中的 Undo 页面，不过在内存修改该 Undo 页面后，需要记录对应的 redo log","**4. InnoDB 层开始更新记录**，会先更新内存（同时标记为脏页），然后将记录写到 **redo log** 里面，这个时候更新就算完成了——为了减少磁盘 I/O，不会立即将脏页写入磁盘，后续由后台线程选择一个合适的时机将脏页写入到磁盘，这就是 WAL 技术","**5. 至此，一条记录更新完了**","**6. 在一条更新语句执行完成后**，开始记录该语句对应的 **binlog**——此时记录的 binlog 会被保存到 **binlog cache**，并没有刷新到硬盘上的 binlog 文件，在事务提交时才会统一将该事务运行过程中的所有 binlog 刷新到硬盘","**7. 事务提交（两阶段提交）**：prepare 阶段——将 redo log 对应的事务状态设置为 prepare，然后将 redo log 刷新到硬盘；commit 阶段——将 binlog 刷新到磁盘，接着调用引擎的提交事务接口，将 redo log 状态设置为 commit","**8. 至此，一条更新语句执行完成**"]},
{q:"MySQL如何保障数据不丢失", a:["**主要是通过 redolog 来实现事务持久性的**","事务执行过程，会把对 innodb 存储引擎中数据页修改操作记录到 redolog 里，**事务提交的时候，就直接把 redolog 刷入磁盘**","即使脏页中途没有刷盘成功，mysql 宕机了，也能通过 **redolog 重做**，恢复到之前事务修改数据页后的状态，从而保障了数据不丢失"]},
{q:"RedoLog是在内存里吗", a:["**事务执行过程中，生成的 redolog 会在 redolog buffer 中，也就是在内存中**","等事务提交的时候，会把 redolog 写入磁盘"]},
{q:"为什么要写RedoLog而不是直接写B+树", a:["**因为 redolog 写入磁盘是顺序写，而 b+树里数据页写入磁盘是随机写**——顺序写的性能会比随机写好，这样可以提升事务提交的效率","**最重要的是 redolog 具备故障恢复的能力**：Redo Log 记录的是**物理级别的修改**，包括页的修改（如插入、更新、删除操作在磁盘上的物理位置和修改内容）——例如执行一个更新操作时，Redo Log 会记录修改的数据页的地址和更新后的数据，而不是 SQL 语句本身","**在数据页实际更新之前**，先将修改操作写入 Redo Log。当数据库重启时，会进行恢复操作：首先根据 Redo Log 检查哪些事务已经提交但数据页尚未完全写入磁盘；然后使用 Redo Log 中的记录对这些事务进行**重做（Redo）操作**，将未完成的数据页修改完成，确保事务的修改生效"]},
{q:"mysql两次写（double write buffer）了解吗", a:["**背景**：我们常见的服务器一般都是 Linux 操作系统，Linux 文件系统页（OS Page）的大小默认是 **4KB**，而 MySQL 的页（Page）大小默认是 **16KB**——MySQL 中一页数据刷到磁盘，要写 4 个文件系统里的页","**问题**：这个操作**并非原子操作**，比如操作系统写到第二个页的时候 Linux 机器断电了，这时候就会出现“**页数据损坏**”，并且这种“页数据损坏”**靠 redo 日志是无法修复的**","**Doublewrite Buffer 的出现就是为了解决这个问题**（虽然名字带了 Buffer，但实际上 Doublewrite Buffer 是**内存+磁盘**的结构）：作用是**在把页写到数据文件之前，InnoDB 先把它们写到一个叫 doublewrite buffer（双写缓冲区）的共享表空间内**，在写 doublewrite buffer 完成后，InnoDB 才会把页写到数据文件的适当位置；如果在写页的过程中发生意外崩溃，InnoDB 在稍后的恢复过程中会在 doublewrite buffer 中找到完好的 page 副本用于恢复——所以本质上是一个**最近写回的页面的备份拷贝**","**刷盘流程**：① 页数据先通过 memcpy 函数拷贝至内存中的 Doublewrite Buffer（大小约 2MB，分为两个区域，每次写入一个区域最多 1MB）；② Doublewrite Buffer 的内存里的数据页会 fsync 刷到 Doublewrite Buffer 的磁盘上，写两次到共享表空间中（连续存储、顺序写、性能很高，每次写 1MB）；③ 写入完成后，再将脏页刷到数据磁盘存储 .ibd 文件上（随机写）","**崩溃情况**：情况一——步骤 1 前宕机，刷盘未开始，数据在 redo log，后期可以恢复；情况二——步骤 1 后、步骤 2 前宕机，因为是在内存中，宕机清空内存，和情况一一样；情况三——步骤 2 后、步骤 3 前宕机，因为 DWB 的磁盘有完整的数据，可以修复损坏的页数据。**结论：double write buffer 是针对实际的 buffer 数据页的原子性保证**","**为什么 redolog 无法代替 double write buffer**：redolog 的设计之初是“账本的作用”，是一种操作日志，本质上是物理日志，记录的是“在某个数据页上做了什么修改”——**但如果数据页本身已经发生了损坏，redolog 来恢复已经损坏的数据块是无效的**，数据块本身已经损坏，再次重做依然是一个坏块；所以此时需要一个数据块的副本来还原该损坏的数据块，再利用重做日志进行其他数据块的重做操作，这就是 double write buffer 的原因作用"]},
]},
{name:"性能调优", qa:[
{q:"mysql的explain有什么作用", a:["**explain 是查看 sql 的执行计划**，主要用来分析 sql 语句的执行过程，比如**有没有走索引、有没有外部排序、有没有索引覆盖**等等","**执行计划参数**：**possible_keys** 字段表示可能用到的索引；**key** 字段表示实际用的索引（如果这一项为 NULL，说明没有使用索引）；**key_len** 表示索引的长度；**rows** 表示扫描的数据行数；**type** 表示数据扫描类型，需要重点看这个","**type 字段常见扫描类型的执行效率从低到高的顺序为**：**ALL（全表扫描）**——最坏的情况，采用了全表扫描的方式；**index（全索引扫描）**——index 和 all 差不多，只不过 index 对索引表进行全扫描，好处是不再需要对数据进行排序，但开销依然很大，所以要尽量避免全表扫描和全索引扫描；**range（索引范围扫描）**——一般在 where 子句中使用 <、>、in、between 等关键词，只检索给定范围的行，属于范围查找，从这一级别开始索引的作用越来越明显；**ref（非唯一索引扫描）**——采用了非唯一索引或唯一索引的非唯一性前缀，返回数据可能是多条，因为索引列的值并不唯一有重复，但好处是不需要全表扫描，因为索引有序即便有重复值也是在一个非常小的范围内扫描；**eq_ref（唯一索引扫描）**——使用主键或唯一索引时产生的访问方式，通常使用在多表联查中（如两张表联查关联条件是 user_id 相等且 user_id 是唯一索引）；**const（结果只有一条的主键或唯一索引扫描）**——使用了主键或者唯一索引与常量值进行比较（如 select name from product where id=1），const 是与常量比较查询效率更快，而 eq_ref 通常用于多表联查中","**extra 显示的结果中几个重要参考指标**：**Using filesort**——当查询语句中包含 group by 操作且无法利用索引完成排序操作时，不得不选择相应的排序算法甚至通过文件排序，效率很低要避免；**Using temporary**——使用了临时表保存中间结果，常见于排序 order by 和分组查询 group by，效率低要避免；**Using index**——所需数据只需在索引即可全部获得，不需要再到表中取数据，也就是使用了覆盖索引避免了回表操作，效率不错"]},
{q:"查询速度很慢有哪些解决方案", a:["**① 分析查询语句**：使用 EXPLAIN 命令分析 SQL 执行计划，找出慢查询的原因（比如是否使用了全表扫描、是否存在索引未被利用的情况等），并根据相应情况对索引进行适当修改","**② 创建或优化索引**：根据查询条件创建合适的索引，特别是经常用于 WHERE 子句的字段、ORDER BY 排序的字段、JOIN 连表查询的字段、group by 的字段；如果查询中经常涉及多个字段，考虑创建联合索引，使用联合索引要符合最左匹配原则，不然会索引失效","**③ 避免索引失效**：比如不要用左模糊匹配、函数计算、表达式计算等等","**④ 查询优化**：避免使用 SELECT *，只查询真正需要的列；使用覆盖索引（索引包含所有查询的字段）；联表查询最好要以**小表驱动大表**，并且被驱动表的字段要有索引，最好通过冗余字段的设计避免联表查询","**⑤ 分页优化**：针对 limit n 深分页的查询优化，可以把 Limit 查询转换成某个位置的查询——select * from tb_sku where id>20000 limit 10，该方案适用于主键自增的表","**⑥ 优化数据库表**：如果单表的数据超过了千万级别，考虑是否需要将大表拆分为小表，减轻单个表的查询压力；也可以将字段多的表分解成多个表（有些字段使用频率高、有些低，数据量大时会由于使用频率低的字段存在而变慢）","**⑦ 使用缓存技术**：引入缓存层如 Redis，存储热点数据和频繁查询的结果，但是要考虑**缓存一致性**的问题——对于读请求会选择旁路缓存策略，对于写请求会选择先更新 db、再删除缓存的策略"]},
{q:"Explain用到的索引不正确怎么干预", a:["**可以使用 force index，强制走索引**","比如：EXPLAIN SELECT productName, buyPrice FROM products **FORCE INDEX (idx_buyprice)** WHERE buyPrice BETWEEN 10 AND 80 ORDER BY buyPrice"]},
]},
{name:"主从复制与分库分表", qa:[
{q:"MySQL主从复制了解吗", a:["**MySQL 的主从复制依赖于 binlog**（记录 MySQL 上的所有变化并以二进制形式保存在磁盘上），复制的过程就是将 binlog 中的数据从主库传输到从库上。这个过程一般是**异步**的（主库上执行事务操作的线程不会等待复制 binlog 的线程同步完成）","**MySQL 集群的主从复制过程梳理成 3 个阶段**：**写入 Binlog**——主库写 binlog 日志、提交事务、并更新本地存储数据；**同步 Binlog**——把 binlog 复制到所有从库上，每个从库把 binlog 写到暂存日志（relay log）中；**回放 Binlog**——回放 binlog，并更新存储引擎中的数据","**具体详细过程**：MySQL 主库在收到客户端提交事务的请求之后，会**先写入 binlog，再提交事务，更新存储引擎中的数据**，事务提交完成后返回给客户端“操作成功”的响应；从库会创建一个专门的 **I/O 线程**，连接主库的 **log dump 线程**，来接收主库的 binlog 日志，再把 binlog 信息写入 **relay log 的中继日志**里，再返回给主库“复制成功”的响应；从库会创建一个用于**回放 binlog 的线程**（SQL 线程），去读 relay log 中继日志，然后回放 binlog 更新存储引擎中的数据，最终实现主从的数据一致性","**完成主从复制之后**，就可以在写数据时只写主库、在读数据时只读从库，这样即使写请求会锁表或者锁记录，也不会影响读请求的执行","**主从延迟的处理方法**：**强制走主库方案**——对于大事务或资源密集型操作，直接在主库上执行，避免从库的额外延迟"]},
{q:"分表和分库是什么有什么区别", a:["**分库**：是一种**水平扩展数据库的技术**，将数据根据一定规则划分到多个独立的数据库中，每个数据库只负责存储部分数据，实现了数据的拆分和分布式存储。分库主要是为了**解决并发连接过多、单机 mysql 扛不住**的问题","**分表**：指的是将单个数据库中的表拆分成多个表，每个表只负责存储一部分数据，这种数据的垂直划分能够提高查询效率、减轻单个表的压力。分表主要是为了**解决单表数据量太大导致查询性能下降**的问题","分库与分表可以从**垂直（纵向）和水平（横向）**两种维度进行拆分（以订单业务举例）：","**垂直分库**：按照业务和功能的维度拆分，将不同业务数据分别放到不同的数据库中，核心理念**专库专用**——按业务类型对数据分离，剥离为多个数据库，像订单、支付、会员、积分相关等表放在对应的订单库、支付库、会员库、积分库。垂直分库把一个库的压力分摊到多个库，提升了一些数据库性能，但**并没有解决由于单表数据量过大导致的性能问题**，所以需要配合后边的分表来解决","**垂直分表**：针对业务上字段比较多的大表进行的，一般是把业务宽表中比较独立的字段、或者不常用的字段拆分到单独的数据表中，是一种**大表拆小表**的模式。数据库以行为单位将数据加载到内存中，拆分以后核心表大多是访问频率较高的字段且字段长度都较短，因而可以**加载更多数据到内存中，减少磁盘 IO，增加索引查询的命中率**，进一步提升数据库性能","**水平分库**：把同一个表按一定规则拆分到不同的数据库中，每个库可以位于不同的服务器上，以此实现**水平扩展**。这种方案往往能解决单库存储量及性能瓶颈问题，但由于同一个表被分配在不同的数据库中，数据的访问需要**额外的路由工作**，因此系统的复杂度也被提升了","**水平分表**：是在同一个数据库内，把一张大数据量的表按一定规则切分成多个**结构完全相同**的表，而每个表只存原表的一部分数据。水平分表尽管拆分了表，但子表都还是在**同一个数据库实例**中，只是解决了单一表数据量过大的问题，并没有将拆分后的表分散到不同的机器上，还在竞争同一个物理机的 CPU、内存、网络 IO 等——要想进一步提升性能，就需要将拆分后的表分散到不同的数据库中，达到分布式的效果"]},
]},
]});
SECTIONS.push({id:"redis", title:"Redis面试篇", chapters:[
{name:"Redis基础", qa:[
{q:"redis为什么快", a:["**官方使用基准测试的结果是，单线程的 Redis 吞吐量可以达到 10W/每秒**","**① Redis 的大部分操作都在内存中完成，并且采用了高效的数据结构**——因此 Redis 瓶颈可能是机器的内存或者网络带宽，而并非 CPU，既然 CPU 不是瓶颈，那么自然就采用单线程的解决方案了","**② Redis 采用单线程模型可以避免多线程之间的竞争**，省去了多线程切换带来的时间和性能上的开销，而且也不会导致死锁问题","**③ Redis 采用了 I/O 多路复用机制处理大量的客户端 Socket 请求**——I/O 多路复用机制是指一个线程处理多个 IO 流，就是我们经常听到的 select/epoll 机制。简单来说，在 Redis 只运行单线程的情况下，该机制允许内核中同时存在多个监听 Socket 和已连接 Socket，内核会一直监听这些 Socket 上的连接请求或数据请求，一旦有请求到达，就会交给 Redis 线程处理，这就实现了一个 Redis 线程处理多个 IO 流的效果","**注意**：Redis 6.0 之后采用多个 I/O 线程来处理网络请求（因为随着网络硬件性能提升，Redis 的性能瓶颈有时会出现在网络 I/O 的处理上），但是对于命令的执行，Redis 仍然使用单线程来处理，所以不要误解 Redis 有多线程同时执行命令"]},
{q:"为什么redis6.0引入多线程", a:["**Redis 官方表示，Redis 6.0 版本引入的多线程 I/O 特性对性能提升至少是一倍以上**","**背景**：Redis 的主要工作（网络 I/O 和执行命令）一直是单线程模型，但随着网络硬件的性能提升，Redis 的性能瓶颈有时会出现在网络 I/O 的处理上，所以为了提高网络 I/O 的并行度，Redis 6.0 对于网络 I/O 采用多线程来处理","**默认情况**：I/O 多线程默认只针对**发送响应数据（write client socket）**，并不会以多线程的方式处理读请求（read client socket）；要想开启多线程处理客户端读请求，需要把 Redis.conf 配置文件中的 **io-threads-do-reads 配置项设为 yes**（//读请求也使用io多线程：io-threads-do-reads yes）","**配置方式**：io-threads N 表示启用 **N-1 个 I/O 多线程**（主线程也算一个 I/O 线程）；关于线程数的设置，官方的建议是如果为 4 核的 CPU 建议线程数设置为 2 或 3，如果为 8 核 CPU 建议线程数设置为 6，**线程数一定要小于机器核数，线程数并不是越大越好**","**Redis 6.0 之后启动时默认额外创建 6 个线程（不包括主线程）**：Redis-server 主线程——主要负责执行命令；bio_close_file、bio_aof_fsync、bio_lazy_free 三个后台线程——分别异步处理关闭文件任务、AOF 刷盘任务、释放内存任务；io_thd_1、io_thd_2、io_thd_3 三个 I/O 线程——io-threads 默认是 4，所以会启动 3（4-1）个 I/O 多线程，用来分担 Redis 网络 I/O 的压力"]},
{q:"redis和mysql的区别", a:["**存储介质**：Redis 是基于**内存存储**的 NoSQL 数据库，而 MySQL 是基于**磁盘存储**的关系型数据库——由于内存存储速度快，Redis 能够更快地读取和写入数据，而无需像 MySQL 那样频繁进行磁盘 I/O 操作","**数据结构**：Redis 是基于键值对存储数据的，支持简单的数据结构（字符串、哈希、列表、集合、有序集合）；相比之下，MySQL 需要定义表结构、索引等复杂的关系型数据结构，因此在某些场景下 Redis 的数据操作更为简单高效——比如 Redis 用哈希表查询只需要 **O(1)** 时间复杂度，而 MySQL 引擎的底层实现是 **B+Tree**，时间复杂度是 **O(logn)**","**线程模型**：Redis 采用单线程模型，可以避免多线程之间的竞争，省去了多线程切换带来的时间和性能上的开销，而且也不会导致死锁问题","**使用场景**：Redis 常用于缓存（热门数据存内存极大提高访问速度减轻数据库负载）、消息队列、分布式锁、排行榜、计数器等场景；MySQL 用于持久化存储、业务数据管理等需要复杂查询与事务保证的场景"]},
{q:"redis为什么默认16个数据库", a:["**多租户支持**：不同应用或不同业务模块可以使用不同的数据库进行隔离，避免 key 冲突","**组织与管理**：可以将不同类型的数据分库存储，便于分类管理和维护","**默认配置**：redis.conf 中的 databases 配置项默认值为 16（databases 16），可以通过修改配置文件调整数量","**注意：Redis Cluster 集群模式不支持多数据库，只有 0 号库**——因为集群模式下所有节点共享一个数据库，key 的分布由哈希槽决定"]},
