<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小林coding 面试题记忆卡</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --ink:#1c2430; --ink-2:#5b6575; --ink-3:#8b94a3;
  --line:#e4e7ec; --line-2:#d7dbe2;
  --side:#16202e; --side-ink:#c8d2de; --side-ink-2:#7c8ba0;
  --accent:#d97706; --accent-ink:#fff;
  --hl-bg:#fff3c4; --hl-ink:#7a4d00;
  --ok:#15803d; --ok-bg:#e7f6ec; --wait:#b45309; --wait-bg:#fdf1dc; --no:#b91c1c; --no-bg:#fdeaea;
  --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}

/* ===== 顶部栏 ===== */
.topbar{position:sticky;top:0;z-index:50;background:var(--side);color:#eef2f7;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.topbar-inner{max-width:1280px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px;letter-spacing:.5px;white-space:nowrap}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:15px;flex:none}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--side-ink-2);letter-spacing:0}
.searchbox{flex:1;min-width:200px;max-width:420px;position:relative}
.searchbox input{width:100%;padding:8px 14px 8px 34px;border-radius:8px;border:1px solid #334155;background:#0f1722;color:#eef2f7;font-size:13.5px;outline:none;transition:border-color .15s}
.searchbox input::placeholder{color:#64748b}
.searchbox input:focus{border-color:var(--accent)}
.searchbox svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:#64748b}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.tbtn{padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:600;border:1px solid #334155;color:#c8d2de;transition:all .15s;white-space:nowrap}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.tbtn.on{background:#0f1722;border-color:#f59e0b;color:#fbbf24}

/* ===== 布局 ===== */
.layout{display:grid;grid-template-columns:320px 1fr;max-width:1280px;margin:0 auto;gap:22px;padding:20px 18px 60px;align-items:start}
.sidebar{position:sticky;top:74px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;max-height:calc(100vh - 92px);overflow:auto}
.sidebar h3{font-size:13px;color:var(--ink-3);font-weight:600;margin-bottom:10px;letter-spacing:1px}
.nav-chapter{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 10px;border-radius:8px;font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:2px}
.nav-chapter:hover{background:#f0f2f5}
.nav-chapter .cnt{font-weight:500;font-size:11px;color:var(--ink-3);background:#eef0f3;border-radius:20px;padding:1px 8px}
.nav-chapter.current{background:#fef3e2;color:#92400e}
.nav-q{display:block;width:100%;text-align:left;padding:5px 10px 5px 22px;font-size:12.5px;color:var(--ink-2);border-radius:6px;line-height:1.5}
.nav-q:hover{background:#f0f2f5;color:var(--ink)}
.nav-q.current{color:var(--accent);font-weight:600}
.nav-q .done{float:right;color:var(--ok);font-size:11px;font-weight:700}
.nav-group{margin-bottom:4px}
.nav-group .qs{display:none}
.nav-group.open .qs{display:block}

.statbox{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line-2)}
.statbox .bar{height:8px;background:#eef0f3;border-radius:20px;overflow:hidden;margin:6px 0}
.statbox .bar i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#d97706);border-radius:20px;transition:width .3s}
.statbox .txt{font-size:12px;color:var(--ink-2)}

/* ===== 内容区 ===== */
main{min-width:0}
.section{scroll-margin-top:80px;margin-bottom:26px}
.sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.sec-head .no{font-size:12px;font-weight:900;color:var(--accent);letter-spacing:1px}
.sec-head h2{font-size:19px;font-weight:900;letter-spacing:.3px}
.sec-head .sub{font-size:12px;color:var(--ink-3)}
.chapter-label{margin:20px 0 10px;font-size:14px;font-weight:800;color:#334155;display:flex;align-items:center;gap:8px}
.chapter-label::before{content:"";width:4px;height:15px;border-radius:3px;background:var(--accent)}

/* 卡片 */
.qa{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.04);transition:border-color .15s}
.qa:hover{border-color:var(--line-2)}
.qa.open{border-color:#e8c98a}
.q-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;cursor:pointer;user-select:none}
.q-head .num{flex:none;width:26px;height:26px;border-radius:7px;background:#eef0f3;color:var(--ink-2);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.qa.open .q-head .num{background:var(--accent);color:#fff}
.q-head .q{flex:1;font-size:14.5px;font-weight:700;line-height:1.55}
.q-head .arrow{flex:none;width:16px;height:16px;margin-top:6px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);transition:transform .2s}
.qa.open .arrow{transform:rotate(225deg);margin-top:9px}
.a-body{display:none;padding:2px 16px 16px 52px;border-top:1px dashed var(--line);}
.qa.open .a-body{display:block}
.a-body ul{list-style:none}
.a-body li{position:relative;padding:3px 0 3px 16px;color:#3a4453;font-size:13.8px}
.a-body li::before{content:"";position:absolute;left:0;top:13px;width:6px;height:6px;border-radius:2px;background:#d9a55c}
mark, .hl{background:var(--hl-bg);color:var(--hl-ink);border-radius:3px;padding:0 3px;font-weight:600}
.a-body code{background:#eef1f5;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12.5px;font-family:Consolas,"Courier New",monospace;color:#0f4c81;word-break:break-all}
.a-body .codeblock{display:block;white-space:pre-wrap;background:#0f1722;color:#d6e2f0;padding:12px 14px;border-radius:8px;margin-top:8px;font-size:12.3px;line-height:1.65;word-break:break-word}
.a-body .tag{display:inline-block;font-size:11px;font-weight:700;color:var(--ink-3);border:1px solid var(--line-2);border-radius:4px;padding:0 6px;margin-right:6px;margin-bottom:6px}
.mastery{margin-top:10px;display:flex;gap:6px;align-items:center}
.mbtn{font-size:11.5px;padding:4px 10px;border-radius:20px;border:1px solid var(--line-2);color:var(--ink-2);font-weight:600;transition:all .15s}
.mbtn:hover{border-color:var(--ink-3)}
.mbtn.m{background:var(--no-bg);color:var(--no);border-color:#f3c1c1}
.mbtn.r{background:var(--wait-bg);color:var(--wait);border-color:#ecd29b}
.mbtn.k{background:var(--ok-bg);color:var(--ok);border-color:#bfe3c9}
.mastery .mbtn.active{box-shadow:inset 0 0 0 1.5px currentColor}
.mastery .reset{font-size:11px;color:var(--ink-3);margin-left:auto}
.mastery .reset:hover{color:var(--ink)}

/* 高光模式 */
body.hl-mode .a-body li{display:none}
body.hl-mode .a-body li.has-hl{display:block}
body.hl-mode .a-body .codeblock{display:none}
body.hl-mode .a-body li:not(.has-hl)::before{display:none}

/* 空状态 */
.empty{padding:60px 20px;text-align:center;color:var(--ink-3);font-size:14px}
.empty b{display:block;font-size:16px;color:var(--ink-2);margin-bottom:6px}

/* 页脚 */
.foot{max-width:1280px;margin:0 auto;padding:0 18px 40px;color:var(--ink-3);font-size:12px;text-align:center}

/* 侧边抽屉（移动端） */
#mask{display:none;position:fixed;inset:0;background:rgba(15,23,34,.5);z-index:60}
@media (max-width:960px){
  .layout{grid-template-columns:1fr;padding-top:14px}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:min(82vw,330px);z-index:70;border-radius:0;border:none;max-height:none;padding:18px 14px;transform:translateX(-105%);transition:transform .25s ease;box-shadow:0 0 30px rgba(0,0,0,.25)}
  .sidebar.show{transform:translateX(0)}
  #mask.show{display:block}
  .a-body{padding-left:16px}
  .topbar-inner{gap:8px}
  .searchbox{order:3;max-width:none;flex-basis:100%}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo">码</div>
      <div>小林coding 面试题记忆卡<small>Java · Spring · MySQL · Redis · JVM</small></div>
    </div>
    <div class="searchbox">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="搜索题目 / 关键词，如：HashMap、事务、线程池…" autocomplete="off">
    </div>
    <div class="tools">
      <button class="tbtn" id="btnMenu">目录</button>
      <button class="tbtn on" id="btnHl" title="只看答案中的高光要点">只看高光</button>
      <button class="tbtn" id="btnExpand">全部展开</button>
      <button class="tbtn" id="btnCollapse">全部收起</button>
      <button class="tbtn" id="btnReset">重置进度</button>
    </div>
  </div>
</header>
<div id="mask"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <h3>目 录 · 共 <span id="totalQ"></span> 题</h3>
    <div id="nav"></div>
    <div class="statbox">
      <div class="txt">整体掌握进度</div>
      <div class="bar"><i id="progressBar"></i></div>
      <div class="txt" id="progressTxt"></div>
    </div>
  </aside>

  <main id="main"></main>
</div>

<div class="foot">依据《小林coding 面试篇》PDF 整理 · 点击题目展开答案 · 黄色为原文高光要点 · 进度保存在本机浏览器</div>

<script>
/* ============================================================
 * 数据区：SECTIONS.push({id,title,chapters:[{name,qa:[{q,a,c}]}]})
 * a: 要点数组；要点中用 **高光** 标注重点；c: 可选的代码/命令块
 * ============================================================ */
const SECTIONS = [];
SECTIONS.push({id:"java-base", title:"Java基础面试篇", chapters:[
{name:"概念", qa:[
{q:"说一下Java的特点", a:["**平台无关性**：Java 的“编写一次，运行无处不在”是其最大特点。Java 编译器把源代码编译成字节码（bytecode），该字节码可以在任何安装了 JVM（Java 虚拟机）的系统上运行","**面向对象**：Java 是严格的面向对象语言，几乎一切都是对象。OOP 特性（类、对象、继承、多态、抽象、封装）使代码更易于维护和重用","**内存管理**：Java 有自带垃圾回收（GC）机制，自动管理内存并回收不再使用的对象，开发者无需手动管理内存，减少内存泄漏等问题"]},
{q:"Java的优势和劣势", a:["**优势**：跨平台（JVM 存在，一次编写到处运行）；面向对象（Java 从一开始就是 OOP 设计）；生态强大（Spring、Hibernate 等框架，社区大、企业应用广）；自动垃圾回收减少内存泄漏；内置多线程机制方便并发编程；安全模型（沙箱机制）适合网络环境；稳定性高、注重向后兼容","**劣势**：性能相对原生编译语言（C++/Rust）有开销，特别是启动时间（微服务场景不如 Go 快）；语法繁琐（样板代码多，虽引入 Lambda 仍不如 Python 简洁）；JVM 本身占内存，资源有限环境不友好；面向对象过于严格，写简单程序反而麻烦；开发效率低于 Python 等动态语言"]},
{q:"Java为什么是跨平台的", a:["依赖 **JVM 这个“中间层/桥梁”**：JVM 是软件，不同平台有不同版本。源码编译后生成 .class 字节码文件，JVM 负责把字节码翻译成特定平台下的机器码运行","只要在不同平台安装对应 JVM 就能运行同一份字节码，Java 程序本身无需任何改动，实现“一次编译，到处运行”","关键点：**编译结果不是机器码而是字节码**，字节码不能直接运行必须经 JVM 翻译；即使打包成 .exe 可执行文件仍需 JVM 支持；**跨平台的是 Java 程序而不是 JVM**，JVM 用 C/C++ 开发不能跨平台"]},
{q:"JVM、JDK、JRE三者关系", a:["**JVM**：Java 虚拟机，Java 程序运行的环境，负责把 Java 字节码（由编译器生成）解释或编译成机器码并执行，提供内存管理、垃圾回收、安全性等功能，使 Java 具备跨平台性","**JDK**：Java 开发工具包，开发 Java 程序所需的工具集合，包含 JVM、编译器（javac）、调试器（jdb）等开发工具以及一系列类库","**JRE**：Java 运行时环境，Java 程序运行所需的最小环境，包含 JVM 和一组 Java 类库，**不含开发工具**","包含关系：**JDK ⊃ JRE ⊃ JVM**（JDK 提供开发、编译、调试、运行的全部工具和环境）"]},
{q:"为什么Java解释和编译都有", a:["Java 先编译为字节码文件，进入 JVM 后包含**编译和解释两个步骤**：JVM 中有一个方法调用计数器，当累计计数大于一定值时使用 **JIT 编译**生成机器码文件并缓存（存于方法区 CodeCache）以备下次使用；否则用解释器解释执行","所以 Java **既是编译型也是解释型语言**，默认采用解释器和编译器混合的模式"]},
{q:"jvm是什么", a:["JVM 是 Java 虚拟机，主要工作是**解释自己的指令集（字节码）并映射到本地 CPU 指令集和 OS 的系统调用**","它屏蔽了与操作系统平台相关的信息，使 Java 程序只需生成在 JVM 上运行的目标代码（字节码）即可在多种平台不加修改地运行——这正是“一次编译，到处运行”的原因"]},
{q:"编译型语言和解释型语言的区别", a:["**编译型语言**：程序执行前，整个源代码被编译成机器码或字节码，生成可执行文件，执行时直接运行编译后的代码，速度快，但跨平台性较差（典型如 C、C++）","**解释型语言**：程序执行时逐行解释执行源代码，不生成独立可执行文件，通常由解释器动态解释并执行，跨平台性好，但执行速度相对较慢（典型如 Python、JavaScript）"]},
{q:"Python和Java区别", a:["**Java 是已编译的编程语言**：Java 编译器将源代码编译为字节码，字节码再由 Java 虚拟机执行","**Python 是解释型语言**：翻译时会在执行程序的同时进行翻译（逐行解释执行）"]},
]},
{name:"数据类型", qa:[
{q:"八种基本的数据类型", a:["Java 数据类型分两类：**基本数据类型**和**引用数据类型**。基本类型共 8 种分三类：数值型（整数 byte/short/int/long + 浮点 float/double）、字符型 char、布尔型 boolean；引用类型包括类（class）、接口（interface）、数组","字节数与范围：**byte 1字节(-2⁷~2⁷-1)、short 2字节、int 4字节、long 8字节、float 4字节、double 8字节、char 2字节(0~65535，无符号)、boolean 无明确大小(理论上 1 位)**","默认值：整数 0、浮点 0.0f/0.0d、char '\\u0000'、boolean false；long 加 L、float 加 F；浮点默认类型 double、整数默认 int；包装类除 char→Character、int→Integer 外其余首字母大写","场景：byte 适合节省内存（处理文件/网络流小整数）；int 最常用；long 用于 int 不够的大整数"]},
{q:"int和long是多少位多少字节", a:["**int 是 32 位 / 4 字节**，有符号整数，取值范围 -2³¹ 到 2³¹-1。例如计数器程序用 int 存储计数值最大正数 2,147,483,647，超过则溢出导致结果不符合预期","**long 是 64 位 / 8 字节**，有符号整数，取值范围 -2⁶³ 到 2⁶³-1。处理较大整数（如文件传输程序的文件大小）时 int 不够用就需 long"]},
{q:"long和int可以互转吗", a:["**可以**。由于 long 范围比 int 大，**int→long 是安全的自动转换**（直接赋值即可，如 long longValue = intValue）","**long→int 需要强制类型转换**，可能发生数据丢失或溢出：如果 longValue 超出 int 范围，转换结果将是截断后的低位部分，建议转换前先检查值是否在 int 范围内"]},
{q:"数据类型转换方式你知道哪些", a:["**自动类型转换（隐式）**：目标类型范围大于源类型时 Java 自动转换，不需要显式转换（如 int→long、float→double）","**强制类型转换（显式）**：目标类型范围小于源类型时使用，语法 `目标类型 变量 = (目标类型) 源类型`，可能导致数据丢失或溢出（如 long→int、double→int）","**字符串转换**：Integer.parseInt()、Double.parseDouble() 等把字符串转成其他类型","**数值之间转换**：通过包装类（Character、Integer 等）实现整型与字符型互转"]},
{q:"类型互转会出现什么问题吗", a:["小范围→大范围自动转换，**一般是安全的**；大范围→小范围会发生**数据溢出**或**精度损失**","**数据溢出**：目标类型无法容纳原数据时。如 300 的二进制为 00000001 00101100，强转 byte 丢弃高位只保留低位 8 位 00101100，十进制为 44","**精度损失**：浮点类型转换时发生。如 double 3.14 转 int 得 3，小数部分 0.14 被舍弃；float 转 double 也可能损失精度","**对象引用转换**：向上转型自动且安全；向下转型需手动且有风险——Java 对象运行时记录真实类型，若实际类型不兼容转型时抛 ClassCastException，需先用 instanceof 检查"]},
{q:"为什么用bigDecimal不用double", a:["**double 执行二进制浮点运算**，二进制某些情况下不能精确表示小数（就像十进制不能精确表示 1/3=0.3333...）。0.1 不能表示成 1/(2ⁿ) 的和的形式，所以无法精确表示","实际输出：0.05+0.01=0.060000000000000005、1.0-0.42=0.5800000000000001、4.015*100=401.49999999999994、123.3/100=1.2329999999999999","电商价格计算会出严重问题（0.06 元却买不了 0.05+0.01 的商品，并发量大时导致无法下单、对账出错），**涉及金钱计算必须用 BigDecimal**","BigDecimal 是精确计算，创建时**必须用字符串参数** new BigDecimal(\"0.1\") 而不是浮点数值，用 add()/multiply() 等方法运算"]},
{q:"装箱和拆箱是什么", a:["**装箱（Boxing）**：基本数据类型→对应包装类，如 Integer i = 10；**拆箱（Unboxing）**：包装类→基本数据类型，如 int n = i","自动装箱发生在**赋值时**（Java 1.5 前需手动 Integer.valueOf(3)，现在编译器自动完成）和**方法调用时**（show(3) 传 int 自动装箱；返回值 Integer 赋给 int 自动拆箱）","**弊端**：循环中自动装箱会创建大量多余对象。如 Integer sum=0; for(...){ sum+=i } 中 sum+=i 内部是 拆箱相加再装箱，4000 次循环创建近 4000 个无用 Integer 对象，降低性能并加重 GC 负担，编程时要注意正确声明变量类型"]},
{q:"Java为什么要有Integer", a:["Integer 是 int 的包装类，**把 int 包装成 Object 对象**，可以将属性（数据）与处理这些数据的方法结合（如 Integer 有 parseInt() 等处理 int 数据的专门方法）","**泛型只能使用引用类型**不能使用基本类型：List<Integer> 才能用 Collections.sort() 排序；**集合只能存储对象**：把 int 存入 ArrayList 必须包装成 Integer","基本类型和引用类型不能直接转换，必须通过包装类（如 int→Integer→String 用 integer.toString()）"]},
{q:"Integer相比int有什么优点", a:["int 是原始数据类型，Integer 是其包装类。**Integer 是引用类型**：可以赋 null 值、可用于泛型和集合、有对象方法；int 是基本类型无需实例化即可使用","**为什么保留 int**：基本数据类型读写效率比引用类型高（变量内存块直接存储数据本身），且 64 位 JVM 开启引用压缩时一个 Integer 对象占 16 字节、int 只占 4 字节（4 倍差距）——读写效率和存储效率基本类型都更优"]},
{q:"说一下integer的缓存", a:["Integer 类内部实现了一个**静态缓存池**，用于存储特定范围内的整数值对应的 Integer 对象","默认范围是 **-128 ~ 127**。通过 **Integer.valueOf(int)** 创建该范围内整数对象时不会每次都新建对象，而是复用缓存中的现有对象（直接从内存取出）"]},
]},
{name:"面向对象", qa:[
{q:"怎么理解面向对象？简单说说封装继承多态", a:["面向对象是一种编程范式，把现实世界事物抽象为对象，对象具有属性（字段）和行为（方法）；设计思想以对象为中心，通过对象间交互完成功能，灵活可扩展","**封装**：把对象属性（数据）和行为（方法）结合在一起，对外隐藏内部细节，仅通过对象提供的接口与外界交互，目的是增强安全性、简化编程、使对象更独立","**继承**：子类自动共享父类数据结构和方法的机制，是代码复用的重要手段，通过继承建立类与类之间的层次关系，使结构更清晰","**多态**：允许不同类的对象对同一消息作出响应，即同一个接口使用不同实例执行不同操作，分编译时多态（重载）和运行时多态（重写）"]},
{q:"多态体现在哪几个方面", a:["**方法重载**：同一类中多个同名方法、不同参数列表（参数类型、数量或顺序不同），编译器编译时根据传入参数确定调用哪个（如 add(int,int) 和 add(double,double)）","**方法重写**：子类提供父类同名方法的具体实现，运行时 JVM 根据对象实际类型确定调用哪个版本（如 Animal 的 sound 被 Dog 重写为 bark、Cat 重写为 meow）","**接口与实现**：多个类实现同一接口，用接口类型引用调用这些类的方法，面对不同实现保持一贯调用方式（如 Dog、Cat 都实现 Animal 接口，用 Animal 引用调用 makeSound 触发对应实现）","**向上转型/向下转型**：父类引用指向子类对象（向上转型），运行期采用不同子类实现；向下转型把父类引用转回子类类型，执行前需确认实际对象类型避免 ClassCastException"]},
{q:"多态解决了什么问题", a:["多态指**子类可以替换父类**，实际代码运行过程中调用子类的方法实现（需要继承、接口等语法机制支持）","**提高代码的扩展性和复用性**，是策略模式、基于接口而非实现编程、依赖倒置原则、里氏替换原则等设计模式/设计原则的代码实现基础，还能**去掉冗长的 if-else 语句**"]},
{q:"面向对象的设计原则", a:["**单一职责原则 SRP**：一个类应该只有一个引起它变化的原因，只负责一项职责（如员工类只负责管理员信息）","**开放封闭原则 OCP**：软件实体对扩展开放、对修改封闭（定义图形基类，新增图形类型通过继承扩展而不修改基类）","**里氏替换原则 LSP**：子类对象应该能替换掉所有父类对象（正方形继承矩形的行为问题就是反例）","**接口隔离原则 ISP**：客户端不应依赖它不需要的接口，接口应该小而专（用接口抽象层解耦底层和上层，如依赖注入）","**依赖倒置原则 DIP**：高层模块不应依赖低层模块，二者都依赖抽象；抽象不应依赖细节，细节应依赖抽象（公司类包含部门类应使用组合/聚合而非继承）","**最少知识原则（迪米特法则）**：一个对象应对其他对象有最少了解，只与其直接的朋友交互"]},
{q:"重载与重写有什么区别", a:["**重载（Overloading）**：同一个类中可以有多个同名方法，参数列表不同（参数类型、个数或顺序不同），编译器根据调用时的参数类型决定调用哪个方法（编译时确定）","**重写（Overriding）**：子类重新定义父类中的方法，方法名、参数列表和返回类型必须与父类一致，用 @Override 注解明确表示是对父类方法的重写（运行时确定）"]},
{q:"抽象类和普通类区别", a:["**实例化**：普通类可以直接实例化对象，抽象类不能被实例化只能被继承","**方法实现**：普通类方法都有具体实现；抽象类方法可以有实现也可以没有实现（抽象方法）","**继承限制**：一个类可以继承一个普通类并实现多个接口；一个类只能继承一个抽象类但可同时实现多个接口","**用途**：普通类可被其他类继承和使用；抽象类一般作为基类，被其他类继承和扩展使用"]},
{q:"Java抽象类和接口的区别", a:["**用途**：抽象类描述类的共同特性和行为，可有成员变量、构造方法和具体方法，适用于有明显继承关系的场景；接口定义行为规范，可多实现，适用于定义类的能力或功能","**实现方式**：接口用 implements、抽象类用 extends；一个类可实现多个接口但只能继承一个抽象类，用接口可间接实现多重继承","**成员**：接口成员变量默认为 public static final 必须赋初值不可修改，成员方法都是 public abstract（Java8 起可有 default/static 方法）；抽象类成员变量默认 default 可在子类中重新定义/赋值，抽象方法不能加 private/static/synchronized/native 修饰","**变量**：抽象类可包含实例变量和静态变量，接口只能包含常量（静态常量）"]},
{q:"抽象类能加final修饰吗", a:["**不能**。Java 抽象类是用来被继承的，而 final 修饰符用于禁止类被继承或方法被重写，抽象类和 final 是**互斥的**，不能同时使用"]},
{q:"接口里面可以定义哪些方法", a:["**抽象方法**：接口的核心，所有实现类必须实现，默认 public 和 abstract（修饰符可省略），如 void makeSound()","**默认方法**（Java 8 引入）：接口提供具体实现，实现类可以选择重写，如 default void sleep()","**静态方法**（Java 8 引入）：属于接口本身，通过接口名直接调用，不需要实现类对象","**私有方法**（Java 9 引入）：为默认方法或其他私有方法提供辅助功能，不能被实现类访问，只能在接口内部使用"]},
{q:"抽象类可以被实例化吗", a:["**不能直接实例化**：不能使用 new 关键字直接创建抽象类对象，抽象类存在意义是被继承（通常含一个或多个 abstract 修饰的无方法体方法）","但抽象类**可以有构造器**：子类实例化时这些构造器会被调用做必要的初始化工作（如 ConcreteClass 中 super() 调用 AbstractClass 构造器），实际创建的是子类实例，并不代表抽象类被实例化"]},
{q:"接口可以包含构造函数吗", a:["**不可以**。在接口里写构造方法时编译器会提示“Interfaces cannot have constructors”","原因：构造函数用于初始化 class 的属性或方法，在 new 的一瞬间自动调用；而**接口不能 new（没有自己的实例）**，构造函数根本没法被调用，所以不需要"]},
{q:"解释Java中的静态变量和静态方法", a:["静态变量和静态方法**与类本身关联而非与实例关联**，内存中只存在一份，可被所有实例共享","**静态变量（类变量）**：static 声明，类加载时初始化、只分配一次内存；可直接通过类名访问（推荐）也可通过实例访问；所有实例共享，一个实例修改其他实例也能看到；常用于所有对象间共享的数据（计数器、常量）","**静态方法**：属于类，可在没有创建类实例的情况下调用；不能直接访问非静态成员变量或方法（静态方法没有上下文的实例）；可直接调用其他静态成员；**不支持重写但可被隐藏**；常用于助手方法（utility methods）、获取类级别信息或与实例无关的数据处理"]},
]},
{name:"内部类 / final / 拷贝 / 泛型", qa:[
{q:"非静态内部类和静态内部类的区别", a:["**依赖关系**：非静态内部类依赖于外部类的实例，静态内部类不依赖外部类实例","**访问权限**：非静态内部类可以访问外部类的实例变量和方法（包括私有成员）；静态内部类只能访问外部类的静态成员，不能直接访问私有成员（需通过实例化外部类）","**静态成员**：非静态内部类不能定义静态成员，静态内部类可以定义静态成员","**实例化时机**：非静态内部类在外部类实例化后才能实例化；静态内部类可以独立实例化"]},
{q:"非静态内部类可以直接访问外部方法，编译器是怎么做到的", a:["**编译器在生成字节码时为非静态内部类维护一个指向外部类实例的引用**","编译器会在生成非静态内部类构造方法时**将外部类实例作为参数传入**，并在内部类实例化过程中建立外部类实例与内部类实例之间的联系，从而实现直接访问外部方法"]},
{q:"Java中final作用是什么", a:["**修饰类**：该类不能被继承，是继承体系中的最终形态。如 String 类用 final 修饰，保证不可变性和安全性，防止其他类通过继承改变其行为","**修饰方法**：该方法不能在子类中被重写。如 Object 类的 getClass 方法是 final 的，因为其行为由 JVM 底层实现保证，不应被子类修改","**修饰变量**：基本类型变量赋值后不可再改变（如 final int num=10 再赋值编译错误）；引用类型变量不能再指向其他对象，**但对象本身内容可以改变**（如 final StringBuilder sb 不能重新指向新对象，但可以 sb.append(\" World\") 修改内容）"]},
{q:"深拷贝和浅拷贝的区别", a:["**浅拷贝**：只复制对象本身和内部的值类型字段，不复制内部引用类型字段——创建新对象并把原对象字段值复制过去，但引用类型字段**只是把引用复制过去，两个对象指向同一个引用对象**","**深拷贝**：复制对象的同时把内部所有引用类型字段的内容也复制一份（不共享引用），**递归复制所有引用类型字段，生成全新对象及其内部所有对象**"]},
{q:"实现深拷贝的三种方法", a:["① **实现 Cloneable 接口并重写 clone()**：对象及其所有引用类型字段都实现 Cloneable 并重写 clone()，在 clone() 中通过递归克隆引用类型字段实现深拷贝（如 cloned.nestedObject = (NestedClass) nestedObject.clone()）","② **序列化和反序列化**：将对象序列化为字节流再从字节流反序列化，要求对象及其所有引用类型字段都实现 Serializable 接口（ObjectOutputStream 写、ObjectInputStream 读）","③ **手动递归复制**：针对特定对象结构，手动递归复制对象及其引用类型字段，适用于对象结构复杂度不高的情况"]},
{q:"什么是泛型", a:["泛型是 Java 的重要特性，**允许类、接口和方法在定义时使用一个或多个类型参数**，使用时再指定为具体类型","主要目的：在**编译时提供更强的类型检查**，编译后保留类型信息，避免运行时出现类型转换异常（ClassCastException）"]},
{q:"为什么需要泛型", a:["① **适用于多种数据类型执行相同代码**：如不同数字类型的加法，没有泛型需为 int/float/double 各重载一个 add 方法；用泛型 `<T extends Number> double add(T a, T b)` 可复用一个方法","② **类型安全**：不使用泛型的裸 List 中元素都是 Object 类型，取出时要人为强制类型转换且易出现 ClassCastException；引入泛型 List<String> 提供类型约束和编译前检查，**不需要强制类型转换**（编译器会检查类型）"]},
{q:"Java创建对象有哪些方式", a:["**new 关键字**：直接调用类的构造方法创建对象，最常见","**Class 类的 newInstance()**：通过反射机制创建对象，如 (MyClass) Class.forName(\"com.example.MyClass\").newInstance()（已过时，推荐 getDeclaredConstructor）","**Constructor 类的 newInstance()**：反射方式，可通过 Constructor 指定构造参数创建对象","**clone() 方法**：类实现 Cloneable 接口后可复制对象，如 (MyClass) obj1.clone()","**反序列化**：对象序列化保存到文件/流后再反序列化读取，前提是类实现 Serializable 接口；另有静态工厂/Builder 等"]},
{q:"New出的对象什么时候回收", a:["通过 new 创建的对象**由 Java 垃圾回收器（GC）自动回收**，程序运行过程中自动周期性地检测不再被引用的对象并回收释放内存","回收时机判定：① **引用计数法**：引用计数为 0 时可回收（主流不用，无法解决循环引用）；② **可达性分析算法**：从根对象（方法区类静态属性、方法局部变量等）出发沿引用链遍历，不可达的对象被回收；③ **终结器 Finalizer**：对象重写 finalize() 方法时 GC 在回收前调用做清理，但**执行时间不确定、可能带来不可预测的性能问题，不推荐使用**"]},
{q:"如何获取私有对象", a:["① **公共访问器方法（getter）**：设计良好的类会为私有成员提供公共 getter 方法，通过调用方法安全获取（遵循封装规范）","② **反射机制**：反射允许在运行时检查和修改类、方法、字段等信息，可绕过 private 限制——通过 getDeclaredField(\"privateField\") 获取字段，调用 **setAccessible(true)** 设置可访问性，再用 field.get(obj) 获取私有字段值"]},
]},
{name:"反射", qa:[
{q:"什么是反射", a:["Java 反射机制：**运行状态中，对于任意一个类都能知道它所有的属性和方法；对任意一个对象都能调用它的任意方法和属性**，这种动态获取信息以及动态调用对象方法的功能就是反射","四大特性：① **运行时类信息访问**（类名、包名、父类、接口、构造、方法、字段）；② **动态对象创建**（Class.newInstance()/Constructor.newInstance()，编译时不知道类名也可创建）；③ **动态方法调用**（Method.invoke() 可调用包括私有方法在内的方法）；④ **访问和修改字段值**（Field.get()/set()，即使是私有的）"]},
{q:"反射应用场景", a:["① **加载数据库驱动**：项目底层数据库可能用 mysql 也可能用 oracle，用 Class.forName(\"com.mysql.cj.jdbc.Driver\") 反射加载驱动类，换数据库只换传入的类名即可动态加载","② **配置文件加载**：Spring 框架 IOC 通过 XML/properties 配置 bean——把配置文件加载入内存→解析得到实体类字节码字符串和属性信息→**用反射根据字符串获得某个类的 Class 实例**→动态配置实例的属性","③ **框架底层**：Spring、MyBatis 等框架都依赖反射实现依赖注入和动态代理"]},
{q:"能讲一讲Java注解的原理吗", a:["**注解本质是一个继承了 Annotation 的特殊接口**，其具体实现类是 Java 运行时生成的动态代理类","通过反射获取注解时返回的是运行时生成的**动态代理对象**；通过代理对象调用自定义注解的方法，最终调用 **AnnotationInvocationHandler 的 invoke 方法**，该方法从 memberValues 这个 Map 中索引出对应的值，而 **memberValues 的来源是 Java 常量池**"]},
{q:"对注解解析的底层实现了解吗", a:["注解本质上是一种特殊接口，继承自 java.lang.annotation.Annotation，也叫声明式接口；编译后 Java 编译器将其转换为继承自 Annotation 的接口并生成字节码文件","按保留策略分三类：**源码级别**（仅存在于源码，编译后不保留 @Retention(SOURCE)）、**类文件级别**（保留在 .class 中但运行时不可见 CLASS）、**运行时注解**（保留在 .class 中可通过反射在运行时访问 RUNTIME），只有运行时注解能通过反射解析","RUNTIME 注解信息存储在字节码属性表（Attribute Table）：RuntimeVisibleAnnotations 存储运行时可见注解、RuntimeInvisibleAnnotations 存储不可见注解等，可用 javap -v 查看","解析依赖反射机制：核心类是 java.lang.reflect.**AnnotatedElement**（Class、Method、Field 等的父接口），提供 getAnnotation/getAnnotations/isAnnotationPresent；底层依赖 JVM 提供的 native 方法（getDeclaredAnnotations0 等），JVM 加载类时解析 .class 中的注解信息存入内存供反射使用"]},
{q:"Java注解的作用域", a:["**类级别作用域**：放置在类定义上，描述类属性（访问级别、继承关系、注释等）","**方法级别作用域**：放置在方法定义上，描述方法属性（访问级别、返回值类型、异常类型等）","**字段级别作用域**：放置在字段定义上，描述字段属性（访问级别、默认值等）","另外还有**构造函数作用域、局部变量作用域**等"]},
]},
{name:"异常", qa:[
{q:"介绍一下Java异常", a:["Java 异常体系基于 **Throwable**，有两个重要子类：Error 和 Exception","**Error（错误）**：表示运行时环境的错误，是程序无法处理的严重问题（系统崩溃、虚拟机错误、动态链接失败等），程序不应尝试捕获，如 OutOfMemoryError、StackOverflowError","**Exception（异常）**：程序本身可以处理的异常条件，分两大类：**非运行时异常**（编译期就必须被捕获或声明抛出，通常是外部错误，如 FileNotFoundException、ClassNotFoundException，强制处理增强健壮性）；**运行时异常 RuntimeException**（由程序错误导致，如 NullPointerException、ArrayIndexOutOfBoundsException，不需要在编译时强制捕获或声明）"]},
{q:"Java异常处理有哪些", a:["**try-catch 语句块**：try 块放可能抛出异常的代码，catch 块捕获并处理特定类型异常，可有多个 catch 处理不同类型","**throw 语句**：手动抛出异常，如 throw new ExceptionType(\"Exception message\")","**throws 关键字**：在方法声明中声明可能抛出的异常类型，方法内部不想处理时用 throws 把异常传递给调用者","**finally 块**：定义无论是否发生异常都会执行的代码，通常用于释放资源、确保资源正确关闭"]},
{q:"抛出异常为什么不用throws", a:["① **未检查异常（Unchecked Exceptions）**：继承自 RuntimeException 类或 Error 类的异常，编译器不强制要求异常处理，不需要在方法签名中用 throws 声明（如 NullPointerException、ArrayIndexOutOfBoundsException）","② **捕获和处理异常**：在方法内部捕获了可能抛出的异常并在方法内部处理，而不是通过 throws 子句传递给调用者"]},
{q:"try catch中的语句运行情况", a:["try 块中的代码**按顺序执行**；如果抛出异常，将在 catch 块中进行匹配和处理，处理完后程序继续执行 catch 块之后的代码","如果没有匹配的 catch 块，**异常将被传递给上一层调用的方法**"]},
{q:"try{return \"a\"} finally{return \"b\"}这条语句返回啥", a:["**返回 \"b\"**。finally 块中的 return 语句会**覆盖** try 块中的 return 返回"]},
]},
{name:"Object", qa:[
{q:"==与equals有什么区别", a:["**== 比较的是两个变量本身的值**：对于基本类型比较值是否相等；对于字符串/对象比较的是两个对象在内存中的首地址（引用是否指向同一对象），属于数值比较","**equals() 比较字符串包含内容是否相同**，属于内容比较（String 重写了 equals）","对于非字符串变量，如果没有重写 equals()，那么 == 和 equals 作用相同，都是比较对象在堆内存中的首地址，即判断两个引用变量是否指向同一个对象"]},
{q:"hashcode和equals方法有什么关系", a:["对于重写 equals 方法的类，**通常也需要重写 hashCode 方法**，遵循以下规定：","**一致性**：如果两个对象 equals 比较结果为 true，它们的 hashCode 值必须相同（obj1.equals(obj2) 为 true → obj1.hashCode() == obj2.hashCode()）","**非一致性**：两个对象 hashCode 相同，equals 结果不一定为 true（obj1.hashCode()==obj2.hashCode() 时 obj1.equals(obj2) 可能为 false），这种情况叫**哈希冲突**","两者紧密相关：保证使用哈希表等数据结构时对象的相等性判断和存储查找操作正常工作"]},
{q:"String、StringBuffer、StringBuilder的区别和联系", a:["**可变性**：String 不可变（Immutable），一旦创建内容无法修改，每次修改都会生成新对象（str=str+\"def\" 新建对象，str 指向新对象）；StringBuilder 和 StringBuffer 可变，可直接修改字符串内容不创建新对象（sb.append 直接修改内部数组）","**线程安全**：String 因不可变天然线程安全；StringBuilder 不是线程安全，适用于单线程环境；StringBuffer 是线程安全（方法通过 synchronized 同步），适用于多线程环境","**性能**：String 性能最低（频繁修改生成大量临时对象增加内存开销和 GC 压力）；StringBuilder 性能最高（无线程安全开销）；StringBuffer 略低于 StringBuilder（同步开销）","**场景**：内容固定或不常变用 String；单线程频繁修改用 StringBuilder；多线程频繁修改用 StringBuffer"]},
]},
{name:"Java新特性", qa:[
{q:"Java 8新特性", a:["**Lambda 表达式**：简化匿名内部类，支持函数式编程，(a,b)->a+b 代替匿名类实现接口","**函数式接口**：仅含一个抽象方法的接口，可用 @FunctionalInterface 标记（Runnable、Comparator 等）","**Stream API**：链式操作处理集合数据，支持并行处理，list.stream().filter(x->x>0).collect(...)","**Optional 类**：封装可能为 null 的对象，减少空指针异常，Optional.ofNullable(value).orElse(\"default\")","**方法引用**：System.out::println 等价于 x->System.out.println(x)；**接口默认方法与静态方法**：增强扩展性","**并行数组排序** Arrays.parallelSort；**重复注解** @Repeatable；**类型注解** List<@NonNull String>；**CompletableFuture**：增强异步编程，支持链式调用组合"]},
{q:"Lambda表达式了解吗", a:["Lambda 是**简洁的语法用于创建匿名函数**，主要用于简化函数式接口（只有一个抽象方法的接口）的使用","两种基本语法：(parameters) -> expression（Lambda 体只有一个表达式时，结果作为返回值）；(parameters) -> { statements; }（多条语句用大括号，有返回值需 return）","**优势**：代码简洁明了（对比匿名内部类 new Runnable(){...}，Lambda 只需一行 () -> System.out.println(...)）；更清晰表达代码意图（处理集合过滤映射）；**使 Java 支持函数式编程范式**，函数可作为参数传递（operate(3,5,(x,y)->x+y) 传加法函数，operate(3,5,(x,y)->x*y) 传乘法函数）","**缺点**：Lambda 是匿名的，调试时很难定位具体是哪个 Lambda 出现问题，嵌套或复杂时调试难度更大"]},
{q:"Java中stream的API介绍一下", a:["Java 8 引入 Stream API，提供**高效且易用的数据处理方式**，特别适合集合对象操作（过滤、映射、排序等），不仅提高代码可读性和简洁性，还能**利用多核处理器优势进行并行处理**","**案例 1 过滤**：传统做法需显式创建新 ArrayList + for 循环遍历 + if 判断 + add；Stream 做法 originalList.stream().filter(s->s.length()>3).collect(Collectors.toList()) 更简洁、逻辑一目了然","**案例 2 求和**：传统 for-each 循环累加；Stream 做法 numbers.stream().mapToInt(Integer::intValue).sum()，mapToInt 把 Integer 流转为 IntStream 高效处理基本类型"]},
{q:"Stream流的并行API是什么", a:["**是 ParallelStream**（并行流），将源数据分为多个子流对象进行多线程操作，再把处理结果汇总为一个流对象","底层使用**通用的 fork/join 池**：将一个任务拆分成多个“小任务”并行计算，再把结果合并成总的计算结果","**适用性**：CPU 密集型任务非常高效（ForkJoinPool 为每个 CPU 分配一个任务）；但如果任务是 I/O 密集且任务数相对线程数比较大，直接用 ParallelStream 并不是很好的选择"]},
{q:"completableFuture怎么用的", a:["CompletableFuture 由 Java 8 引入，**对 Future 进行了扩展**。Java 8 之前的 Future 只能通过阻塞或轮询获取异步计算结果，不支持设置回调方法（Java 8 前用 guava 的 ListenableFuture 设置回调，回调的引入导致臭名昭著的**回调地狱**）","CompletableFuture **同时实现 Future 和 CompletionStage 两个接口**：Future 表示异步计算结果，CompletionStage 表示异步执行过程中的一个步骤（可能由另一个 CompletionStage 触发，完成时也可能触发其他一系列步骤），从而可以根据业务对步骤进行多样化编排组合（thenApply、thenCompose 等函数式编程方法）","**对比示例**：三个有依赖关系的操作 step1/step2/step3（step3 依赖前两者结果）——ListenableFuture 需嵌套多层 addCallback 形成回调地狱；CompletableFuture 只需 cf1.thenCombine(cf2,(r1,r2)->{...执行 step3...}).thenAccept(...)，实现更简洁、可读性更好，一定程度解决回调地狱"]},
{q:"Java 21新特性", a:["**Switch 语句的模式匹配**：允许在 case 标签中使用模式匹配，更灵活和类型安全，减少样板代码和潜在错误（如 case savingsAccount sa -> result = sa.getSavings()）","**数组模式**：将模式匹配扩展到数组，能在条件语句中更高效地解构和检查数组内容，如 if (arr instanceof int[] {1,2,3}) 直接判断数组是否匹配指定模式","**字符串模板（预览版）**：更可读易维护地构建复杂字符串，支持在字符串字面量中直接嵌入表达式（替代 \"hello \" + name 的拼接写法）","**虚拟线程**：轻量级并发新选择，通过共享堆栈大大降低内存消耗、提高吞吐量和响应速度，可用静态构建方法、构造器或 ExecutorService 创建","**Scoped Values（范围值）**：在线程间共享不可变数据的新方式，避免传统线程局部存储，促进封装性和线程安全，可在不通过方法参数传递的情况下传递上下文信息（用户会话、配置设置）"]},
]},
{name:"序列化", qa:[
{q:"怎么把一个对象从一个jvm转移到另一个jvm", a:["① **序列化和反序列化**：将对象序列化为字节流发送到另一个 JVM，再反序列化恢复对象，通过 ObjectOutputStream 和 ObjectInputStream 实现","② **消息传递机制**：利用消息队列（RabbitMQ、Kafka）或网络套接字通信，将对象从一个 JVM 发送到另一个，需自定义协议序列化并在另一端反序列化","③ **远程方法调用（RPC）**：使用如 gRPC 等框架，在分布式系统中调用远程 JVM 上的对象方法","④ **共享数据库或缓存**：把对象存储在共享数据库（MySQL、PostgreSQL）或共享缓存（Redis）中，不同 JVM 访问共享数据，适用于需要共享数据但不需要直接传输对象的场景"]},
{q:"序列化和反序列化让你自己实现你会怎么做", a:["Java 默认序列化虽然实现方便，但存在**三大缺陷**：","**无法跨语言**：Java 序列化只适用于基于 Java 语言实现的框架，其它语言大多没有实现这套协议，两种不同语言编写的应用无法互相传输对象","**容易被攻击**：反序列化通过 ObjectInputStream 的 readObject() 完成，这个方法是一个“神奇的构造器”，可以把类路径上几乎所有实现了 Serializable 接口的对象实例化，反序列化过程中可执行任意类型代码，非常危险","**序列化后的流太大**：二进制流越大占存储空间越多、网络传输占带宽越多，影响系统吞吐量","**替代方案**：用主流序列化框架 Fastjson、Protobuf 替代。追求性能用 **Protobuf**：压缩存储效果好、编码解码性能高效，结合 .proto 文件格式和独特编码格式，只需简单的数据运算和位移操作即可完成编码与解码"]},
{q:"将对象转为二进制字节流具体怎么实现", a:["序列化机制通过**序列化协议**定义序列化后的字节流格式（和 class 文件类似），然后对此格式进行操作：生成符合格式的字节流或将字节流解析成对象","Java 中通过**序列化对象流**完成：**ObjectOutputStream 的 writeObject() 做序列化**，**ObjectInputStream 的 readObject() 做反序列化**","**只有实现了 Serializable 或 Externalizable 接口的类对象才能被序列化**，否则抛出异常；且要确保类实现了 Serializable 接口、所有成员变量都是 Serializable 才能被正确序列化（步骤：类实现 Serializable→FileOutputStream 包 ObjectOutputStream→writeObject 写入；反序列化：FileInputStream 包 ObjectInputStream→readObject 恢复）"]},
{q:"Native方法解释一下", a:["native 方法是一种特殊类型的方法，**允许 Java 代码调用外部本地代码（用 C、C++ 或其他语言编写）**；native 关键字用于标记一个方法的实现将在外部定义","在 Java 类中 native 方法看起来与其他方法相似，只是**方法体由 native 关键字代替，没有实际的实现代码**，如 public native void nativeMethod()","实现步骤：① **生成 JNI 头文件**（用 javah 工具从 Java 类生成包含所有 native 方法原型的 C/C++ 头文件）→ ② **编写本地代码**（C/C++ 实现，方法签名与头文件原型匹配）→ ③ **编译本地代码**（编译成动态链接库 DLL（Windows）/共享库 SO（Linux））→ ④ **加载本地库**（用 System.loadLibrary() 加载编译好的本地库，JVM 就能找到并调用 native 方法实现）"]},
]},
{name:"设计模式", qa:[
{q:"volatile和synchronized如何实现单例模式", a:["使用**双重检查锁定（DCL）**：`private static volatile SingleTon instance`，getInstance() 中先判空（避免每次访问都加锁），进入 synchronized(SingleTon.class) 同步块后再判空（保证只创建一次），只有第一次获取对象时才执行同步块，第二次以后 instance 非 null 直接返回","**volatile 有两个功能**：① 保证可见性（volatile 定义的变量保证对所有线程的可见性）；② **禁止指令重排序优化**——instance = new SingleTon() 分分配内存、实例化、赋值引用三步，volatile 禁止这些指令重排，保证其他线程不会访问到一个未初始化的对象，从而保证安全性"]},
{q:"代理模式和适配器模式有什么区别", a:["**目的不同**：代理模式主要关注**控制对对象的访问**；适配器模式用于**接口转换**，使不兼容的类能够一起工作","**结构不同**：代理模式一般包含抽象主题、真实主题和代理三个角色；适配器模式包含目标接口、适配器和被适配者三个角色","**应用场景不同**：代理模式常用于添加额外功能或控制对对象的访问；适配器模式常用于让不兼容的接口协同工作"]},
]},
{name:"I/O", qa:[
{q:"Java怎么实现网络IO高并发编程", a:["可以用 **Java NIO**，一种**同步非阻塞的 I/O 模型**，也是 I/O 多路复用的基础","传统 BIO 中 socket.read() 如果 TCP RecvBuffer 里没有数据，函数会一直阻塞直到收到数据；用 BIO 处理并发需要多线程模式（一个线程处理一个客户端 IO），客户端越来越多时线程越来越多，**急剧消耗系统性能**","NIO 基于 I/O 多路复用，可以**只用一个线程处理多个客户端 IO**，如果需同时管理成千上万连接但每个连接只发送少量数据（例如聊天服务器），用 NIO 实现更好"]},
{q:"BIO、NIO、AIO区别", a:["**BIO（blocking IO）**：传统 java.io 包，基于流模型，交互方式是同步、阻塞——读入输入流或输出流时线程会一直阻塞到读写动作完成。优点是代码简单直观；缺点是 IO 效率和扩展性很低，容易成为应用性能瓶颈","**NIO（non-blocking IO）**：Java 1.4 引入的 java.nio 包，提供 Channel、Selector、Buffer 等新抽象，可构建**多路复用、同步非阻塞**的 IO 程序，提供更接近操作系统底层的高性能数据操作方式","**AIO（Asynchronous IO）**：Java 1.7 后引入的包，是 NIO 的升级版，提供**异步非阻塞**的 IO 操作方式，基于事件和回调机制：应用操作之后会直接返回不阻塞，后台处理完成时操作系统通知相应线程进行后续操作"]},
{q:"NIO是怎么实现的", a:["NIO 是同步非阻塞 IO 模型：**同步**指线程不断轮询 IO 事件是否就绪；**非阻塞**指线程在等待 IO 时可以同时做其他任务","**同步的核心是 Selector（IO 多路复用）**：Selector 代替线程本身轮询 IO 事件，避免阻塞同时减少不必要的线程消耗；**非阻塞的核心是通道和缓冲区**：IO 事件就绪时数据写到缓冲区，保证 IO 成功而无需线程阻塞式等待","**三大核心部分**：Channel（通道）、Buffer（缓冲区）、Selector（选择区）。传统 IO 基于字节流和字符流，NIO 基于 Channel 和 Buffer——数据总是从通道读到缓冲区，或从缓冲区写入通道；**Selector 用于监听多个通道的事件**（连接打开、数据到达），因此单个线程可以监听多个数据通道；一个专门线程处理所有 IO 事件并负责分发，事件到来时触发操作，线程之间通过 wait/notify 通信减少线程切换"]},
{q:"你知道有哪个框架用到NIO了吗", a:["**Netty**。Netty 的 IO 模型基于非阻塞 IO，底层依赖 NIO 框架的多路复用器 Selector","采用 epoll 模式后，**只需要一个线程负责 Selector 的轮询**，当有数据处于就绪状态后，事件分发器（Event Dispatcher）负责把读写事件分发给对应的读写事件处理器（Event Handler）","事件分发器有两种设计模式：**Reactor**（采用同步 IO，实现相对简单，适合耗时短的场景，对于耗时长 IO 操作容易造成阻塞）和 **Proactor**（采用异步 IO，性能更高但实现逻辑非常复杂，适合图片或视频流分析服务器；目前主流事件驱动模型还是依赖 select 或 epoll 实现）"]},
]},
{name:"其他", qa:[
{q:"有一个学生类，想按照分数排序，再按学号排序，应该怎么做", a:["可以使用 **Comparable 接口**：在学生类中实现 Comparable<Student> 并重写 compareTo 方法，在 compareTo 中实现按分数排序再按学号排序的逻辑","compareTo 逻辑：**先比分数**（this.score != other.score 时返回 Integer.compare(other.score, this.score) 实现降序）；**分数相同再比学号**（返回 Integer.compare(this.id, other.id) 升序）","然后在需要排序的地方用 **Collections.sort(students)** 对学生列表排序即可"]},
]},
]});
SECTIONS.push({id:"java-collect", title:"Java集合面试篇", chapters:[
{name:"概念", qa:[
{q:"数组与集合区别，用过哪些", a:["**数组是固定长度的数据结构**，一旦创建长度就无法改变；**集合是动态长度的数据结构**，可以根据需要动态增加或减少元素","数组可以包含基本数据类型和对象，**集合只能包含对象**；数组可以直接访问元素，集合需要通过迭代器或其他方法访问元素","**用过的集合**：ArrayList（动态数组，实现 List 接口，支持动态增长）、LinkedList（双向链表，支持快速插入删除）、HashMap（基于哈希表的 Map，通过键快速查值）、HashSet（基于 HashMap 的 Set，存储唯一元素）、TreeMap（基于红黑树的有序 Map）、LinkedHashMap（哈希表+双向链表，保持插入或访问顺序）、PriorityQueue（优先队列，按比较器或自然顺序排序）"]},
{q:"说说Java中的集合", a:["Java 集合分 **Collection 和 Map** 两大体系：List/Set/Queue 继承 Collection；Map 是键值对集合，**没有继承 Collection 接口**","**List 是有序的 Collection**，能精确控制每个元素的插入位置、按索引访问元素，常用实现 LinkedList、ArrayList、Vector、Stack。ArrayList 是容量可变非线程安全的数组实现，扩容时创建更大数组并复制原数组，支持快速随机访问但插入删除慢；LinkedList 本质是双向链表，插入删除更快、随机访问更慢","**Set 不允许重复元素、无序**，常用 HashSet、LinkedHashSet、TreeSet。**HashSet 通过 HashMap 实现**（HashMap 的 key 即 HashSet 存储的元素，所有 key 用同一个 PRESENT 常量作 value），key 保证唯一性但不保证有序；LinkedHashSet 继承 HashSet 通过 LinkedHashMap 实现，用双向链表维护插入顺序；TreeSet 通过 TreeMap 实现，添加元素时按比较规则插入合适位置保证有序","**Map 存储键值映射**：key 无序唯一，value 允许重复。HashMap：JDK1.8 前数组+链表（数组是主体，链表用“拉链法”解决哈希冲突），1.8 后链表长度大于阈值（默认 8）时转红黑树减少搜索时间；LinkedHashMap 在 HashMap 基础上增加一条双向链表保持插入顺序（也实现访问顺序逻辑）；HashTable 数组+链表；TreeMap 红黑树；ConcurrentHashMap Node 数组+链表+红黑树、线程安全（1.7 前 Segment 锁，1.8 后 volatile+CAS 或 synchronized）"]},
{q:"Java中的线程安全的集合", a:["**java.util 包中线程安全的类主要 2 个**（其他都非线程安全）：**Vector**（线程安全动态数组，内部方法基本都经 synchronized 修饰，有同步额外开销，数组满时创建新数组拷贝原数据）；**Hashtable**（线程安全哈希表，每个方法加 synchronized 锁住整个 Table 对象，不支持 null 键值，性能开销大已很少推荐，可用 ConcurrentHashMap 替代）","**java.util.concurrent 包提供的都是线程安全集合**：并发 Map——**ConcurrentHashMap**（1.7 分段锁 Segment，1.8 取消 Segment 直接在 table 元素上加锁、put 时元素为空用 CAS 设置、不为空用 synchronized、链表超阈值转红黑树）、**ConcurrentSkipListMap**（基于跳表算法的可排序并发集合，对数时间完成搜索插入删除）；并发 Set——**ConcurrentSkipListSet**（线程安全有序，底层 ConcurrentSkipListMap）、**CopyOnWriteArraySet**（线程安全无序，通过动态数组 CopyOnWriteArrayList 实现，不是散列表）；并发 List——**CopyOnWriteArrayList**（ArrayList 的线程安全变体，写操作 Lock 加锁+拷贝新数组替换，读操作不加锁直接返回）；并发 Queue——**ConcurrentLinkedQueue**（无锁 CAS 实现高并发高性能，性能一般好于 BlockingQueue）、**BlockingQueue**（读写阻塞等待机制：队列空消费阻塞、队列满生产阻塞，简化多线程数据共享）；并发 Deque——**LinkedBlockingDeque**（线程安全双端队列，链表结构每节点维护前驱后继，没有读写锁分离同一时间只能一个线程操作）、ConcurrentLinkedDeque（基于链接节点的无限并发链表，可安全并发插入删除访问）"]},
{q:"Collections和Collection的区别", a:["**Collection 是 Java 集合框架中的一个接口**，是所有集合类的基础接口，定义了一组通用操作方法（添加、删除、遍历等），用于操作和管理一组对象；有 List、Set、Queue 等实现类","**Collections（注意有个 s）是 Java 提供的一个工具类**，位于 java.util 包，提供一系列静态方法对集合进行操作和算法：**排序、查找、替换、反转、随机化**等，可对实现了 Collection 接口的集合（如 List、Set）操作"]},
]},
{name:"遍历", qa:[
{q:"集合遍历的方法有哪些", a:["**普通 for 循环**：使用带索引的普通 for 循环遍历 List，通过 list.get(i) 访问元素","**增强 for 循环（for-each）**：用于循环访问数组或集合中的元素，代码简洁","**Iterator 迭代器**：使用迭代器遍历集合，**特别适用于需要删除元素的情况**（iterator.hasNext()/next()）","**ListIterator 列表迭代器**：迭代器的子类，**可以双向访问列表并在迭代过程中修改元素**（set 方法）","**forEach 方法**：Java 8 引入，list.forEach(element -> ...) 快速遍历","**Stream API**：Java 8 提供，可对集合进行函数式操作（过滤、映射等），list.stream().forEach(...)"]},
{q:"如何对map进行快速遍历", a:["**for-each + entrySet()**：较为常见和简洁，可以**同时获取 Map 的键和值**（for (Map.Entry<String,Integer> entry : map.entrySet()) 取 getKey()/getValue()）","**for-each + keySet()**：只需要遍历键时使用，简单、性能较好（for (String key : map.keySet()) 再 map.get(key)）","**使用迭代器**：通过 map.entrySet().iterator() 或 keySet() 迭代器遍历，**在需要删除元素等操作时比较有用**","**Lambda 表达式 + forEach()**：Java 8 及以上更简洁的函数式方式，map.forEach((key, value) -> ...)","**Stream API**：map.entrySet().stream().forEach(...)，还可以进行过滤、映射等操作（filter 后 Collectors.toMap 收集）"]},
]},
{name:"List", qa:[
{q:"讲一下java里面list的几种实现，几种实现有什么不同", a:["**ArrayList（非线程安全）**：基于动态数组实现，支持通过索引快速随机访问（**O(1)**）；添加删除元素时若操作位置不是列表末尾可能需要移动大量元素（O(n)），性能相对较低。适用于频繁随机访问、对插入删除性能要求不高的场景（数据查询展示）","**LinkedList（非线程安全）**：基于双向链表实现，插入删除元素只需修改链表指针（**O(1)**）不需要移动大量元素；但随机访问需从头或尾遍历（**O(n)**）。适用于频繁插入删除的场景（队列、栈等数据结构实现，列表中间频繁插删）","**Vector（线程安全）**：和 ArrayList 类似的动态数组，方法大多是同步的，多线程环境可保证数据一致性，但单线程下同步开销使性能略低于 ArrayList","**CopyOnWriteArrayList（线程安全）**：修改（添加删除）时创建新的底层数组把修改应用到新数组，**读操作仍在原数组上进行**，读写分离，读操作不被写操作阻塞，适合读远多于写的并发场景（如事件监听列表），避免大量锁竞争"]},
{q:"list可以一边遍历一边修改元素吗", a:["**使用普通 for 循环遍历**：可以修改元素，只要修改的索引不超出 List 的范围即可（list.set(i, list.get(i)*2)）","**使用 foreach 循环**：一般不建议直接修改正在遍历的 List 元素，可能导致意外结果或 **ConcurrentModificationException 异常**——因为 foreach 底层基于迭代器实现，遍历过程中修改集合结构会破坏迭代器内部状态，导致迭代器预期结构和实际结构不一致","**使用迭代器遍历**：删除元素用迭代器的 **remove** 方法；修改元素值用迭代器的 **set** 方法，而不是直接通过 List 的 set 方法，否则也可能抛 ConcurrentModificationException","**线程安全的 List（如 CopyOnWriteArrayList）**：由于写时复制机制，遍历同时可以修改，不会抛 ConcurrentModificationException，但可能读取到旧数据（修改在新副本上进行）"]},
{q:"list如何快速删除某个指定下标的元素", a:["**ArrayList 的 remove(int index)**：删除元素后将后续元素向前移动填补位置。**删除末尾元素 O(1)**；**删除中间元素 O(n)**（n 为元素个数，需要移动后续元素）","**LinkedList 的 remove(int index)**：需先遍历到指定下标位置再修改链表指针删除，**O(n)**（n 为要删除元素的下标）；但如果删除的是**头节点或尾节点，可直接修改头/尾指针，O(1)**","**CopyOnWriteArrayList 的 remove**：写操作时创建新数组，删除时间复杂度取决于数组复制速度，通常 **O(n)**（n 为数组长度）；但并发环境下删除操作不影响读操作，并发性能较好"]},
{q:"ArrayList和LinkedList的区别，哪个集合是线程安全的", a:["**底层数据结构不同**：ArrayList 使用数组实现，通过索引快速访问元素；LinkedList 使用链表实现，通过节点之间的指针进行元素访问和操作","**插入删除效率不同**：ArrayList 尾部插入删除效率高，中间或开头插入删除需移动元素效率低；LinkedList 任意位置插入删除只需调整节点指针（但**除了头结点外插入删除都是 O(n)**，因为要先遍历定位，所以 LinkedList 基本没人用）","**随机访问效率不同**：ArrayList 通过索引随机访问 **O(1)**；LinkedList 从头或尾遍历 **O(n)**","**空间占用**：ArrayList 创建时分配连续内存空间占用较大；LinkedList 每个节点只需存储元素和指针相对较小","**使用场景**：ArrayList 适用于频繁随机访问和尾部插入删除；LinkedList 适用于频繁中间插入删除和不需要随机访问的场景","**线程安全**：这两个集合都不是线程安全的，**Vector 是线程安全的**"]},
{q:"ArrayList线程安全吗?把ArrayList变成线程安全有哪些方法", a:["**不是线程安全的**。变成线程安全的方式：","① 使用 **Collections.synchronizedList(arrayList)** 将 ArrayList 包装成线程安全的 List","② 使用 **CopyOnWriteArrayList** 类代替 ArrayList（线程安全 List 实现，写时复制读写分离）","③ 使用 **Vector** 类代替 ArrayList（线程安全 List 实现）"]},
{q:"为什么ArrayList不是线程安全的，具体来说是哪里不安全", a:["高并发添加数据下，ArrayList 会暴露**三个问题**：部分值为 null（并没有 add null 进去）、索引越界异常、size 与 add 的数量不符","看 add 源码：`public boolean add(E e) { ensureCapacityInternal(size + 1); elementData[size++] = e; return true; }`，ensureCapacityInternal 判断是否需要扩容（需要则 grow），大体分三步：**判断扩容→在 size 位置设置值→size 加 1**","**部分值为 null**：线程 1 到扩容处发现 size=9 容量=10 不用扩容，CPU 让出执行权；线程 2 也进来发现不用扩容；线程 1 把下标 9 的位置 set 值但还没执行 size++，线程 2 又把下标 9 set 一遍，两个线程先后 size++，导致下标 10 处为 null","**索引越界异常**：线程 1 判断不用扩容，set 完之后 size++；线程 2 再进来 size 就是 10，数组大小只有 10，要设置下标 10 就越界（下标从 0 开始）","**size 与 add 数量不符**：几乎每次都会发生——size++ 本身不是原子操作（获取 size→加 1→覆盖写回），线程 1 和线程 2 拿到一样的 size 加完同时覆盖，导致一次没加上"]},
{q:"ArrayList和LinkedList的应用场景", a:["**ArrayList**：适用于需要频繁访问集合元素的场景，基于数组实现可通过索引快速访问，**按索引查找、遍历、随机访问性能高**；需要频繁访问遍历且集合大小不经常改变时推荐","**LinkedList**：适用于频繁进行插入和删除操作的场景，基于链表实现插入删除只需调整节点指针；**需要频繁插入删除或集合大小经常改变时**考虑使用"]},
{q:"ArrayList的扩容机制", a:["ArrayList 添加元素时，如果当前元素个数达到内部数组容量上限就**触发扩容**","步骤：① **计算新容量**（一般为原容量 **1.5 倍**，JDK 10 之后扩容策略做了调整），检查是否超过最大容量限制；② **创建新数组**（按新容量创建更大数组）；③ **将元素复制**（原数组元素逐个复制到新数组）；④ **更新引用**（内部指向原数组的引用指向新数组）；⑤ 完成扩容后可继续添加新元素","扩容涉及数组复制和内存重新分配，**频繁添加大量元素时影响性能**；可以在初始化时**预先分配足够大的容量**避免频繁扩容","扩容 1.5 倍是因为 **1.5 可以充分利用移位操作**（int newCapacity = oldCapacity + (oldCapacity >> 1)），减少浮点数和运算时间"]},
{q:"CopyonWriteArrayList是如何实现线程安全的", a:["底层通过一个数组保存数据，使用 **volatile 修饰数组**：`private transient volatile Object[] array;`，保证当前线程对数组对象重新赋值后其他线程能及时感知到","**写入操作**加了一把互斥锁 **ReentrantLock** 保证线程安全：获取锁→getArray() 获取当前数组→Arrays.copyOf(elements, len+1) 拷贝一份长度 +1→新元素放新数组最后一位→setArray(newElements) 替换引用→释放锁","**读操作不加锁**（get 直接 get(getArray(), index)）：替换地址前读的是老数组（有效数据），替换后读新数组（同样有效数据），**读写都加锁要更高效**","写时复制机制：修改操作在新副本上进行，遍历的同时可以修改不会抛 ConcurrentModificationException，但可能读到旧数据"]},
]},
{name:"Map", qa:[
{q:"HashMap实现原理", a:["**JDK 1.7 之前**：数据结构是数组+链表。HashMap 通过哈希算法将 key 映射到数组中的槽位（Bucket）；多个键映射到同一槽位时以链表形式存储（链表的查询时间是 **O(n)**），所以冲突很严重时一个索引上的链表非常长，效率很低（Java7 结构：Entry 数组+链表，Entry 有 key/value/next/hash）","**JDK 1.8 优化**：当一个链表长度超过 **8** 时转换数据结构不再用链表，改用**红黑树**存储，查找时间复杂度 **O(log n)** 提高查询性能；数量较少时（小于 6）红黑树转换回链表"]},
{q:"了解的哈希冲突解决方法有哪些", a:["**链接法**：使用链表或其他数据结构存储冲突的键值对，将它们链接在同一个哈希桶中（HashMap 采用）","**开放寻址法**：在哈希表中找到另一个可用位置存储冲突的键值对，常见方法包括**线性探测、二次探测和双重散列**","**再哈希法（Rehashing）**：发生冲突时使用另一个哈希函数再次计算键的哈希值，直到找到一个空槽存储","**哈希桶扩容**：哈希冲突过多时动态扩大哈希桶数量、重新分配键值对，减少冲突概率"]},
{q:"HashMap是线程安全的吗", a:["**不是**。多线程下存在问题：","**JDK 1.7**：数组+链表结构，多线程背景数组扩容时存在 **Entry 链死循环和数据丢失问题**（头插法导致环形链表）","**JDK 1.8**：数组+链表+红黑树结构，优化了 1.7 扩容方案，解决了 Entry 链死循环和数据丢失，但多线程下 **put 方法存在数据覆盖问题**","要保证线程安全：可以用 **Collections.synchronizedMap** 同步加锁、或用 Hashtable，但同步方式性能不达标；**ConcurrentHashMap 更适合高并发场景**（1.7 用 Segment+HashEntry 分段锁，1.8 抛弃 Segment 改为 CAS+synchronized+Node，并加入红黑树避免链表过长）"]},
{q:"hashmap的put过程", a:["第一步：根据要添加键的哈希码计算在数组中的位置（索引）","第二步：检查该位置是否为空——为空则直接在该位置创建新 Entry 存储键值对，modCount 加 1（用于迭代时发现并发修改）","第三步：位置已有键值对，检查第一个键值对的哈希码和键是否与要添加的相同——相同则找到相同 key，**直接用新值替换旧值完成更新**","第四步：第一个键值对哈希码和键不同，遍历链表或红黑树查找相同键：链表结构从头逐个比较哈希码和 equals()，**找到相同键则更新值，没找到则新键值对添加到链表头部**；红黑树结构用哈希码和 equals 定位节点比较，相同则更新、不同则加入红黑树","第五步：检查链表长度是否达到阈值（默认 8）——**超过且数组长度大于等于 64，链表转红黑树**提高查询效率","第六步：检查负载因子是否超过阈值（默认 0.75）——size 与数组长度比值大于阈值则扩容","第七步：扩容——**创建新两倍大小数组**，旧数组键值对重新计算哈希码分配到新数组位置，更新数组引用和阈值参数","第八步：完成添加操作。注意 HashMap 非线程安全，多线程环境需额外同步或使用 ConcurrentHashMap"]},
{q:"hashmap调用get方法一定安全吗", a:["**不一定**，有几点需要注意：","**空指针异常**：尝试用 null 作为键调用 get，而 HashMap 没有被初始化（为 null）时抛空指针异常；如果 HashMap 已初始化，用 null 作键是允许的（HashMap 支持 null 键）","**线程安全**：HashMap 本身非线程安全，多线程环境无适当同步措施时同时读写可能导致不可预测行为——一个线程 get 读取数据，另一线程同时修改结构（增删元素），可能导致读取错误结果或抛 ConcurrentModificationException；多线程环境考虑用 ConcurrentHashMap"]},
{q:"HashMap一般用什么做Key？为啥String适合做Key呢", a:["**用 String 做 key**，因为 **String 对象是不可变的**，一旦创建就不能被修改，这确保了 Key 的稳定性","如果 Key 是可变的，可能导致 **hashCode 和 equals 方法的不一致**，进而影响 HashMap 的正确性（可变 Key 内容改变后 hash 变化，原存储位置找不到）"]},
{q:"为什么HashMap要用红黑树而不是平衡二叉树", a:["**平衡二叉树追求“完全平衡”状态**：任何结点的左右子树高度差不超过 1，优势是结点平均分配；但要求太严格，**每次插入/删除节点几乎都会破坏平衡规则，都需要通过左旋和右旋调整**，维护成本高","**红黑树追求“弱平衡”状态**：整个树最长路径不超过最短路径的 **2 倍**，优势是虽然牺牲一部分查找性能，但**换取一部分维持平衡的成本**——插入删除时不会像平衡树那样频繁破坏规则、不需要频繁调整","所以大多数情况下使用红黑树（牺牲少量查找性能换取低成本维护平衡）"]},
{q:"hashmap key可以为null吗", a:["**可以为 null**。HashMap 用 hash() 方法计算 key 哈希值，**key 为空时直接令哈希值为 0，不走 key.hashCode() 方法**（`return (key == null) ? 0 : (h = key.hashCode()) ^ (h >>> 16);`）","HashMap 支持 key 和 value 为 null，但 **null 作为 key 只能有一个**（key 相同会覆盖同 key 的 value 为最新），**null 作为 value 可以有多个**"]},
{q:"重写HashMap的equal和hashcode方法需要注意什么", a:["HashMap 使用 Key 对象的 **hashCode() 和 equals()** 决定键值对的索引，获取值时也会用到这两个方法；如果实现不正确，两个不同 Key 也许会产生相同输出，HashMap 会认为它们相同然后覆盖，而非存到不同地方","所有不允许存储重复数据的集合类都用 hashCode 和 equals 查找重复，实现应遵循规则：","**如果 o1.equals(o2)，那么 o1.hashCode() == o2.hashCode() 总是为 true**","**如果 o1.hashCode() == o2.hashCode()，并不意味着 o1.equals(o2) 为 true**（哈希冲突）"]},
{q:"重写HashMap的equal方法不当会出现什么问题", a:["HashMap 比较元素时**先通过 hashCode 比较，相同的情况下再通过 equals 比较**：equals 相等的两个对象 hashCode 一定相等；hashCode 相等的两个对象 equals 不一定相等（散列冲突）","**只重写 equals 不重写 hashCode** 时，可能出现 equals 方法返回 true 而 hashCode 方法却不同（注意原文此处应为“不同”而非“false”）的后果，导致在 HashMap 等类中**存储多个一模一样（实为重复）的对象，出现覆盖存储数据的问题**，这与 HashMap 只能有唯一 key 的规范不符合"]},
{q:"列举HashMap在多线程下可能会出现的问题", a:["**JDK 1.7 的环形链表死循环**：1.7 HashMap 使用**头插法**插入元素，多线程环境下扩容时可能导致**环形链表的出现形成死循环**；因此 JDK 1.8 改用**尾插法**插入元素，扩容时保持链表元素原本顺序，不会出现环形链表问题","**元素覆盖丢失**：多线程同时执行 put 操作，如果计算出的索引位置相同，会造成**前一个 key 被后一个 key 覆盖，导致元素丢失**；此问题在 JDK 1.7 和 1.8 中都存在"]},
{q:"HashMap的扩容机制", a:["HashMap 默认负载因子 **0.75**：元素个数超过总容量 75% 则触发扩容，分两个步骤：**第一步对哈希表长度扩展（2 倍）**，**第二步把旧哈希表中的数据放到新哈希表**","因为是**2 次幂的扩展**（长度扩为原来 2 倍），元素位置要么在原位置、要么在原位置再移动 2 次幂的位置（如 16 扩为 32 时，hash 为 0101=5 仍在原位置，10101=21=5+16 到原位置+oldCap）","因此扩容时**不需要重新计算 hash**，只需看原来 hash 值新增的那个 bit 是 1 还是 0：是 0 索引没变，是 1 索引变成“原索引+oldCap”——既省去重新计算 hash 值的时间，又因为新增 bit 是 0 还是 1 可认为是随机的，**resize 过程均匀地把之前冲突的节点分散到新的 bucket**","JDK 1.7 与 1.8 扩容对比：1.7 取出数组元素遍历单向链表重新计算下标，会把原来冲突链表的尾部变成扩容后链表的头部；1.8 因长度 2 倍关系，只需判断原 hash 值与左移一位的新值按位与是 0 还是 1 来分配索引"]},
{q:"HashMap的大小为什么是2的n次方大小", a:["**2 次幂扩展时元素位置只需判断新增 bit**：要么在原位置、要么在原位置+oldCap，**省去重新计算 hash 的时间**（配合 (n-1) & hash 的取模优化）","resize 过程中能**均匀地把之前冲突的节点分散到新的 bucket**（新增 bit 是 0 还是 1 随机）"]},
{q:"往hashmap存20个元素，会扩容几次", a:["**初始容量 16**，负载因子默认 0.75，阈值 = 16 × 0.75 = 12","插入第 1 到第 12 个元素不需要扩容；**插入第 13 个元素时达到负载因子限制触发扩容**，容量从 16 扩容到 32；第 14 到第 20 个元素不需要扩容","**因此总共会扩容 1 次**"]},
{q:"说说hashmap的负载因子", a:["HashMap 负载因子 loadFactor 的默认值是 **0.75**：当元素个数超过容量 75% 时进行扩容","默认 0.75 是因为它提供了**空间和时间复杂度之间的良好平衡**：负载因子太低会导致大量空桶浪费空间；太高会导致大量碰撞降低性能；0.75 在这两个因素之间取得良好平衡"]},
{q:"HashMap和Hashtable有什么不一样的", a:["**HashMap**：线程不安全、效率高一点；**可以存储 null 的 key 和 value**（null key 只能一个、null value 可以有多个）；默认初始容量 **16**，每次扩充变为原来 **2 倍**（给定初始容量则扩充为 2 的幂次方大小）；底层数组+链表，链表长度大于阈值（默认 8）时先判断数组长度是否小于 64——小于则扩容数组，反之链表转红黑树减少搜索时间","**Hashtable**：线程安全、效率低一点，内部方法基本都经过 **synchronized** 修饰；**不可以有 null 的 key 和 value**；默认初始容量 **11**，每次扩容变为原来的 **2n+1**（给定初始容量会直接用给定大小）；底层数组+链表；**基本被淘汰**，要保证线程安全用 ConcurrentHashMap","怎么用：HashMap 主要存储键值对，调用 put 加入元素、get 获取值、containsKey 查看键是否存在"]},
{q:"ConcurrentHashMap怎么实现的", a:["**JDK 1.7**：数组+链表，大数组 **Segment** + 小数组 **HashEntry**。Segment 是一种**可重入锁（ReentrantLock）**扮演锁的角色，HashEntry 存储键值对。分段锁技术把数据分成一段一段存储，每段配一把锁，一个线程占用锁访问一个段时其他段仍可被其他线程访问，实现真正的并发访问","**JDK 1.8**：数组+链表/红黑树，**取消 Segment**，通过 **volatile + CAS 或 synchronized** 实现线程安全：容器为空用 volatile+CAS 初始化；根据存储元素计算结果位置为空则用 CAS 设置该节点；不为空则使用 synchronized 锁头结点，遍历桶中数据替换或新增节点，最后判断是否转红黑树","**锁粒度更小**（对头结点加锁，相比 Segment 更小，冲突和加锁频率降低、并发性能提高）；**红黑树优化固定链表**，数据量大时查询从 O(n) 优化到 **O(logn)**"]},
{q:"分段锁怎么加锁的", a:["ConcurrentHashMap 将整个数据结构分为**多个 Segment**，每个 Segment 都类似一个小 HashMap，**每个 Segment 都有自己的锁**","对于插入、更新、删除等操作，**先定位到具体的 Segment，再在该 Segment 上加锁**，而不是像传统 HashMap 对整个数据结构加锁，使不同 Segment 之间的操作**并行进行**，提高并发性能"]},
{q:"分段锁是可重入的吗", a:["**是**。JDK 1.7 ConcurrentHashMap 中的分段锁用的是 **ReentrantLock**，是可重入的锁"]},
{q:"已经用了synchronized，为什么还要用CAS", a:["ConcurrentHashMap 使用两种手段保证线程安全是一种**权衡**，用 synchronized 还是 CAS 主要**根据锁竞争程度判断**","putVal 中如果计算出的 hash 槽**没有存放元素**，可以直接用 **CAS 设置值**：因为 hash 值经过各种扰动后造成碰撞的几率较低，可预测使用较少的自旋就能完成 hash 落槽操作","**发生 hash 碰撞**时说明容量不够或已有大量线程访问，此时用 **synchronized** 处理比 CAS 效率高——碰撞大概率意味着线程竞争比较强烈"]},
{q:"ConcurrentHashMap用了悲观锁还是乐观锁", a:["**悲观锁和乐观锁都有用到**","添加元素时先判断容器是否为空：为空则使用 volatile 加 **CAS（乐观锁）** 初始化；容器不为空则根据存储元素计算结果位置是否为空——位置为空利用 **CAS（乐观锁）** 设置该节点；位置不为空则使用 **synchronized（悲观锁）** 锁住该元素，遍历桶中数据替换或新增节点，最后判断是否转红黑树"]},
{q:"HashTable底层实现原理是什么", a:["Hashtable 底层数据结构主要是**数组+链表**：数组是主体，链表是解决 hash 冲突存在的（Bucket 数组 + Linked List 存储 Key）","**线程安全**：所有公共方法均采用 **synchronized** 关键字——当一个线程访问同步方法，另一个线程访问时会陷入阻塞或轮询状态","由此带来的问题：**任何一个时刻只能有一个线程操纵 Hashtable**，效率比较低；put/get 都做成同步方法（put 校验 value 非空、get 遍历链表查找）"]},
]},
{name:"Set", qa:[
{q:"Set集合有什么特点？如何实现key无重复的", a:["**Set 集合元素是唯一的**，不会出现重复的元素","**实现原理**：Set 集合通过内部数据结构（哈希表、红黑树等）实现 key 无重复——向 Set 插入元素时**先根据元素的 hashCode 值确定存储位置，再通过 equals 方法判断是否已存在相同元素**，如果存在则不会再次插入，保证元素唯一性"]},
{q:"有序的Set是什么？记录插入顺序的集合是什么", a:["**有序的 Set 是 TreeSet 和 LinkedHashSet**：TreeSet 基于红黑树实现，保证元素的自然顺序（排序）；LinkedHashSet 基于**双重链表和哈希表的结合**实现元素有序存储，保证元素添加的自然顺序（插入顺序）","**记录插入顺序的集合通常指 LinkedHashSet**：不仅保证元素唯一性，还可以保持元素的插入顺序；需要在 Set 集合中记录元素插入顺序时选择 LinkedHashSet"]},
]},
]});
SECTIONS.push({id:"java-concurrent", title:"Java并发面试篇", chapters:[
{name:"多线程基础", qa:[
{q:"java里面的线程和操作系统的线程一样吗", a:["**一样**。Java 底层会调用 pthread_create 来创建线程，所以本质上 Java 程序创建的线程和操作系统线程是一样的","是 **1 对 1 的线程模型**：一个用户线程对应一个内核线程"]},
{q:"使用多线程要注意哪些问题", a:["要保证多线程程序是安全的，**不要出现数据竞争造成的数据混乱**。Java 的线程安全体现在三个方面：","**原子性**：提供互斥访问，同一时刻只能有一个线程对数据进行操作，Java 中用 atomic 包（原子操作类）和 synchronized 关键字确保原子性","**可见性**：一个线程对主内存的修改可以及时被其他线程看到，Java 中用 synchronized 和 volatile 确保可见性","**有序性**：一个线程观察其他线程中的指令执行顺序，由于指令重排序该观察结果一般杂乱无序，Java 中用 **happens-before 原则**确保有序性"]},
{q:"保证数据的一致性有哪些方案呢", a:["**事务管理**：使用数据库事务确保一组操作要么全部成功提交、要么全部失败回滚，通过 ACID（原子性、一致性、隔离性、持久性）属性保证数据一致性","**锁机制**：使用锁实现对共享资源的互斥访问，Java 中可用 synchronized 关键字、ReentrantLock 或其他锁机制控制并发访问，避免并发操作导致数据不一致","**版本控制**：通过乐观锁方式，在更新数据时记录数据的版本信息，避免同时对同一数据进行修改，进而保证数据一致性"]},
{q:"线程的创建方式有哪些", a:["**1. 继承 Thread 类**：自定义类继承 java.lang.Thread 类重写 run()，创建实例后调用 start() 启动。优点：编写简单，访问当前线程直接用 this 即可（无需 Thread.currentThread()）；缺点：已继承 Thread 不能再继承其他父类","**2. 实现 Runnable 接口**：已继承其他类时实现 java.lang.Runnable 重写 run()，把 Runnable 对象传给 Thread 构造器再 start()。优点：还能继承其他类；**多个线程可共享同一个 target 对象**，适合多个相同线程处理同一份资源，将 CPU 代码和数据分开形成清晰模型；缺点：编程稍复杂，访问当前线程必须用 Thread.currentThread()","**3. 实现 Callable 接口与 FutureTask**：Callable 的 call() **可以有返回值并且可以抛异常**；需包装进 FutureTask（FutureTask 实现 Runnable）再交给 Thread，用 futureTask.get() 获取执行结果","**4. 使用线程池（Executor 框架）**：Java 5 引入 ExecutorService，避免频繁创建销毁线程的开销，Executors 静态方法可创建不同类型线程池。优点：重用预先创建的线程显著提高性能、可控制运行线程数量防止资源耗尽、合理配置最大化 CPU 利用率和吞吐量；缺点：增加程序复杂度，错误配置可能导致死锁、资源耗尽，诊断修复较复杂"]},
]},
{name:"线程控制与状态", qa:[
{q:"怎么启动线程", a:["启动线程通过 **Thread 类的 start() 方法**（创建两个线程分别调用 myThread1.start()、myThread2.start()）"]},
{q:"如何停止一个线程的运行", a:["**异常法停止**：线程调用 interrupt() 后，在线程的 run 方法中判断当前对象的 interrupted() 状态，是中断状态则抛出异常达到中断线程的效果","**在沉睡中停止**：先将线程 sleep，然后调用 interrupt 标记中断状态，interrupt 会将阻塞状态的线程中断，抛出中断异常达到停止效果","**stop() 暴力停止**：线程调用 stop() 会被暴力停止，**方法已弃用**——强制停止可能使一些清理性工作得不到完成","**使用 return 停止线程**：调用 interrupt 标记为中断状态后，在 run 方法中判断当前线程状态，是中断状态则 return，达到停止效果","**正确实践**：通过协作式逻辑控制线程终止（共享标志位循环检测、中断机制配合 isInterrupted()、Future.cancel() 取消任务、资源关闭解除不可中断阻塞），避免使用已废弃的 Thread.stop()（暴力终止状态不一致）、Thread.suspend()/resume()（易死锁）"]},
{q:"调用interrupt是如何让线程抛出异常的", a:["每个线程都有一个与之关联的**布尔属性表示中断状态**，初始值为 false；当一个线程被其他线程调用 Thread.interrupt() 中断时，会根据实际情况做出响应","**如果该线程正在执行低级别的可中断方法**（如 Thread.sleep()、Thread.join() 或 Object.wait()），则会**解除阻塞并抛出 InterruptedException 异常**","**否则 Thread.interrupt() 仅设置线程的中断状态**，被中断的线程稍后可通过轮询中断状态（isInterrupted()）来决定是否停止当前正在执行的任务；注意 interrupt() **不会立刻终止线程**，只是设置中断标志位"]},
{q:"Java线程的状态", a:["**NEW**：尚未启动的线程状态，即线程创建还未调用 start 方法","**RUNNABLE**：就绪状态（调用 start 等待调度）+ 正在运行（运行中 RUNNING），运行中线程可通过系统调度回到就绪 READY、调用 yield() 切换状态","**BLOCKED**：等待监视器锁时陷入阻塞状态——试图获取对象锁但锁已被其他线程持有（如进入 synchronized 块/方法时锁被占用），直到锁可用","**WAITING**：等待状态的线程正在等待另一线程执行特定的操作（如 Object.wait()、join()、LockSupport.park()），不消耗 CPU、不参与锁竞争","**TIMED_WAITING**：具有指定等待时间的等待状态（Thread.sleep(long)、Object.wait(long)、join(long)、LockSupport.parkNanos/parkUntil）","**TERMINATED**：线程完成执行，终止状态。可通过 Thread.getState() 获取当前线程状态"]},
{q:"sleep和wait的区别", a:["**所属类不同**：sleep 是 Thread 类的**静态方法**，任何地方可直接 Thread.sleep() 调用；wait 是 Object 类的**实例方法**，必须通过对象实例调用","**锁释放情况不同**：Thread.sleep() 线程暂停执行指定时间但**不会释放持有的对象锁**；Object.wait() 调用时线程**释放持有的对象锁**进入等待状态，直到其他线程调用相同对象的 notify()/notifyAll() 唤醒","**使用条件不同**：sleep 可在任意位置调用无需事先获取锁；wait **必须在同步块或同步方法内调用**（需持有该对象的锁），否则抛 IllegalMonitorStateException","**唤醒机制不同**：sleep 休眠时间结束后线程**自动恢复**到就绪状态等待 CPU 调度；wait 需要其他线程调用相同对象的 notify()（随机唤醒一个）或 notifyAll()（唤醒所有）才能被唤醒，或等待超时","**设计用途不同**：sleep 暂停线程执行，不涉及锁协作；wait 线程间协调，释放锁让其他线程工作"]},
{q:"sleep会释放cpu吗", a:["**会释放 CPU，但不会释放持有的锁**","线程调用 sleep() 后会主动让出 CPU 时间片，进入 **TIMED_WAITING** 状态，操作系统触发调度把 CPU 分配给其他就绪线程；但 sleep() **不会释放已持有的任何锁**（如 synchronized 中获取的锁），其他线程试图获取同一把锁仍会被阻塞，直到原线程退出同步代码块"]},
{q:"blocked和waiting有啥区别", a:["**触发条件不同**：BLOCKED 通常是因为**试图获取对象锁但锁已被另一线程持有**（发生在尝试进入 synchronized 块或方法时）；WAITING 是因为**正在等待另一线程执行某些操作**（Object.wait()、Thread.join()、LockSupport.park()），不消耗 CPU、不参与锁竞争","**触发方式不同**：BLOCKED 是锁竞争失败后**被动触发**的状态；WAITING 是**人为主动触发**的状态","**唤醒方式不同**：BLOCKED 的唤醒是**自动触发**的（锁释放后线程重新尝试获取锁，锁未被获取则从 BLOCKED 变为 RUNNABLE）；WAITING **必须通过特定方法主动唤醒**（notify()/notifyAll()、unpark 等）"]},
{q:"wait状态下的线程如何恢复到running状态", a:["线程从 WAITING 状态恢复到 RUNNING 状态的核心机制是**通过外部事件触发或资源可用性变化**","例如等待的线程被其他线程唤醒：调用同一对象上的 **notify() 或 notifyAll()** 方法后，等待线程退出 wait 状态重新竞争锁，获得锁后恢复运行"]},
]},
{name:"线程通信", qa:[
{q:"notify和notifyAll的区别", a:["相同点：**同样都是唤醒等待的线程，同样最多只有一个线程能获得锁，同样不能控制哪个线程获得锁**","**notify 唤醒一个线程**：其他线程依然处于 wait 的等待唤醒状态；如果被唤醒的线程结束时没调用 notify，其他线程就永远没人去唤醒，只能等待超时或被中断","**notifyAll 唤醒所有线程**：所有线程退出 wait 状态开始竞争锁，但只有一个线程能抢到；这个线程执行完后，其他线程又会有一个幸运儿脱颖而出得到锁"]},
{q:"notify选择哪个线程", a:["notify 在源码注释中说到**选择唤醒的线程是任意的，但是依赖于具体实现的 JVM**","JVM 有很多实现，比较流行的是 **HotSpot**，hotspot 对 notify() 的实现并不是我们以为的随机唤醒，而是 **“先进先出”的顺序唤醒**"]},
{q:"不同的线程之间如何通信", a:["**共享变量**（最基本的线程间通信方式）：多个线程访问和修改同一个共享变量实现信息传递，为了保证线程安全通常需要使用 synchronized 或 **volatile** 关键字（如 volatile boolean flag 保证可见性，生产者改 flag 消费者立即可见）","**Object 类的 wait()/notify()/notifyAll()**：基于对象监视器（锁）机制——wait() 使当前线程进入等待状态释放锁，notify() 唤醒在此对象监视器上等待的单个线程，notifyAll() 唤醒所有","**Lock 和 Condition 接口**：java.util.concurrent.locks 包提供比 synchronized 更灵活的通信方式——**condition.await() 类似 wait()，signal() 类似 notify()，signalAll() 类似 notifyAll()**（ReentrantLock + lock.newCondition()）","**volatile 关键字**：保证变量可见性，写操作立即刷新主内存、读操作从主内存读最新值","**CountDownLatch**：允许一个或多个线程等待其他线程完成操作（await 等待计数器为 0）；**CyclicBarrier**：一组线程互相等待到公共屏障点；**Semaphore**：acquire/release 控制同时访问资源的线程数量","**BlockingQueue**：线程安全的队列操作，队列满时插入阻塞、队列空时获取阻塞（如 LinkedBlockingQueue 的 put/take）"]},
{q:"线程间通信方式有哪些", a:["**Object 类的 wait()/notify()/notifyAll()**：Java 中最基础的通信方式，基于对象监视器（锁）机制","**Lock 和 Condition 接口**：Lock 提供更灵活的锁机制，Condition 配合实现等待/通知——await() 使当前线程进入等待、signal() 唤醒一个、signalAll() 唤醒所有","**volatile 关键字**：保证变量可见性，写操作立即刷新主内存、读操作从主内存读取最新值","**CountDownLatch**：同步辅助类，允许一个或多个线程等待其他线程完成操作（构造函数指定数量、countDown() 减计数、await() 等待计数为 0）","**CyclicBarrier**：让一组线程相互等待直到所有线程到达公共屏障点（可重复使用，计数器重置）","**Semaphore**：计数信号量，acquire() 获取许可（无可用则阻塞）、release() 释放许可，控制同时访问资源线程数量","**BlockingQueue**：线程安全队列，队列满插入阻塞、队列空获取阻塞"]},
]},
{name:"并发安全", qa:[
{q:"juc包下你常用的类", a:["**线程池相关**：ThreadPoolExecutor（最核心的线程池类，灵活配置核心线程数、最大线程数、任务队列等）；Executors（线程池工厂类，newFixedThreadPool 固定线程数、newCachedThreadPool 可缓存、newSingleThreadExecutor 单线程等）","**并发集合类**：ConcurrentHashMap（线程安全哈希映射表，分段锁等技术允许多线程同时访问不同段，高并发下比 Hashtable 性能更好）；CopyOnWriteArrayList（写时复制实现读写分离，读多写少场景）","**同步工具类**：CountDownLatch（计数器机制，countDown 减一、为 0 时等待线程继续，常用于多线程任务汇总）；CyclicBarrier（让一组线程互相等待到屏障点，可重复使用，区别于 CountDownLatch 侧重相互等待）；Semaphore（信号量，acquire 获取许可、release 释放，控制同时访问资源线程数量，如数据库连接池）","**原子类**：AtomicInteger（原子整数类，自增自减、比较并交换等原子操作，硬件级原子指令避免锁开销）；AtomicReference（原子引用类，对对象引用原子更新，常用于无锁数据结构）"]},
{q:"怎么保证多线程安全", a:["**synchronized 关键字**：同步代码块或方法，确保同一时刻只有一个线程访问，通过锁定对象的监视器（monitor）实现（如 synchronized 方法、synchronized (someObject) 代码块）","**volatile 关键字**：用于变量，确保所有线程看到的是最新值而不是本地寄存器中的副本（保证可见性，但不具原子性）","**Lock 接口和 ReentrantLock 类**：java.util.concurrent.locks 提供比 synchronized 更强大的锁定机制，更灵活的锁管理和更高性能","**原子类**：AtomicInteger、AtomicLong 等提供原子操作更新基本类型变量无需额外同步","**ThreadLocal**：为每个线程提供独立变量副本，消除竞争条件（threadLocalVar.set/get）","**并发集合**：ConcurrentHashMap、ConcurrentLinkedQueue 等内部已实现线程安全逻辑","**JUC 工具类**：Semaphore、CyclicBarrier 等控制线程间同步和协作"]},
{q:"Java中有哪些常用的锁，在什么场景下使用", a:["**内置锁（synchronized）**：用于方法或代码块，进入获取关联对象锁、离开释放。加锁时有无锁、偏向锁、轻量级锁、重量级锁几个级别：偏向锁用于无其他线程竞争时减少锁开销；轻量级锁使用线程栈上数据结构避免操作系统级锁；重量级锁涉及操作系统互斥锁","**ReentrantLock**：显式锁类，提供比 synchronized 更高级的功能——**可中断的锁等待、定时锁等待、公平锁选项**等，用 lock()/unlock() 获取释放；公平锁按请求顺序分配（可能增加等待时间），非公平锁不保证顺序（减少竞争提高性能，可能造成线程饥饿）","**读写锁（ReadWriteLock）**：允许多个读取者同时访问共享资源，但只允许一个写入者，通常用于读取远多于写入的场景提高并发性","**乐观锁和悲观锁**：悲观锁访问数据前就锁定资源（synchronized、ReentrantLock 都是悲观锁）；乐观锁不锁定资源，更新时检查数据是否被其他线程修改（常用版本号或时间戳实现）","**自旋锁**：线程在等待锁时持续循环检查锁是否可用而不是放弃 CPU 阻塞，通常可用 CAS 实现，锁等待时间很短时提高性能，但过度自旋浪费 CPU"]},
{q:"怎么在实践中用锁", a:["**synchronized 关键字**：可用于方法或代码块，Java 最早的锁实现使用简单——synchronized 方法（public synchronized void increment()）或 synchronized 代码块（synchronized (lock) { count++; } 可更精细控制同步范围减少锁持有时间）","**Lock 接口**：提供比 synchronized 更灵活的锁操作，包括**尝试锁、可中断锁、定时锁**等，ReentrantLock 是 Lock 接口实现（lock.lock() → try/finally → lock.unlock()）","**ReadWriteLock**：允许多个读操作同时进行，写操作独占（Cache 类示例：readData 用 readLock、writeData 用 writeLock）"]},
]},
{name:"Java并发工具", qa:[
{q:"Java并发工具你知道哪些", a:["Java 中常用的并发工具位于 **java.util.concurrent** 包中：","**CountDownLatch**：同步辅助类，允许一个或多个线程等待其他线程完成操作。使用计数器初始化，countDown() 使计数器减一，为 0 时等待线程被唤醒（倒计时器：倒计时结束等待的事件发生）","**CyclicBarrier**：允许一组线程互相等待直到到达公共屏障点，所有线程到达后继续执行，**屏障可重置循环使用**；与 CountDownLatch 不同，CyclicBarrier 侧重于线程间的相互等待","**Semaphore**：计数信号量，控制同时访问某个共享资源的线程数量，acquire() 获取许可（无可用则阻塞）、release() 释放许可，可限制数据库连接池、文件操作等并发访问量","**Future 和 Callable**：Callable 类似 Runnable 但 call() 可返回结果可抛异常；Future 表示异步计算结果，通过它获取结果或取消任务"]},
{q:"CountDownLatch是做什么的讲一讲", a:["CountDownLatch 是 Java 并发包（java.util.concurrent）中的**同步工具类，用于让一个或多个线程等待其他线程完成操作后再继续执行**","核心原理（通过一个计数器实现线程间协调）：**初始化计数器**（创建时指定初始计数值如 N）→ **等待线程阻塞**（调用 await() 的线程被阻塞直到计数器变为 0）→ **任务完成通知**（其他线程完成任务后调用 countDown() 使计数器减 1）→ **唤醒等待线程**（计数器减到 0 时所有等待的线程被唤醒）","场景：主线程启动多个子线程执行任务、等待全部完成后统计结果（latch.await() 等待所有子线程 countDown()）"]},
{q:"synchronized和reentrantlock及其应用场景", a:["**synchronized 工作原理**：Java 提供的原子性内置锁，也被称为**监视器锁**。编译后在同步代码块前后加 **monitorenter 和 monitorexit 字节码指令**，依赖操作系统底层互斥锁实现；作用主要是实现原子性操作和解决共享变量的内存可见性。monitorenter 尝试获取对象锁，未锁定或已获得则计数器+1，其他竞争线程进入等待队列；monitorexit 计数器-1，为 0 时释放锁，等待队列线程再竞争。它是排它锁，线程阻塞/唤醒时从用户态切换到内核态非常消耗性能；内存语义上：加锁清除工作内存共享变量再从主内存读取，释放锁将工作内存共享变量写回主内存。深入源码：synchronized 有两个队列 **waitSet 和 entryList**——多线程进入同步代码块先进入 entryList，一个线程获取 monitor 锁后赋值给当前线程且计数器+1；调用 wait 释放锁进入 waitSet 等待唤醒，notify/notifyAll 后再次进入 entryList 竞争锁；执行完毕释放锁计数器-1","**ReentrantLock 工作原理**：底层主要依赖 **AbstractQueuedSynchronizer（AQS）** 抽象类，通过内部类 Sync 实现具体锁操作，不同 Sync 子类实现公平/非公平逻辑。特性：**可中断性**（等待锁时被其他线程中断提前结束，底层用 LockSupport.park()/unpark()）；**设置超时时间**（tryAcquireNanos）；**公平锁和非公平锁**（默认非公平，公平锁按线程等待顺序获取，new ReentrantLock(true)）；**多个条件变量**（Condition 接口，更灵活等待唤醒，condition.await()/signal()）；**可重入性**（holdCount 计数，同线程多次获取锁不死锁，为 0 时其他线程才有机会）","**应用场景**：synchronized 适合简单同步需求（代码块/方法同步，使用简单锁自动释放）、代码块同步（精细控制同步范围减少锁持有时间）、内置锁使用（对象状态与锁保护代码紧密相关）；ReentrantLock 适合高级锁功能需求（公平锁、响应中断、定时锁尝试、多个条件变量）、高度竞争环境性能优化（细粒度控制减少阻塞）、复杂同步结构（多条件变量协调线程通信）"]},
{q:"除了用synchronized，还有什么方法可以实现线程同步", a:["**使用 ReentrantLock 类**：可重入的互斥锁，相比 synchronized 提供更灵活的锁定和解锁操作，支持公平锁和非公平锁，以及可以响应中断的锁获取操作","**使用 volatile 关键字**：虽然不是锁机制，但可以确保变量可见性——线程直接从主内存读取该变量的值，保证线程间变量可见性；但它**不具备原子性**","**使用 Atomic 类**：AtomicInteger、AtomicLong、AtomicReference 等原子类实现对单个变量的原子操作，实现细节上利用 **CAS（Compare-And-Swap）算法**，可实现无锁的线程安全"]},
{q:"synchronized锁静态方法和普通方法区别", a:["**锁的对象不同**：普通方法锁的是**当前对象实例（this）**——同一对象实例的 synchronized 普通方法同一时间只能被一个线程访问，不同对象实例间互不影响可被不同线程同时访问各自的同步普通方法；**静态方法锁的是当前的 Class 对象**——由于类的 Class 对象全局唯一，无论多少个对象实例，该静态同步方法同一时间只能被一个线程访问","**作用范围不同**：普通方法仅对同一对象实例的同步方法调用互斥，不同对象实例的同步普通方法可并行执行；静态方法对整个类的所有实例的该方法调用都互斥","**多实例场景影响不同**：普通方法多线程访问不同对象实例可同时执行；静态方法不管有多少对象实例，同一时间仅一个线程能执行"]},
{q:"synchronized和reentrantlock区别", a:["synchronized 和 ReentrantLock **都是 Java 提供的可重入锁**，区别：","**用法不同**：synchronized 可修饰普通方法、静态方法和代码块，ReentrantLock 只能用在代码块上","**获取锁和释放锁方式不同**：synchronized 自动加锁释放锁（进入代码块自动加锁、离开自动释放）；ReentrantLock 需要**手动 lock() 加锁、unlock() 释放锁**","**锁类型不同**：synchronized 属于**非公平锁**；ReentrantLock 既可以是公平锁也可以是非公平锁","**响应中断不同**：ReentrantLock 可以**响应中断**（解决死锁问题），synchronized 不能响应中断","**底层实现不同**：synchronized 是 JVM 层面通过监视器实现的，ReentrantLock 是基于 **AQS** 实现的"]},
{q:"怎么理解可重入锁", a:["可重入锁指**同一个线程在获取了锁之后，可以再次重复获取该锁而不会造成死锁或其他问题**——当一个线程持有锁时，如果再次尝试获取该锁，就会成功获取而不会被阻塞","ReentrantLock 实现可重入锁的机制**基于线程持有锁的计数器**：第一次获取锁时计数器加 1；同一个线程再次获取锁计数器再加 1；释放锁时计数器减 1；**只有当计数器减到 0 时锁才会完全释放**，其他线程才有机会获取锁","这种计数器设计使得同一个线程可以多次获取同一个锁而不会死锁，每次获取加 1、每次释放减 1，正确处理锁的获取和释放"]},
{q:"synchronized支持重入吗？如何实现的", a:["**支持重入**。synchronized 是基于原子性的内部锁机制，是可重入的：一个线程调用 synchronized 方法时在其方法体内部调用该对象的另一个 synchronized 方法（得到对象锁后再次请求该对象锁）是允许的","synchronized 底层利用计算机系统 **mutex Lock** 实现。每一个可重入锁都会关联一个**线程 ID 和一个锁状态 status**","**请求方法时检查锁状态**：① 锁状态是 0（未被占用）→ 使用 **CAS 操作**获取锁，将线程 ID 替换成自己的线程 ID；② 锁状态不是 0（有线程访问）→ 如果线程 ID 是自己的（可重入锁）将 status **自增 1** 然后获取锁执行方法；如果是非重入锁就进入阻塞队列等待","**释放锁时**：可重入锁每次退出方法 status 减 1，直至 status 为 0 最后释放锁；非可重入锁线程退出方法直接释放锁"]},
{q:"synchronized锁升级的过程", a:["锁升级的具体过程：**无锁 → 偏向锁 → 轻量级锁 → 重量级锁**","**无锁**：没有开启偏向锁时的状态。JDK 1.6 之后偏向锁默认开启，但有偏向延迟（JVM 启动后多少秒才开启，可通过 JVM 参数设置）","**偏向锁**：开启偏向锁后的状态。还没有线程拿到锁时叫**匿名偏向**；一个线程拿到偏向锁后，下次竞争锁只需拿线程 ID 与 MarkWord 中存储的线程 ID 比较，**相同则直接获取锁**（锁偏向于这个线程），不需要 CAS 和挂起线程的操作","**轻量级锁**：线程主要通过 **CAS 操作**实现——将对象的 MarkWord 存储到线程的虚拟机栈上，通过 CAS 把对象的 MarkWord 内容设置为指向 Displaced Mark Word 的指针，设置成功则获取锁；出临界区时也需 CAS，替换成功则同步成功，失败表示有其他线程在获取锁，释放锁后唤醒被挂起线程","**重量级锁**：**两个以上线程获取锁时轻量级锁升级为重量级锁**——CAS 不成功会一直自旋（while 循环）非常消耗 CPU；升级为重量级锁后线程被操作系统调度挂起，节约 CPU 资源","整体流程：线程 A 进入 synchronized 抢锁，JVM 判断当前是否偏向锁状态，是则根据 Mark Word 中线程 ID 判断是否持有偏向锁的线程（是则直接执行临界区代码）；Mark Word 里的线程不是 A，通过自旋尝试获取锁（成功则把线程 ID 改为自己的），竞争失败则**撤销偏向锁膨胀为轻量级锁**；后续竞争线程都通过自旋尝试，自旋成功仍是轻量级锁，竞争失败锁膨胀为重量级锁、后续等待线程都被阻塞"]},
{q:"JVM对Synchronized的优化", a:["synchronized 核心优化方案主要包含 4 个：","**锁膨胀（锁升级）**：synchronized 从无锁升级到偏向锁、轻量级锁、重量级锁的过程。JDK 1.6 之前 synchronized 是重量级锁，释放和获取锁都从用户态转换到内核态效率较低；有了锁膨胀机制后状态多了无锁、偏向锁、轻量级锁，大部分并发场景不需要用户态到内核态转换，大幅提升性能","**锁消除**：JVM 检测不到某段代码被共享和竞争的可能性时，就把这段代码所属的同步锁消除掉，提高程序性能","**锁粗化**：将多个连续的加锁、解锁操作连接在一起，扩展成一个范围更大的锁","**自适应自旋锁**：通过自身循环尝试获取锁，优点在于避免线程的挂起和恢复操作（挂起恢复都需从用户态转入内核态较慢），通过自旋可一定程度上避免线程挂起和恢复造成的性能开销"]},
{q:"介绍一下AQS", a:["AQS 全称 **AbstractQueuedSynchronizer**，是 Java 中的一个抽象类，**用于构建锁、同步器、协作工具类的框架**","**核心思想**：如果被请求的共享资源空闲，将当前请求资源的线程设置为有效的工作线程、把共享资源设为锁定状态；如果共享资源被占用，就需要一定的阻塞等待唤醒机制保证锁分配，主要用 **CLH 队列的变体**实现——将暂时获取不到锁的线程加入队列。CLH：Craig、Landin and Hagersten 队列，是单向链表，AQS 中的队列是 CLH 变体的**虚拟双向队列（FIFO）**，通过把每条请求共享资源的线程封装成一个节点实现锁分配","AQS 最核心的三大部分：","**状态 state**：volatile int 成员变量表示同步状态，含义随实现类不同——Semaphore 里表示剩余许可证数量；CountDownLatch 里表示还需要倒数的数量；ReentrantLock 中表示锁的占有情况（含可重入计数），state 为 0 表示锁不被任何线程占有。state 被并发修改，getState/setState/compareAndSet 都依赖 unsafe，通过 CAS 修改保证线程安全","**FIFO 队列（双向链表）**：存放等待的线程，AQS 就是“排队管理器”——多个线程争用同一把锁时，把没能拿到锁的线程串在一起；锁释放时挑选合适线程占有锁","**获取/释放等重要方法（重写）**：由协作工具类自己实现且含义各不相同——获取操作依赖 state 变量，经常阻塞（Semaphore 的 acquire 获取许可证、CountDownLatch 的 await 等待倒数结束）；释放操作（Semaphore 的 release、CountDownLatch 的 countDown）；每个实现类重写 tryAcquire 和 tryRelease 等方法。AQS 广泛用于 CountDownLatch、Semaphore、ReentrantLock、ReentrantReadWriteLock 等（其中 Sync 是这些类都有的内部类，是 AQS 的实现）"]},
{q:"CAS和AQS有什么关系", a:["**两者的区别**：CAS 是一种**乐观锁机制**，包含三个操作数——内存位置（V）、预期值（A）和新值（B），逻辑是如果内存位置 V 的值等于预期值 A 则更新为新值 B，否则不做任何操作，整个过程原子性，通常由硬件指令支持（如现代处理器 cmpxchg 指令）；AQS 是**用于构建锁和同步器的框架**，用 volatile 的整数变量 state 表示同步状态、内置 FIFO 队列管理等待线程，提供 acquire（获取资源）和 release（释放资源）等基本操作——acquire 先尝试获取资源，失败则线程加入等待队列阻塞；release 释放资源并唤醒等待队列中的线程","**两者的联系**：**CAS 为 AQS 提供原子操作支持**——AQS 内部使用 CAS 操作更新 state 变量实现线程安全的状态修改：acquire 时用 CAS 尝试把 state 从一个值更新为另一个值，更新失败说明资源被占用，线程进入等待队列；release 时也用 CAS 把 state 恢复到相应值保证状态更新原子性"]},
{q:"如何用AQS实现一个可重入的公平锁", a:["**1. 继承 AbstractQueuedSynchronizer**：创建一个内部类（如 Sync）继承 AQS，重写 **tryAcquire、tryRelease、isHeldExclusively** 等方法，用于实现锁的获取、释放和判断锁是否被当前线程持有","**2. 实现可重入逻辑**：在 tryAcquire 中先获取当前锁状态 c——如果 c 为 0 表示锁未被持有；如果 c 不为 0 且 current == getExclusiveOwnerThread()（当前线程已持有锁），则增加锁的持有次数（state += acquires，可重入，注意防止溢出）","**3. 实现公平性**：c 为 0 时先做公平性检查——`!hasQueuedPredecessors()` 判断等待队列中是否有前驱节点在排队，有则当前线程必须进入队列等待、不能直接竞争锁；没有前驱则用 compareAndSetState(0, acquires) 尝试获取锁并 setExclusiveOwnerThread(current)","**4. 创建锁的外部类**：创建外部类（如 FairReentrantLock）内部持有 Sync 对象，提供 lock()（sync.acquire(1)）、unlock()（sync.release(1)）、isLocked()（sync.isHeldExclusively()）、newCondition()（sync.newCondition() 返回 ConditionObject）等方法"]},
]},
{name:"ThreadLocal", qa:[
{q:"Threadlocal作用，原理，具体里面存的key value是啥，会有什么问题，如何解决", a:["**作用**：ThreadLocal 是 Java 中解决线程安全问题的一种机制，允许创建**线程局部变量**——每个线程都有自己的独立变量副本，避免了线程间的资源共享和同步问题","**原理**：ThreadLocal 的实现依赖 **Thread 类中的一个 ThreadLocalMap 字段**，每个线程都有自己的 ThreadLocalMap 实例存储该线程所持有的所有 ThreadLocal 变量值。get() 检查当前线程 ThreadLocalMap 是否有关联值（有则返回，没有则调 initialValue() 初始化后放入返回）；set() 在当前线程 ThreadLocalMap 中存键值对；remove() 移除与该 ThreadLocal 对象关联的条目","**存的 key value 是什么**：**key 是 ThreadLocal 对象自身，value 是传入的值**（每个 ThreadLocal 对象可存任意类型值，对每个线程独立）","**可能存在的问题**：线程结束时其 ThreadLocalMap 随之销毁，但 **ThreadLocal 对象本身不会立即被垃圾回收**；如果不显式调用 remove()，或线程结束时未正确清理 ThreadLocal 变量，**ThreadLocalMap 会持续持有 ThreadLocal 变量的引用，导致内存泄漏**","**解决方法**：实际应用中**使用完 ThreadLocal 变量后调用 remove() 方法释放资源**"]},
]},
{name:"锁与CAS", qa:[
{q:"悲观锁和乐观锁的区别", a:["**乐观锁**：对并发操作产生的线程安全问题持乐观状态，认为竞争不总是会发生——因此不需要持有锁，将**比较-替换**这两个动作作为一个原子操作尝试修改内存中的变量；如果失败表示发生冲突，就有相应的重试逻辑","**悲观锁**：对并发问题持悲观状态，认为竞争总是会发生——因此每次对某资源进行操作时都会持有一个独占的锁，就像 synchronized，不管三七二十一直接上了锁就操作资源"]},
{q:"Java中想实现一个乐观锁，都有哪些方式", a:["**1. CAS（Compare and Swap）操作**：CAS 是乐观锁的基础，Java 提供 java.util.concurrent.atomic 包，包含各种原子变量类（AtomicInteger、AtomicLong 等），用 CAS 实现线程安全的原子操作，可用来实现乐观锁","**2. 版本号控制**：增加一个版本号字段记录数据更新时候的版本，每次更新时递增版本号；更新数据时同时比较版本号，若当前版本号和更新前获取的版本号一致则更新成功，否则失败","**3. 时间戳**：使用时间戳记录数据的更新时间，更新数据时比较时间戳；如果当前时间戳大于数据的时间戳，说明数据已经被其他线程更新，更新失败"]},
{q:"CAS有什么缺点", a:["CAS 的缺点主要有 3 点：","**ABA 问题**：CAS 更新过程中，当读取到的值是 A、准备赋值时仍然是 A，但实际 A 可能被改成了 B 又被改回了 A，这个漏洞就是 ABA——只是大部分场景下 ABA 不影响并发的最终效果。Java 有 **AtomicStampedReference** 解决：加入预期标志和更新后标志两个字段，更新时不光检查值、还要检查当前标志是否等于预期标志，全部相等才更新","**循环时间长开销大**：自旋 CAS 方式如果长时间不成功，会给 CPU 带来很大开销","**只能保证一个共享变量的原子操作**：只对一个共享变量操作可以保证原子性，多个则不行——多个可以通过 **AtomicReference** 处理或使用锁 synchronized 实现"]},
{q:"为什么不能所有的锁都用CAS", a:["**CAS 操作基于循环重试的机制**：如果 CAS 一直未能成功，线程会一直自旋重试，占用 CPU 资源","**在高并发情况下，大量线程自旋会导致 CPU 资源浪费**（所以需要 synchronized 等在竞争激烈时让线程阻塞挂起）"]},
{q:"CAS有什么问题，Java是怎么解决的", a:["**会有 ABA 问题**：变量值在操作过程中先被其他线程从 A 修改为 B、又被改回 A，CAS 无法感知中途变化，导致操作误判为“未变更”。例如：线程 1 读取变量为 A 准备改为 C；此时线程 2 将变量 A → B → A；线程 1 的 CAS 执行时发现仍是 A，但状态已丢失中间变化","**Java 的解决方式**：提供的工具类会在 CAS 操作中**增加版本号（Stamp）或标记**，每次修改都更新版本号，即使值相同也能识别变更历史——用 **AtomicStampedReference** 解决 ABA 问题，通过比对值和版本号识别（如 ref.compareAndSet(100, 200, 0, 1)，前提是当前值=100 且版本号=0 才更新为 (200,1)）"]},
{q:"volatile关键字有什么作用", a:["**保证变量对所有线程的可见性**：当一个变量被声明为 volatile 时，对这个变量的写操作会立即刷新到主存中，读操作直接从主存读取，确保多线程环境下访问的可见性——一个线程修改了 volatile 变量，其他线程能立刻看到，不受各线程工作内存影响","**禁止指令重排序优化**：volatile 主要通过内存屏障禁止特定类型的指令重排序——① **写-写（Write-Write）屏障**：对 volatile 变量执行写操作前插入写屏障，确保写操作之前的所有普通写操作都已完成，防止这些写操作被移到 volatile 写之后；② **读-写（Read-Write）屏障**：对 volatile 变量执行读操作后插入读屏障，确保读操作之后的所有普通读操作不会提前到 volatile 读之前执行；③ **写-读（Write-Read）屏障**（最重要）：发生在 volatile 写之后和 volatile 读之前，确保 volatile 写之前的所有内存操作不会重排序到 volatile 读之后，volatile 读之后的所有内存操作不会重排序到 volatile 写之前"]},
{q:"指令重排序的原理", a:["在执行程序时，为了提高性能，处理器和编译器常常会对指令进行重排序，但是重排序要满足 **2 个条件**才能进行：","**① 在单线程环境下不能改变程序运行的结果**；**② 存在数据依赖关系的不允许重排序**","所以重排序不会对单线程有影响，**只会破坏多线程的执行语义**。例如：A（width=15.67）和 C（area=width*height）之间存在数据依赖，B（height=14.32）和 C 之间也存在数据依赖，因此最终指令序列中 C 不能被重排序到 A 和 B 前面（否则结果改变）；但 A 和 B 之间没有数据依赖，编译器和处理器可以重排序 A 和 B 的执行顺序"]},
{q:"volatile可以保证线程安全吗", a:["volatile **可以保证可见性，但不能保证原子性，因此不能完全保证线程安全**","volatile 修饰的变量，一个线程修改后其他线程能立即查看到最新值，避免数据不一致；但 **volatile 不能解决多线程并发下的复合操作问题**——比如 i++ 这种操作不是原子操作，如果多个线程同时自增，volatile 不能保证线程安全","**对于复合操作**，需要使用 synchronized 关键字或 Lock 来保证原子性和线程安全"]},
{q:"volatile和synchronized比较", a:["**Synchronized** 解决多线程访问共享资源时可能出现的竞态条件和数据不一致问题，保证线程安全性——是一种**排他性的同步机制**，保证同一时刻只允许一个线程访问共享资源（对代码块或方法添加 synchronized 实现）","**Volatile** 解决变量在多线程环境下的**可见性和有序性**问题，确保变量修改对其他线程可见——是一种**轻量级的同步机制**，保证可见性和禁止指令重排序：线程读取 volatile 变量时直接从内存读取不使用缓存，写操作立即刷回主内存而不是缓存在本地内存中"]},
{q:"什么是公平锁和非公平锁", a:["**公平锁**：多个线程**按照申请锁的顺序来获取锁**，线程直接进入队列中排队，队列中第一个线程才能获得锁。优点：各个线程公平平等，每个线程等待一段时间后都有执行机会；缺点：整体执行速度更慢、吞吐量更小","**非公平锁**：多个线程加锁时**直接尝试获取锁**，能抢到锁就直接占有，抢不到才到等待队列队尾等待。优点：整体执行速度更快、吞吐量更大；缺点：可能产生**线程饥饿**问题（一直有线程插队的话等待队列中的线程可能长时间得不到运行）"]},
{q:"非公平锁吞吐量为什么比公平锁大", a:["**公平锁执行流程**：获取锁时先将线程自己添加到等待队列的队尾并休眠，某线程用完锁后唤醒等待队列中队首的线程尝试获取锁，锁的使用顺序就是队列中的先后顺序；过程中线程从运行状态切换到休眠状态、再从休眠恢复运行，**每次休眠和恢复都需要从用户态转换成内核态，这个转换比较慢**，所以公平锁执行速度慢","**非公平锁执行流程**：获取锁时先通过 **CAS 尝试获取锁**，成功就直接拥有锁，失败才进入等待队列等待下次尝试——获取锁不用遵循先到先得的规则，**避免了线程休眠和恢复的操作**，加速程序执行效率，所以吞吐量更大"]},
{q:"Synchronized是公平锁吗", a:["**Synchronized 不属于公平锁**（它是非公平锁）；**ReentrantLock 是公平锁**（也可以配置为非公平）"]},
{q:"ReentrantLock是怎么实现公平锁的", a:["对比公平锁与非公平锁的 lock() 方法源码，**唯一区别在于公平锁在获取锁时多了一个限制条件：hasQueuedPredecessors() 为 false**","公平锁 tryAcquire 中：`if (!hasQueuedPredecessors() && compareAndSetState(0, acquires))`——**先判断等待队列中是否已经有线程在排队**，一旦有线程在排队，当前线程就不再尝试获取锁，必须进入队列等待；非公平锁则无论是否已有线程排队都会尝试获取一下锁，获取不到再去排队","**特例：tryLock() 方法不遵守设定的公平原则**——一旦有线程释放锁，正在 tryLock 的线程就能获取到锁，即使设置的是公平锁模式、即使它之前已有其他线程在等待队列中等待，简单说 **tryLock 可以插队**。看源码 `public boolean tryLock() { return sync.nonfairTryAcquire(1); }` 调用的是 nonfairTryAcquire，表明是不公平的，和锁本身是否是公平锁无关"]},
]},
{name:"死锁", qa:[
{q:"什么情况会产生死锁问题？如何解决", a:["死锁只有同时满足以下**四个条件**才会发生：","**① 互斥条件**：多个线程不能同时使用同一个资源","**② 持有并等待条件**：线程 A 已经持有资源 1，又想申请资源 2，而资源 2 已经被线程 C 持有，所以线程 A 处于等待状态，但线程 A 在等待资源 2 的同时**并不会释放自己已持有的资源 1**","**③ 不可剥夺条件**：线程已持有的资源在自己使用完之前不能被其他线程获取，线程 B 想使用此资源只能等线程 A 使用完并释放后才能获取","**④ 环路等待条件**：死锁发生时两个线程获取资源的顺序构成了环形链——例如线程 A 持有资源 R1 并试图获取资源 R2，而线程 B 持有资源 R2 并试图获取资源 R1，两个线程相互等待对方释放资源导致死锁","**解决方法**：避免死锁**只需要破坏其中一个条件即可**，最常见且可行的是使用**资源有序分配法破坏环路等待条件**——线程 A 和线程 B 获取资源的顺序要一样（都是先尝试获取资源 1，然后尝试获取资源 2），总是以相同顺序申请自己想要的资源"]},
]},
{name:"线程池", qa:[
{q:"介绍一下线程池的工作原理", a:["线程池是为了**减少频繁创建线程和销毁线程带来的性能损耗**","线程池分为**核心线程池、线程池最大容量、等待任务的队列**。提交一个任务：如果核心线程没有满，就创建一个线程执行；核心线程满了，任务加入等待队列；等待队列满了，增加线程；达到最大线程数量后，就按照一些**丢弃策略**进行处理","任务执行流程：**提交任务 → 核心线程数是否已满？** 未满 → 创建核心线程执行；已满 → 任务入队（队列未满 → 等待执行；队列已满 → 创建非核心线程：未达最大线程数 → 执行任务；已达最大线程数 → 执行拒绝策略）"]},
{q:"线程池的参数有哪些", a:["线程池的构造函数有 **7 个参数**：","**corePoolSize**：核心线程数量。默认情况下线程池中线程数量 ≤ corePoolSize 时，即使空闲也不会被销毁","**maximumPoolSize**：限制线程池能创建的最大线程总数（含核心和非核心）。corePoolSize 已满且新任务加入阻塞队列失败（队列满）且当前线程数 < maximumPoolSize 时创建新线程执行；当 corePoolSize 满、队列满、线程数已达 maximumPoolSize 又有新任务提交时触发拒绝策略","**keepAliveTime**：线程池中线程数大于 corePoolSize 时，某线程空闲时间超过 keepAliveTime 则被销毁","**unit**：keepAliveTime 时间的单位","**workQueue**：工作队列，没有空闲线程执行新任务时任务放入工作队列等待执行","**threadFactory**：线程工厂，可以用来给线程取名字等","**handler**：拒绝策略——有空间线程直接执行；无空闲线程则任务加入阻塞队列；阻塞队列满则创建新线程从队列头部取一个任务执行、新任务加入队尾；线程数等于 maximumPoolSize 时不再创建新线程，执行拒绝策略"]},
{q:"线程池工作队列满了有哪些拒绝策略", a:["线程池任务队列满了之后会执行指定的拒绝策略，常用的四种拒绝策略：","**CallerRunsPolicy**：使用线程池的**调用者所在的线程**去执行被拒绝的任务（除非线程池被停止或任务队列已有空缺）","**AbortPolicy**：直接抛出一个**任务被线程池拒绝的异常**","**DiscardPolicy**：不做任何处理，**静默拒绝**提交的任务","**DiscardOldestPolicy**：**抛弃最老的任务**，然后执行该新任务","此外还可以通过实现 **RejectedExecutionHandler** 接口自定义拒绝策略"]},
{q:"有线程池参数设置的经验吗", a:["**核心线程数（corePoolSize）设置经验**：CPU 密集型 = **CPU 核数 + 1**（避免过多线程竞争 CPU）；IO 密集型 = **CPU 核数 × 2**（或更高，具体看 IO 等待时间）","**场景一：电商**，特点瞬时高并发、任务处理时间短——new ThreadPoolExecutor(16, 32, 10s, SynchronousQueue, AbortPolicy)：corePoolSize=16（8 核 CPU×2）、maximumPoolSize=32（突发流量扩容）、非核心线程空闲 10 秒回收；**SynchronousQueue 不缓存任务直接扩容线程**，拒绝策略快速失败（前端返回“活动火爆”提示结合降级策略如缓存预热）","**场景二：后台数据处理**，特点稳定流量、任务处理时间长（秒级）、允许一定延迟——new ThreadPoolExecutor(8, 8, 0s, ArrayBlockingQueue(1000), CallerRunsPolicy)：固定线程数避免资源波动、有界队列缓冲任务、队列满后由调用线程执行，配合监控告警（队列使用率 > 80% 触发扩容）","**场景三：微服务 HTTP 请求**，特点 IO 密集型、依赖下游服务响应时间——new ThreadPoolExecutor(16, 64, 60s, LinkedBlockingQueue(200), CustomRetryPolicy)：corePoolSize=16（8 核×2）、maximumPoolSize=64（应对慢下游）、非核心线程空闲 60 秒回收、有界队列容量 200、自定义拒绝策略（重试或降级）；根据下游 RT 调整线程数，队列防止瞬时峰值，拒绝的任务暂存 Redis 异步重试"]},
{q:"核心线程数设置为0可不可以", a:["**可以**。当核心线程数为 0 的时候，会创建一个非核心线程进行执行","从源码可以看到：当核心线程数为 0 时，来了一个任务之后，**会先将任务添加到任务队列**，同时判断当前工作线程数是否为 0，如果为 0 则会创建非核心线程来执行任务（`else if (workerCountOf(recheck) == 0) addWorker(firstTask: null, core: false)`）"]},
{q:"线程池种类有哪些", a:["**ScheduledThreadPool**：可以设置定期的执行任务，支持定时或周期性执行任务（如每隔 10 秒执行一次任务）","**FixedThreadPool**：核心线程数和最大线程数一样，是固定线程数的线程池——线程数除初始阶段从 0 增加外之后固定，任务数超过线程数时把超出部分放到任务队列等待，任务队列满了也无法再增加新线程（最大数=核心数）","**CachedThreadPool**：可缓存线程池，线程数几乎可以无限增加（实际最大可达 Integer.MAX_VALUE=2³¹-1），线程闲置时还能回收；存储任务的队列是 **SynchronousQueue**（容量为 0，不实际存储任务，只负责中转和传递），效率比较高","**SingleThreadExecutor**：使用唯一的线程执行任务，原理和 FixedThreadPool 一样只是线程只有一个；线程执行任务发生异常时会重新创建一个线程执行后续任务；只有一个线程所以**非常适合所有任务需要按提交顺序依次执行的场景**（多线程并行执行不保证顺序）","**SingleThreadScheduledExecutor**：和 ScheduledThreadPool 非常相似，是它内部只有一个线程的特例"]},
{q:"线程池一般是怎么用的", a:["《阿里巴巴Java开发手册》提到：**禁止使用 Executors 快捷方法创建线程池**，应该手动 new ThreadPoolExecutor 创建——背后是大量生产事故，最典型的是 **newFixedThreadPool 和 newCachedThreadPool 可能因资源耗尽导致 OOM 问题**","**原因**：需要根据自己的场景、并发情况评估线程池的几个核心参数（核心线程数、最大线程数、线程回收策略、工作队列类型、拒绝策略），确保线程池工作行为符合需求，一般都需要**设置有界的工作队列和可控的线程数**","**任何时候都应该为自定义线程池指定有意义的名称**方便排查问题（线程数量暴增、线程死锁、线程占用大量 CPU、执行异常时抓取线程栈定位问题）","**建议用监控手段观察线程池状态**：线程池往往任劳任怨，除非出现拒绝策略否则压力再大也不会抛异常，提前观察到队列积压或线程数量快速膨胀可提早发现问题"]},
{q:"线程池中shutdown()、shutdownNow()这两个方法有什么作用", a:["**shutdown()**：使用后置状态为 **SHUTDOWN**，正在执行的任务会继续执行下去，没有被执行的则中断；此时**不能再往线程池中添加任何任务**，否则抛出 RejectedExecutionException 异常（源码：advanceRunState(SHUTDOWN)、interruptIdleWorkers()）","**shutdownNow()**：置状态为 **STOP**，试图停止所有正在执行的线程，不再处理还在池队列中等待的任务，并且**返回那些未执行的任务列表**（源码：advanceRunState(STOP)、interruptWorkers()、tasks = drainQueue() 返回 tasks）","它试图终止线程的方法是通过调用 **Thread.interrupt()** 实现的，但这种方法作用有限：**如果线程中没有 sleep、wait、Condition、定时锁等应用，interrupt() 方法无法中断当前线程**——所以 shutdownNow() 并不代表线程池一定能立即退出，可能必须等待所有正在执行的任务都执行完成才能退出"]},
{q:"提交给线程池中的任务可以被撤回吗", a:["**可以**。当向线程池提交任务时，会得到一个 **Future 对象**，它提供了管理任务执行的方法，包括取消任务","取消任务的主要方法是 Future 接口中的 **cancel(boolean mayInterruptIfRunning)** 方法：参数 mayInterruptIfRunning 指示是否允许中断正在执行的任务——设置为 true，如果任务已经开始执行则允许中断任务；设置为 false，任务已经开始执行则不会被中断","Future 接口还提供 isCancelled()（线程是否被取消）、isDone()（线程是否执行完毕）、get()（立即获得线程返回结果）、get(long timeout, TimeUnit unit)（延时时间后获得结果）等方法"]},
]},
{name:"场景", qa:[
{q:"多线程打印奇偶数，怎么控制打印的顺序", a:["可以利用 **wait() 和 notify()** 来控制线程的执行顺序","通过一个共享的锁对象 lock 控制两个线程交替执行：一个线程负责打印奇数、另一个负责打印偶数。**当当前应该打印奇数时，偶数线程会进入等待状态，反之亦然**","实现要点：定义 private static final Object lock 和共享计数器 count；奇数线程 synchronized(lock) 中 `if (count % 2 != 0) { 打印 count++; lock.notify(); } else { lock.wait(); }`；偶数线程逻辑相反；各自 while (count <= MAX_COUNT) 循环，创建 oddThread/evenThread 启动"]},
{q:"3个线程并发执行，1个线程等待这三个线程全部执行完再执行，怎么实现", a:["可以使用 **CountDownLatch** 实现：","**① 创建一个 CountDownLatch 对象，计数器初始化为 3**（因为有 3 个线程需要等待）","**② 创建 3 个并发执行的线程**，在每个线程的任务结束时调用 **countDown 方法将计数器减 1**（在 finally 中调用确保一定执行）","**③ 创建第 4 个线程，使用 await 方法等待计数器为 0**——它会阻塞，直到前面 3 个线程都调用了 countDown()；一旦计数为 0，该线程继续执行后续任务"]},
{q:"假设两个线程并发读写同一个整型变量，初始值为零，每个线程加50次，结果可能是什么", a:["在没有任何同步机制的情况下，两个线程并发对同一个整型变量进行 50 次加 1 操作，**最终结果可能是 100，也可能小于 100，最坏结果是 50，即最终结果可能在 [50, 100]**","**小于 100 的原因**：num++ 操作不是原子操作，实际上包含三个步骤——**读取变量的值、将值加 1、将新值写回变量**。多线程环境下可能出现线程安全问题：例如线程 1 和线程 2 同时读取变量的当前值，然后各自加 1，最后都将相同的新值写回变量，这导致**一次加 1 操作的丢失**；这种情况多次发生，最终结果就小于 100","**解决方案**：① 使用 **AtomicInteger**（num.incrementAndGet() 原子自增，线程安全）；② 使用 **synchronized 关键字或 ReentrantLock** 确保操作的互斥性（synchronized (lock) { num++; }）"]},
{q:"单例模型既然已经用了synchronized，为什么还要加volatile", a:["使用 synchronized 和 volatile 一起，可以创建一个**既线程安全又能正确初始化**的单例模式","**synchronized 的作用**：确保在多线程环境下只有一个线程能进入同步块（synchronized (Singleton.class)），保证创建过程的线程安全，避免多个线程同时创建多个单例对象","**volatile 的作用**：确保对象引用的可见性和创建过程的有序性，**避免由于指令重排序而导致的错误**","**为什么要 volatile**：`instance = new Singleton()` 这行代码**并不是一个原子操作**，可以分解为三步——① 分配内存空间；② 实例化对象；③ 将对象引用赋值给 instance。由于 Java 内存模型允许编译器和处理器对指令重排序，**没有 volatile 时可能出现先赋值引用、但对象尚未完成实例化的重排序**——其他线程检查 instance == null 时认为单例已创建，从而得到一个**未完全初始化的对象**","volatile 保证可见性和禁止指令重排序，确保三步按顺序执行，避免单例创建过程中因指令重排序导致的问题"]},
]},
]});
SECTIONS.push({id:"jvm", title:"Java虚拟机面试篇", chapters:[
{name:"内存模型", qa:[
{q:"JVM的内存模型介绍一下", a:["根据 JDK 8 规范，JVM 运行时内存共分为**虚拟机栈、堆、元空间、程序计数器、本地方法栈**五个部分；还有一部分叫**直接内存**，属于操作系统的本地内存，也可以直接操作","**程序计数器**：可以看作是当前线程所执行的字节码的行号指示器，用于存储当前线程正在执行的 Java 方法的 JVM 指令地址。如果线程执行的是 Native 方法，计数器值为 null。是唯一一个在 Java 虚拟机规范中没有规定任何 OutOfMemoryError 情况的区域，生命周期与线程相同","**Java 虚拟机栈**：每个线程都有自己独立的 Java 虚拟机栈，生命周期与线程相同。每个方法在执行时都会创建一个**栈帧**，用于存储局部变量表、操作数栈、动态链接、方法出口等信息，可能抛出 StackOverflowError 和 OutOfMemoryError","**本地方法栈**：与 Java 虚拟机栈类似，主要为虚拟机使用到的 Native 方法服务，在 HotSpot 虚拟机中和 Java 虚拟机栈合二为一，同样可能出现 StackOverflowError 和 OutOfMemoryError 两种错误","**Java 堆**：JVM 中最大的一块内存区域，被所有线程共享，在虚拟机启动时创建，用于存放对象实例。从内存回收角度堆被划分为**新生代和老年代**，新生代又分为 Eden 区和两个 Survivor 区（From/To）。如果在堆中没有内存完成实例分配且堆无法扩展，抛 OutOfMemoryError","**方法区（元空间）**：JDK 1.8 及以后被元空间取代，使用本地内存，用于存储已被虚拟机加载的类信息、常量、静态变量等数据。虽然方法区被描述为堆的逻辑部分，但有“非堆”的别名，可以选择不实现垃圾收集，内存不足抛 OutOfMemoryError","**运行时常量池**：是方法区的一部分，存放编译期生成的各种字面量和符号引用，具有动态性，运行时也可将新的常量放入池中，无法申请足够内存时抛 OutOfMemoryError","**直接内存**：不属于 JVM 运行时数据区，通过 NIO 类引入，是一种堆外内存，可以显著提高 I/O 性能，使用受本机总内存限制，分配不当可能导致 OutOfMemoryError"]},
{q:"JVM内存模型里的堆和栈有什么区别", a:["**用途**：栈主要用于存储局部变量、方法调用的参数、方法返回地址及一些临时数据——每当一个方法被调用，一个栈帧就会在栈中创建用于存储该方法的信息，方法执行完毕栈帧也被移除；堆用于存储对象的实例（包括类的实例和数组），使用 new 关键字创建对象时对象实例在堆上分配空间","**生命周期**：栈中数据有确定的生命周期，方法调用结束对应的栈帧被销毁，栈中存储的局部变量随之消失；堆中对象生命周期不确定，对象会在 GC 检测到对象不再被引用时才被回收","**存取速度**：栈的存取速度通常比堆快，因为栈遵循**先进后出（LIFO）**原则，操作简单快速；堆存取相对较慢，对象在堆上的分配和回收需要更多时间，垃圾回收机制的运行也会影响性能","**存储空间**：栈空间相对较小且固定，由操作系统管理，栈溢出通常是递归过深或局部变量过大；堆空间较大且动态扩展，由 JVM 管理，堆溢出通常由于创建太多大对象或未能及时回收不再使用的对象","**可见性**：栈中数据对线程是私有的，每个线程有自己的栈空间；堆中数据对线程是共享的，所有线程都可以访问堆上的对象"]},
{q:"栈中存的到底是指针还是对象", a:["**栈中存储的是基本类型的数据（如 int、double 等）和对象的引用，而不是对象本身**","关键点：栈中存储的不是对象，而是对象的引用。当在方法中声明 MyObject obj = new MyObject() 时，obj 实际上是一个存储在栈上的**引用**，指向堆中实际的对象实例；这个引用是一个固定大小的数据（如 64 位系统上是 8 字节），指向堆中分配给对象的内存区域"]},
{q:"堆分为哪几部分", a:["**新生代（Young Generation）**：分为 Eden Space 和 Survivor Space。Eden 区中大多数新创建的对象首先存放在这里，Eden 区相对较小，Eden 区满时触发一次 Minor GC；Survivor 区通常分为两个相等大小的区域 S0 和 S1，Minor GC 后存活下来的对象会被移动到其中一个 Survivor 空间，这两个区域轮流充当对象的中转站，帮助区分短暂存活和长期存活的对象","**老年代（Old Generation）**：存放过一次或多次 Minor GC 仍存活的对象会被移动到老年代，对象生命周期较长，因此 Major GC（涉及老年代的垃圾回收）发生频率相对较低，但执行时间通常比 Minor GC 长；老年代空间通常比新生代大，以存储更多长期存活对象","**元空间（Metaspace）**：从 Java 8 开始永久代被元空间取代，用于存储类的元数据信息（如类的结构信息、字段、方法信息等），并不在 Java 堆中而是使用本地内存，解决了永久代容易出现的内存溢出问题","**大对象区（Humongous Objects）**：在某些 JVM 实现（如 G1 垃圾收集器）中为大对象分配专门区域，大对象指需要大量连续内存空间的对象（如大数组），这类对象直接分配在老年代，避免因频繁年代晋升导致的内存碎片化问题"]},
{q:"如果有个大对象一般是在哪个区域", a:["**大对象通常会直接分配到老年代**","**原因一**：新生代主要用于存放生命周期较短的对象，且内存空间相对较小。如果将大对象分配到新生代，可能很快导致新生代空间不足从而频繁触发 Minor GC，而每次 Minor GC 都需要进行对象的复制和移动操作，带来一定性能开销；将大对象直接分配到老年代，可以减少新生代内存压力，降低 Minor GC 频率","**原因二**：大对象通常需要连续的内存空间，如果在新生代中频繁分配和回收大对象，容易产生内存碎片，导致后续分配大对象时因内存不连续而失败；老年代空间相对较大，更适合存储大对象，有助于减少内存碎片的产生"]},
{q:"程序计数器的作用，为什么是私有的", a:["Java 程序支持多线程一起运行，CPU 的调度组件给线程分配时间片：例如给线程 1 分配一个时间片，时间片内代码没执行完，就把线程 1 的状态执行暂停，切换到线程 2 执行代码，等线程 2 的时间片用完再切换回来继续执行线程 1 剩余部分的代码","**在线程切换的过程中，下一条指令执行到哪里，就需要用到程序计数器**——它记录线程正在执行的指令地址，切换回来后才能接着执行","**每个线程都有自己的程序计数器**，因为它们各自执行的代码的指令地址是不一样的，所以每个线程都应该有自己的程序计数器（私有）"]},
{q:"方法区中的方法的执行过程", a:["**① 解析方法调用**：JVM 会根据方法的符号引用找到实际的方法地址（如果之前没有解析过的话）","**② 栈帧创建**：在调用一个方法前，JVM 会在当前线程的 Java 虚拟机栈中为该方法分配一个新的栈帧，用于存储局部变量表、操作数栈、动态链接、方法出口等信息","**③ 执行方法**：执行方法内的字节码指令，涉及的操作可能包括局部变量的读写、操作数栈的操作、跳转控制、对象创建、方法调用等","**④ 返回处理**：方法执行完毕后，可能会返回一个结果给调用者，并清理当前栈帧，恢复调用者的执行环境"]},
{q:"方法区中还有哪些东西", a:["《深入理解Java虚拟机》书中描述：方法区用于存储已被虚拟机加载的**类型信息、常量、静态变量、即时编译器编译后的代码缓存**等，具体包括：","**类信息**：类的结构信息、类的访问修饰符、父类与接口等信息","**常量池**：存储类和接口中的常量，包括字面量常量、符号引用，以及运行时常量池","**静态变量**：存储类的静态变量，这些变量在类初始化的时候被赋值","**方法字节码**：存储类的方法字节码，即编译后的代码","**符号引用**：存储类和方法的符号引用，是一种不同于直接引用的引用类型","**运行时常量池**：存储着类文件中的常量池数据，在类加载后在方法区生成该运行时常量池","**常量池缓存**：用于提升类加载的效率，将常用的常量缓存起来方便使用"]},
]},
{name:"引用与内存", qa:[
{q:"String保存在哪里呢", a:["String 保存在**字符串常量池**中，不同于其他对象，它的值是不可变的，且可以被多个引用共享"]},
{q:"String s = new String(\"abc\")执行过程中分别对应哪些内存区域", a:["首先，代码中有 new 关键字，new 指令是创建一个类的实例对象并完成加载初始化的，因此这个字符串对象是在**运行期**才能确定的，创建的字符串对象是在**堆内存**上","其次，在 String 的构造方法中传递的字符串 abc 是被 final 修饰的属性，所以它是一个**字符串常量**。在首次构建这个对象时，JVM 拿字面量\"abc\"去字符串常量池试图获取其对应 String 对象的引用，于是在**堆中创建了一个\"abc\"的 String 对象**，并将其引用**保存到字符串常量池**中，然后返回","所以：如果 abc 这个字符串常量不存在，则创建**两个对象**（abc 这个字符串常量 + new String 这个实例对象）；如果 abc 字符串常量存在，则只会创建一个对象"]},
{q:"引用类型有哪些？有什么区别", a:["引用类型主要分为**强软弱虚**四种：","**强引用**：代码中普遍存在的赋值方式，比如 A a = new A()。强引用关联的对象，**永远不会被 GC 回收**","**软引用 SoftReference**：指的是那些有用但不是必须要的对象，系统在**发生内存溢出前**会对这类引用的对象进行回收","**弱引用 WeakReference**：强度比软引用更低一点，弱引用的对象**下一次 GC 的时候一定会被回收**，而不管内存是否足够","**虚引用 PhantomReference**：也被称作幻影引用，是最弱的引用关系，**必须和 ReferenceQueue 一起使用**，同样当发生 GC 的时候虚引用也会被回收，可以用虚引用来管理堆外内存"]},
{q:"弱引用了解吗?举例说明在哪里可以用", a:["Java 中的弱引用是一种引用类型，**不会阻止一个对象被垃圾回收**，通过 java.lang.ref.WeakReference 类实现","主要用途：创建**非强制性的对象引用**，这些引用可以在内存压力大时被垃圾回收器清理，从而避免内存泄露","**使用场景**：① **缓存系统**：常用于实现缓存，当希望缓存项能够在内存压力下自动释放时——如果缓存大小不受控制可能导致内存溢出，用弱引用维护缓存可让 JVM 在需要更多内存时自动清理缓存对象（如 CacheExample 用 WeakReference 存储占 10MB 的 MyHeavyObject，内存压力增大时 GC 可自由回收这些对象而不影响缓存正常运行）；② **对象池**：管理那些暂时不使用的对象，对象不再被强引用时可以被垃圾回收释放内存；③ **避免内存泄露**：当对象不应被长期引用时，使用弱引用可防止对象被意外保留","**注意**：对象被垃圾回收后，下次从缓存获取时 get() 会返回 null，此时可重新创建对象放入缓存；因此使用弱引用时要注意，对象被回收后通过弱引用获取可能会变为 null，**使用前通常需要检查**"]},
{q:"内存泄漏和内存溢出的理解", a:["**内存泄漏**：程序在运行过程中不再使用的对象仍然被引用，而无法被垃圾收集器回收，导致可用内存逐渐减少。虽然在 Java 中垃圾回收机制会自动回收不再使用的对象，但如果有对象仍被不再使用的引用持有，垃圾收集器无法回收这些内存，最终可能导致程序内存使用不断增加","内存泄漏常见原因：**静态集合**（使用静态数据结构如 HashMap 或 ArrayList 存储对象且未清理）、**事件监听**（未取消对事件源的监听导致对象持续被引用）、**线程**（未停止的线程可能持有对象引用无法被回收）","**内存溢出**：Java 虚拟机在申请内存时无法找到足够的内存，最终引发 OutOfMemoryError，通常发生在堆内存不足以存放新创建的对象时","内存溢出常见原因：**大量对象创建**（程序不断创建大量对象超出 JVM 堆的限制）、**持久引用**（大型数据结构如缓存、集合长时间持有对象引用导致内存累积）"]},
]},
{name:"内存溢出与内存泄漏案例", qa:[
{q:"jvm内存结构有哪几种内存溢出的情况", a:["**堆内存溢出**：出现 java.lang.OutOfMemoryError: java heap space 异常。原因是代码中可能存在大对象分配，或者发生了内存泄露，导致在多次 GC 之后还是无法找到一块足够大的内存容纳当前对象","**栈溢出**：如果写一段程序不断进行递归调用而且没有退出条件，就会导致不断进行压栈，JVM 实际会抛出 StackOverflowError；当然，如果 JVM 试图去扩展栈空间的时候失败，则会抛出 OutOfMemoryError","**元空间溢出**：系统抛出 java.lang.OutOfMemoryError: Metaspace。原因是系统的代码非常多、引用的第三方包非常多，或通过动态代码生成类加载等方法，导致元空间的内存占用很大","**直接内存溢出**：在使用 ByteBuffer 中的 allocateDirect() 时会用到，很多 Java NIO（像 netty）的框架中被封装为其他方法，出现该问题时会抛出 java.lang.OutOfMemoryError: Direct buffer memory"]},
