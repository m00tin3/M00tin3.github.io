{q:"redis有哪些高级功能", a:["**持久化**：RDB 快照（将某一时刻的内存数据以二进制方式写入磁盘）、AOF 日志（每执行一条写操作命令就把该命令以追加方式写入文件），保证重启后数据不丢失","**过期键删除**：惰性删除+定期删除两种策略配合使用，在合理使用 CPU 时间和避免内存浪费之间取得平衡","**事务**：使用 MULTI、EXEC、DISCARD 和 WATCH 等命令管理事务，保证一系列操作的原子性（但 Redis 没有提供回滚机制）","**发布订阅（Pub/Sub）**：任何客户端可以订阅一个或多个频道，发布者向特定频道发送消息，所有订阅该频道的客户端都会收到消息","**Lua 脚本**：将多个操作写到一个 Lua 脚本中，Redis 会把整个 Lua 脚本作为一个整体执行，执行过程中不会被其他命令打断，保证原子性","**主从复制**：将主节点的数据复制到从节点，实现读写分离和数据备份；**哨兵机制**：监控主节点是否存活，发现主节点挂了自动选举从节点切换为主节点，实现故障转移；**集群模式**：通过哈希槽对数据分片，分布在不同服务器上，实现高可用和高性能"]},
{q:"redis为什么是单线程？单线程有什么好处", a:["**单线程模型避免了多线程之间的竞争**，省去了多线程切换带来的时间和性能上的开销，而且也不会导致死锁问题","**Redis 的大部分操作都在内存中完成，并且采用了高效的数据结构**——Redis 瓶颈可能是机器的内存或者网络带宽而并非 CPU，既然 CPU 不是瓶颈，自然采用单线程方案；同时 Redis 采用 **I/O 多路复用机制**处理大量的客户端 Socket 请求（select/epoll 机制），即使单线程也能处理高并发连接","**单 Reactor 单进程方案的好处**：全部工作都在同一个进程内完成，实现起来比较简单，不需要考虑进程间通信，也不用担心多进程竞争（Redis 由 C 语言实现，6.0 之前采用的正是单 Reactor 单进程方案，因为 Redis 业务处理主要是在内存中完成，操作速度很快，性能瓶颈不在 CPU 上）","**该方案的缺点**：① 因为只有一个进程，无法充分利用多核 CPU 的性能；② Handler 对象在业务处理时，整个进程无法处理其他连接的事件，如果业务处理耗时比较长，就会造成响应的延迟——所以单 Reactor 单进程的方案不适用于计算密集型的场景，只适用于业务处理非常快速的场景","**注意**：Redis 6.0 之后将网络 IO 的处理改成了多线程的方式，但是对于命令的执行，Redis 仍然使用单线程来处理"]},
{q:"redis数据库是怎么保存数据的", a:["Redis 是基于**内存的键值存储系统**，所有数据都保存在内存中，因此读写速度非常快","内部使用**哈希表（字典）**来保存键值对：键是字符串，值可以是各种类型（字符串、哈希、列表、集合、有序集合），还可以是后续版本新增的 Bitmap、HyperLogLog、GEO、Stream 等数据类型","**哈希表会在数据量增长时触发 rehash 扩容**：为了不阻塞 Redis，采用渐进式 rehash 将数据迁移工作分摊到多次处理请求的过程中","提供**持久化机制**把内存数据保存到磁盘（RDB 快照、AOF 日志），这样 Redis 重启后能够从磁盘中恢复原有的数据"]},
{q:"redis底层是怎么存储字符串的", a:["**Redis 的 String 字符串是用 SDS 数据结构存储的**（SDS 即简单动态字符串，Redis 5.0 的 SDS 数据结构包含以下成员）：","**len**：记录了字符串长度——这样获取字符串长度的时候，只需要返回这个成员变量值就行，时间复杂度只需要 **O(1)**","**alloc**：分配给字符数组的空间长度——这样在修改字符串的时候，可以通过 alloc - len 计算出剩余的空间大小，用来判断空间是否满足修改需求，如果不满足的话就会自动将 SDS 的空间扩展至执行修改所需的大小，所以使用 SDS 既不需要手动修改空间大小，也不会出现缓冲区溢出的问题","**flags**：用来表示不同类型的 SDS，一共设计了 **5 种类型**，分别是 sdshdr5、sdshdr8、sdshdr16、sdshdr32 和 sdshdr64","**buf[]**：字符数组，用来保存实际数据，不仅可以保存字符串，也可以保存二进制数据","**总的来说**：Redis 的 SDS 结构在原本字符数组之上增加了三个元数据 len、alloc、flags，用来解决 C 语言字符串的缺陷"]},
{q:"redis为什么用SDS而不是C字符串", a:["**O(1) 复杂度获取字符串长度**：C 语言的字符串长度获取 strlen 函数需要通过遍历的方式来统计字符串长度，时间复杂度是 O(N)；而 Redis 的 SDS 结构因为加入了 len 成员变量，获取字符串长度时直接返回这个成员变量的值就行，复杂度只有 O(1)","**二进制安全**：因为 SDS 不需要用 \"\\0\" 字符来标识字符串结尾了，而是有个专门的 len 成员变量来记录长度，所以可存储包含 \"\\0\" 的数据；但是 SDS 为了兼容部分 C 语言标准库的函数，字符串结尾还是会加上 \"\\0\" 字符。SDS 的 API 都是以处理二进制的方式来处理 buf[] 里的数据，程序不会对其中的数据做任何限制，数据写入的时候是什么样的，它被读取时就是什么样的","**不会发生缓冲区溢出**：C 语言的字符串标准库提供的字符串操作函数（比如 strcat 追加字符串函数）大多数都是不安全的，因为这些函数把缓冲区大小是否满足操作需求的工作交由开发者来保证，程序内部并不会判断缓冲区大小是否足够用，当发生了缓冲区溢出就有可能造成程序异常结束；而 SDS 结构里引入了 alloc 和 len 成员变量，SDS API 通过 alloc - len 计算可以算出剩余可用的空间大小，在对字符串做修改操作的时候由程序内部判断缓冲区大小是否足够用，而且当判断出缓冲区大小不够用时，Redis 会自动扩大 SDS 的空间大小以满足修改所需的大小","**兼容部分 C 字符串函数**：SDS 字符串结尾保留 \"\\0\"，可以兼容 C 语言标准库的部分函数"]},
{q:"redis为什么不直接使用c语言的字符串", a:["**C 语言字符串存在较多缺陷**：① strlen 获取长度需要遍历，时间复杂度 O(N) 效率低；② 字符串操作函数（如 strcat）大多数不安全，缓冲区大小是否满足由开发者保证、程序内部不判断，发生缓冲区溢出可能造成程序异常结束；③ 以 \"\\0\" 标识字符串结尾，无法保存包含空字符的二进制数据；④ 修改字符串时频繁触发内存重新分配","**Redis 用 SDS 解决这些问题**：通过新增 len（O(1) 获取长度）、alloc（通过 alloc-len 判断剩余空间、空间不足自动扩容杜绝缓冲区溢出）、flags（类型标志）三个元数据，并采用二进制安全的方式处理 buf[] 数据，使得 Redis 不仅可以保存文本数据，也可以保存任意格式的二进制数据"]},
]},
{name:"数据结构", qa:[
{q:"redis的五大基本数据类型，用在哪里", a:["**String 字符串**：可以是字符串、整数或浮点数，对整个字符串或字符串的一部分进行操作、对整数或浮点数进行自增或自减操作。应用场景：**缓存对象、常规计数、分布式锁、共享 session 信息**等","**List 列表**：一个链表，链表上的每个节点都包含一个字符串，可以对链表的两端进行 push 和 pop 操作、读取单个或多个元素、根据值查找或删除元素。应用场景：**消息队列**（但是有两个问题：1. 生产者需要自行实现全局唯一 ID；2. 不能以消费组形式消费数据）等","**Hash 散列**：包含键值对的无序散列表，包含添加、获取、删除单个元素的方法。应用场景：**缓存对象、购物车**等","**Set 集合**：包含字符串的无序集合，包含基础的方法有看是否存在、添加、获取、删除，还包含计算**交集、并集、差集**等。应用场景：**聚合计算场景，比如点赞、共同关注、抽奖活动**等","**Zset 有序集合**：字符串成员与浮点数分数之间的有序映射，元素的排列顺序由分数的大小决定，包含添加、获取、删除单个元素以及根据分值范围或成员来获取元素的方法。应用场景：**排序场景，比如排行榜、电话和姓名排序**等","**随着 Redis 版本更新，后面又支持了四种数据类型**：**Bitmap（2.2 版新增）**——二值状态统计的场景，比如签到、判断用户登陆状态、连续签到用户总数等；**HyperLogLog（2.8 版新增）**——海量数据基数统计的场景，比如百万级网页 UV 计数等；**GEO（3.2 版新增）**——存储地理位置信息的场景，比如滴滴叫车；**Stream（5.0 版新增）**——消息队列，相比于基于 List 类型实现的消息队列，有两个特有的特性：自动生成全局唯一消息 ID，支持以消费组形式消费数据"]},
{q:"简述zset的底层原理", a:["**Zset 类型的底层数据结构是由压缩列表或跳表实现的**","**如果有序集合的元素个数小于 128 个，并且每个元素的值小于 64 字节时**，Redis 会使用**压缩列表**作为 Zset 类型的底层数据结构（压缩列表是 Redis 为节约内存而开发的、由连续内存块组成的顺序型数据结构，查找第一个和最后一个元素 O(1)，查找其他元素 O(N)）","**如果有序集合的元素不满足上面的条件**，Redis 会使用**跳表**作为 Zset 类型的底层数据结构（跳表是在链表基础上改进实现的多层有序链表，数据量大时查找复杂度 O(logN)）","**在 Redis 7.0 中，压缩列表数据结构已经废弃了，交由 listpack 数据结构来实现**"]},
{q:"zset底层数据结构是什么", a:["**两种底层实现：压缩列表（ziplist）或跳表（skiplist）**","**压缩列表**：当元素个数小于 128 个且每个元素的值小于 64 字节时使用。压缩列表由连续内存块组成，结构紧凑能节省内存；查找第一个和最后一个元素 O(1)，查找其他元素 O(N)，因此不适合保存过多元素。Redis 7.0 中压缩列表已废弃，交由 listpack 实现","**跳表**：当元素个数多或元素值大时使用。跳表是「多层」的有序链表，能快速定位数据，数据量大时查找复杂度 O(logN)；插入、删除只需调整局部指针，实现简单"]},
{q:"跳跃表是如何实现的", a:["**为什么需要跳表**：链表在查找元素的时候，因为需要逐一查找，所以查询效率非常低，时间复杂度是 O(N)，于是就出现了跳表——跳表是在链表基础上改进过来的，实现了一种「多层」的有序链表，这样的好处是能快速定位数据","**查找过程示例**：一个层级为 3 的跳表，L0 层级共有 5 个节点（节点 1、2、3、4、5），L1 层级共有 3 个节点（节点 2、3、5），L2 层级只有 1 个节点（节点 3）。如果要在链表中查找节点 4，只能从头开始遍历链表需要查找 4 次；而使用了跳表后只需要查找 2 次就能定位到节点 4，因为可以在头节点直接从 L2 层级跳到节点 3，然后再往前遍历找到节点 4。查找过程就是在多个层级上跳来跳去，当数据量很大时，跳表的查找复杂度就是 O(logN)","**跳表节点的数据结构（zskiplistNode）**：**sds ele**——Zset 对象的元素值；**double score**——元素权重值；**后向指针 backward**——指向前一个节点，目的是为了方便从跳表的尾节点开始访问节点，倒序查找时很方便；**level[] 数组**——跳表是一个带有层级关系的链表，每一层级可以包含多个节点，节点通过指针连接起来，实现这一特性就是靠 zskiplistLevel 结构体类型的 level 数组，数组中的每一个元素代表跳表的一层（level[0] 表示第一层），zskiplistLevel 结构体里定义了「指向下一个跳表节点的前向指针 forward」和「跨度 span」，跨度用来记录两个节点之间的距离","**遍历操作**：只需要用前向指针（struct zskiplistNode *forward）就可以完成，与跨度无关"]},
{q:"redis跳表的时间复杂度", a:["**插入、删除、查找都是 O(logN) 的平均时间复杂度**——跳表通过在多个层级上跳来跳去最后定位到元素，数据量很大时查找复杂度就是 O(logN)","**通过随机层数设计保证对数级性能**：跳表在创建节点时随机生成每个节点的层数，并没有严格维持相邻两层的节点数量比例为 2:1 的情况；生成 [0-1] 的随机数，小于 0.25（概率 25%）则层数加 1 继续生成，直到大于 0.25 结束，每增加一层的概率不超过 25%，层数越高概率越低，层高最大限制是 64","**最坏情况**：理论上会退化为链表 O(N)，但概率极低，实际应用中性能稳定在对数级别"]},
{q:"redis的数据结构有哪些", a:["**常见的有五种数据类型**：**String（字符串）**——可以是字符串、整数或浮点数；**Hash（哈希）**——包含键值对的无序散列表；**List（列表）**——一个链表，每个节点都包含一个字符串；**Set（集合）**——包含字符串的无序集合；**Zset（有序集合）**——字符串成员与浮点数分数之间的有序映射","**随着 Redis 版本更新，后面又支持了四种数据类型**：**Bitmap（2.2 版新增）**——二值状态统计的场景，比如签到、判断用户登陆状态、连续签到用户总数等；**HyperLogLog（2.8 版新增）**——海量数据基数统计的场景，比如百万级网页 UV 计数等（最多使用约 12KB 内存即可统计海量数据的基数，存在一定误差）；**GEO（3.2 版新增）**——存储地理位置信息的场景，比如滴滴叫车；**Stream（5.0 版新增）**——消息队列，自动生成全局唯一消息 ID、支持以消费组形式消费数据"]},
{q:"redis中什么数据结构可以用来做延迟队列", a:["**ZSet 有序集合**非常适合用来实现延迟队列","**实现思路**：将任务 id 作为 member、任务的**到期时间戳作为 score** 存入 ZSet；消费者定时轮询，使用 **zrangebyscore key -inf 当前时间戳** 取出所有已到期的任务执行；任务执行成功后使用 **zrem** 删除该成员；如果任务执行失败，重新 zadd 设置新的到期时间等待下次执行","**原理**：ZSet 会按照 score（到期时间戳）从小到大排序，所以最早到期的任务排在前面，轮询时只需取出 score 小于等于当前时间戳的成员即可"]},
{q:"redis里面的对象类型有哪些", a:["**字符串对象（string）**：编码可以是 **int**（整数值）、**embstr**（长度较短的小字符串，内存连续、一次分配）、**raw**（长度较长的字符串，两次分配内存）","**列表对象（list）**：Redis 3.2 之后统一使用 **quicklist** 编码（快速列表，由多个压缩列表节点组成）","**哈希对象（hash）**：元素较少且键值较短时使用 **ziplist**（压缩列表）编码，元素多或键值长时使用 **hashtable**（字典，数组+链表解决冲突、支持渐进式 rehash）","**集合对象（set）**：所有元素都是整数且数量较少时使用 **intset**（整数集合）编码，否则使用 **hashtable** 编码","**有序集合对象（zset）**：元素个数小于 128 且每个元素的值小于 64 字节时使用 **ziplist**（压缩列表，Redis 7.0 后由 listpack 实现）编码，否则使用 **skiplist**（跳表）编码","**注意**：Redis 7.0 中压缩列表数据结构已经废弃，交由 listpack 数据结构来实现"]},
{q:"Redis的rehash机制说一下", a:["**进行 rehash 的时候，需要用上 2 个哈希表**：在正常服务请求阶段，插入的数据都会写入到「哈希表 1」，此时的「哈希表 2」并没有被分配空间","**触发 rehash 后，这个过程分为三步**：① 给「哈希表 2」分配空间，一般会比「哈希表 1」大 2 倍；② 将「哈希表 1」的数据迁移到「哈希表 2」中；③ 迁移完成后，「哈希表 1」的空间会被释放，并把「哈希表 2」设置为「哈希表 1」，然后在「哈希表 2」新创建一个空白的哈希表，为下次 rehash 做准备","**普通 rehash 的问题**：如果「哈希表 1」的数据量非常大，那么在迁移至「哈希表 2」的时候，因为会涉及大量的数据拷贝，此时可能会对 Redis 造成阻塞，无法服务其他请求","**渐进式 rehash**：为了避免 rehash 在数据迁移过程中因拷贝数据的耗时影响 Redis 性能，Redis 采用渐进式 rehash，将数据的迁移工作分多次迁移完成——① 给「哈希表 2」分配空间；② 在 rehash 进行期间，每次哈希表元素进行新增、删除、查找或者更新操作时，Redis 除了会执行对应的操作之外，还会**顺序将「哈希表 1」中索引位置上的所有 key-value 迁移到「哈希表 2」上**；③ 随着处理客户端发起的哈希表操作请求数量越多，最终在某个时间点会把「哈希表 1」的所有 key-value 迁移到「哈希表 2」，从而完成 rehash 操作。这样就巧妙地把一次性大量数据迁移工作的开销分摊到了多次处理请求的过程中","**渐进式 rehash 期间的读写规则**：会同时有两个哈希表，删除、查找、更新等操作都会在这两个哈希表进行（比如查找一个 key 的值，先会在「哈希表 1」里面进行查找，如果没找到，就会继续到哈希表 2 里面进行查找）；**新增一个 key-value 时，会被保存到「哈希表 2」里面，而「哈希表 1」则不再进行任何添加操作**，这样保证了「哈希表 1」的 key-value 数量只会减少，随着 rehash 操作的完成，最终「哈希表 1」就会变成空表"]},
{q:"zset底层跳表在redis里的实现", a:["**跳表节点结构（zskiplistNode）**：**sds ele**——Zset 对象的元素值；**double score**——元素权重值；**后向指针 backward**——指向前一个节点，方便从尾节点开始倒序访问；**level[] 数组**——由 zskiplistLevel 结构体组成，每个元素代表一层，zskiplistLevel 里包含「前向指针 forward」和「跨度 span」","**跳表结构（zskiplist）**：包含 header（头节点）、tail（尾节点）、length（节点数量）、level（最大层数）","**层高是怎么设置的**：跳表在创建节点时，会生成范围为 [0-1] 的一个随机数，如果这个随机数小于 0.25（相当于概率 25%），那么层数就增加 1 层，然后继续生成下一个随机数，直到随机数的结果大于 0.25 结束，最终确定该节点的层数——相当于每增加一层的概率不超过 25%，层数越高概率越低，**层高最大限制是 64**；如果层高最大限制是 64，那么在创建跳表「头节点」的时候，就会**直接创建 64 层高的头节点**","**查找与排名**：查找按 score 从最高层逐层比较前进；跨度记录两个节点之间的距离，用于计算排名（zrank）"]},
{q:"redis的hash结构底层怎么实现的", a:["**哈希对象（hash）底层有两种编码实现**：","**ziplist（压缩列表）编码**：当哈希元素数量较少且每个键值对长度较短时使用（元素少于 512 个且每个键值长度小于 64 字节）——压缩列表由连续内存块组成，结构紧凑节省内存，查找其他元素是 O(N)，适合小数据量场景","**hashtable（字典）编码**：当元素数量多或键值长时使用——采用数组+链表解决哈希冲突，并在数据量增长时通过**渐进式 rehash** 扩容，避免一次性迁移大量数据阻塞 Redis"]},
]},
{name:"过期删除与内存淘汰", qa:[
{q:"redis过期键的删除策略", a:["**Redis 的缓存失效不会立即删除，过期删除策略选择「惰性删除+定期删除」这两种策略配合使用**，以求在合理使用 CPU 时间和避免内存浪费之间取得平衡","**惰性删除策略**：不主动删除过期键，每次从数据库访问 key 时都检测 key 是否过期，如果过期则删除该 key。它由 db.c 文件中的 **expireIfNeeded 函数**实现——Redis 在访问或者修改 key 之前，都会调用该函数对其进行检查：① 如果过期，则删除该 key（至于选择异步删除还是同步删除，根据 **lazyfree_lazy_expire** 参数配置决定，Redis 4.0 版本开始提供参数），然后返回 null 给客户端；② 如果没有过期，不做任何处理，然后返回正常的键值对给客户端。惰性删除的优点是不会浪费 CPU 去检查无关 key，缺点是过期键一直不被访问就会一直占用内存","**定期删除策略**：每隔一段时间「随机」从数据库中取出一定数量的 key 进行检查，并删除其中的过期 key。**间隔时间**：默认每秒进行 10 次过期检查（redis.conf 配置键 hz 默认 10），每次检查并不是遍历过期字典中的所有 key，而是从数据库中随机抽取一定数量的 key 进行过期检查；**随机抽查数量**：由 expire.c 文件下 activeExpireCycle 函数中的 **ACTIVE_EXPIRE_CYCLE_LOOKUPS_PER_LOOP** 定义，数值是 20，也就是每轮抽查会随机选择 20 个 key 判断是否过期","**定期删除的流程**：1. 从过期字典中随机抽取 20 个 key；2. 检查这 20 个 key 是否过期，并删除已过期的 key；3. 如果本轮检查的已过期 key 的数量超过 5 个（20/4），也就是「已过期 key 的数量」占比「随机抽取 key 的数量」大于 25%，则继续重复步骤 1；如果已过期的 key 比例小于 25%，则停止继续删除过期 key，等待下一轮再检查。**Redis 还增加了定期删除循环流程的时间上限，默认不会超过 25ms**，防止循环过度导致线程卡死","**为什么不立即删除（定时删除）**：在过期 key 比较多的情况下，删除过期 key 可能会占用相当一部分 CPU 时间，在内存不紧张但 CPU 时间紧张的情况下，将 CPU 时间用于删除和当前任务无关的过期键，无疑会对服务器的响应时间和吞吐量造成影响，所以定时删除策略对 CPU 不友好"]},
{q:"redis持久化机制", a:["**Redis 的读写操作都是在内存中**，所以 Redis 性能才会高，但是当 Redis 重启后内存中的数据就会丢失，为了保证内存中的数据不会丢失，Redis 实现了数据持久化的机制，把数据存储到磁盘，Redis 重启时就能从磁盘中恢复原有的数据。Redis 有两种数据持久化的方式：","**AOF 日志**：每执行一条写操作命令，就把该命令以追加的方式写入到一个文件里（Redis 重启时读取该文件记录的命令，然后逐一执行命令的方式来进行数据恢复）——AOF 提供了更好的数据安全性，因为默认每接收到一个写命令就会追加到文件末尾，即使 Redis 服务器宕机，也只会丢失最后一次写入前的数据；AOF 支持多种同步策略（everysec、always 等），可以根据需要调整数据安全性和性能之间的平衡；AOF 文件在 Redis 启动时可以通过重写机制优化，减少文件体积，加快恢复速度；即使文件发生损坏，AOF 还提供了 redis-check-aof 工具来修复损坏的文件。**缺点**：因为记录了每一个写操作，AOF 文件通常比 RDB 文件更大，消耗更多的磁盘空间；频繁的磁盘 IO 操作（尤其是同步策略设置为 always 时）可能会对 Redis 的写入性能造成一定影响；当文件体积过大时 AOF 会进行重写操作，如果没有开启 AOF 重写或者重写频率较低，恢复过程可能较慢，因为它需要重放所有的操作命令","**RDB 快照**：将某一时刻的内存数据以二进制的方式写入磁盘——RDB 通过快照的形式保存某一时刻的数据状态，文件体积小，备份和恢复的速度非常快；RDB 是在主线程之外通过 fork 子进程来进行的，不会阻塞服务器处理命令请求，对 Redis 服务的性能影响较小；由于是定期快照，RDB 文件通常比 AOF 文件小得多。**缺点**：RDB 方式在两次快照之间，如果 Redis 服务器发生故障，这段时间的数据将会丢失；如果在 RDB 创建快照到恢复期间有写操作，恢复后的数据可能与故障前的数据不完全一致","**AOF 三种写回策略**：**Always**——每次写操作命令执行完后，同步将 AOF 日志数据写回硬盘，可靠性高、最大程度保证数据不丢失，但每个写命令都要写回硬盘，性能开销大；**Everysec**——每次写操作命令执行完后，先将命令写入到 AOF 文件的内核缓冲区，然后每隔一秒将缓冲区里的内容写回到硬盘，性能适中，宕机时会丢失 1 秒内的数据；**No**——不由 Redis 控制写回硬盘的时机，转交给操作系统控制写回的时机（每次写操作命令执行完后先将命令写入到 AOF 文件的内核缓冲区，再由操作系统决定何时将缓冲区内容写回硬盘），性能好，但宕机时丢失的数据可能会很多"]},
{q:"RDB和AOF各自有什么优缺点", a:["**AOF 优点**：① 提供更好的数据安全性——默认每接收到一个写命令就会追加到文件末尾，即使 Redis 服务器宕机，也只会丢失最后一次写入前的数据；② 支持多种同步策略（如 everysec、always 等），可以根据需要调整数据安全性和性能之间的平衡；③ AOF 文件在 Redis 启动时可以通过重写机制优化，减少文件体积，加快恢复速度；④ 即使文件发生损坏，AOF 还提供了 redis-check-aof 工具来修复损坏的文件","**AOF 缺点**：① 因为记录了每一个写操作，AOF 文件通常比 RDB 文件更大，消耗更多的磁盘空间；② 频繁的磁盘 IO 操作（尤其是同步策略设置为 always 时）可能会对 Redis 的写入性能造成一定影响；③ 当文件体积过大时 AOF 会进行重写操作，如果没有开启 AOF 重写或者重写频率较低，恢复过程可能较慢，因为它需要重放所有的操作命令","**RDB 优点**：① RDB 通过快照的形式保存某一时刻的数据状态，文件体积小，备份和恢复的速度非常快；② RDB 是在主线程之外通过 fork 子进程来进行的，不会阻塞服务器处理命令请求，对 Redis 服务的性能影响较小；③ 由于是定期快照，RDB 文件通常比 AOF 文件小得多","**RDB 缺点**：① RDB 方式在两次快照之间，如果 Redis 服务器发生故障，这段时间的数据将会丢失；② 如果在 RDB 创建快照到恢复期间有写操作，恢复后的数据可能与故障前的数据不完全一致","**综合**：因为 AOF 日志记录的是操作命令、不是实际的数据，用 AOF 方法做故障恢复时需要全量把日志都执行一遍，一旦 AOF 日志非常多势必会造成 Redis 恢复操作缓慢；而 RDB 快照记录的是实际数据，恢复时直接将 RDB 文件读入内存即可，效率比 AOF 高。两者各有优劣，实际使用中可结合场景选择或同时开启"]},
{q:"如何保证Redis的缓存和数据库的数据一致性", a:["**基本策略**：对于读数据，选择**旁路缓存策略**——如果 cache 不命中，会从 db 加载数据到 cache；对于写数据，选择**先更新 db，再删除缓存**","**为什么会有不一致**：缓存是通过牺牲强一致性来提高性能的，这是由 CAP 理论决定的——缓存系统适用的场景就是非强一致性的场景，它属于 CAP 中的 AP。所以如果需要数据库和缓存数据保持强一致，就不适合使用缓存。使用缓存提升性能，就是会有数据更新的延迟，这需要我们在设计时结合业务仔细思考是否适合用缓存","**缓存一定要设置过期时间**：这个时间太短、或者太长都不好——太短的话请求可能会比较多的落到数据库上，这也意味着失去了缓存的优势；太长的话缓存中的脏数据会使系统长时间处于一个延迟的状态，而且系统中长时间没有人访问的数据一直存在内存中不过期，浪费内存。但是通过一些方案优化处理，是可以达到最终一致性的","**针对删除缓存异常的情况，可以使用 2 个方案避免**：","**方案一：删除缓存重试策略（消息队列）**——引入消息队列，将第二个操作（删除缓存）要操作的数据加入到消息队列，由消费者来操作数据；如果应用删除缓存失败，可以从消息队列中重新读取数据，然后再次删除缓存，这就是重试机制（如果重试超过的一定次数还是没有成功，需要向业务层发送报错信息）；如果删除缓存成功，就要把数据从消息队列中移除，避免重复操作，否则就继续重试。**注意**：重试删除缓存机制还可以，但是会造成好多业务代码入侵","**方案二：订阅 binlog，再删除缓存（Canal+消息队列）**——「先更新数据库，再删缓存」的策略第一步是更新数据库，那么更新数据库成功就会产生一条变更日志记录在 binlog 里，于是可以通过订阅 binlog 日志，拿到具体要操作的数据，然后再执行缓存删除。阿里巴巴开源的 **Canal 中间件**就是基于这个实现的：Canal 模拟 MySQL 主从复制的交互协议，把自己伪装成一个 MySQL 的从节点，向 MySQL 主节点发送 dump 请求，MySQL 收到请求后就会开始推送 Binlog 给 Canal，Canal 解析 Binlog 字节流之后转换为便于读取的结构化数据，供下游程序订阅使用。将 binlog 日志采集发送到 MQ 队列里面，然后编写一个简单的缓存删除消息订阅 binlog 日志，根据更新 log 删除缓存，并且通过 **ACK 机制**确认处理这条更新 log，保证数据缓存一致性"]},
]},
{name:"集群与高可用", qa:[
{q:"redis持久化怎么做", a:["**AOF 日志**：Redis 在执行完一条写操作命令后，就会把该命令以追加的方式写入到一个文件里，然后 Redis 重启时，会读取该文件记录的命令，然后逐一执行命令的方式来进行数据恢复。以 [set name xiaolin] 命令为例，记录在 AOF 日志里的内容是：*3 $3 set $4 name $7 xiaolin（分别表示命令条数、参数个数、参数内容等）。AOF 通过 Redis.conf 配置文件中的 appendfsync 配置项提供 3 种写回硬盘的策略：**Always**（同步写回，每次写操作命令执行完后同步将 AOF 日志数据写回硬盘，可靠性高、最大程度保证数据不丢失，但每个写命令都要写回硬盘性能开销大）；**Everysec**（每秒写回，每次写操作命令执行完后先将命令写入到 AOF 文件的内核缓冲区，然后每隔一秒将缓冲区里的内容写回到硬盘，性能适中，宕机时会丢失 1 秒内的数据）；**No**（由操作系统控制写回，每次写操作命令执行完后先将命令写入到 AOF 文件的内核缓冲区，再由操作系统决定何时将缓冲区内容写回硬盘，性能好，但宕机时丢失的数据可能会很多）","**RDB 快照**：因为 AOF 日志记录的是操作命令、不是实际的数据，所以用 AOF 方法做故障恢复时，需要全量把日志都执行一遍，一旦 AOF 日志非常多，势必会造成 Redis 的恢复操作缓慢。为了解决这个问题，Redis 增加了 RDB 快照——RDB 快照就是记录某一个瞬间的内存数据，记录的是实际数据，因此恢复数据时效率会比 AOF 高些，因为直接将 RDB 文件读入内存就可以，不需要像 AOF 那样还需要额外执行操作命令的步骤才能恢复数据","**Redis 提供了两个命令来生成 RDB 文件，它们的区别就在于是否在「主线程」里执行**：执行了 **save** 命令，就会在主线程生成 RDB 文件，由于和执行操作命令在同一个线程，所以如果写入 RDB 文件的时间太长，会阻塞主线程；执行了 **bgsave** 命令，会创建一个子进程来生成 RDB 文件，这样可以避免主线程的阻塞","**混合持久化**（Redis 4.0 之后）：AOF 重写时可以把 RDB 快照内容与增量 AOF 命令合并写入，兼具 RDB 恢复快和 AOF 数据完整的特点"]},
{q:"redis主从同步原理", a:["**完全同步**发生在以下几种情况：① **初次同步**——当一个从服务器（slave）首次连接到主服务器（master）时，会进行一次完全同步；② **从服务器数据丢失**——如果从服务器数据由于某种原因（如断电）丢失，它会请求进行完全同步；③ **主服务器数据发生变化**——如果从服务器长时间未与主服务器同步，导致数据差异太大，也可能触发完全同步","**主从服务器间的第一次同步的过程可分为三个阶段**：**第一阶段是建立链接、协商同步**——从服务器执行 replicaof 192.168.1.100 6379 命令，发送 psync ? -1，主服务器回复 FULLRESYNC {runID} {offset}，从服务器保存主服务器的信息；**第二阶段是主服务器同步数据给从服务器**——主服务器执行 bgsave 命令以生成 RDB 文件，传输 RDB 文件，从服务器清空当前的数据然后载入 RDB，同时主服务器把新的写操作命令缓存到缓冲区；**第三阶段是主服务器发送新写操作命令给从服务器**——发送新的写操作命令，从服务器接收写操作命令并执行命令","**实现过程（六步）**：1. 从服务器发送 SYNC 命令——从服务器向主服务器发送 SYNC 命令，请求开始同步；2. 主服务器生成 RDB 快照——接收到 SYNC 命令后，主服务器会保存当前数据集的状态到一个临时文件，这个过程称为 RDB（Redis Database）快照；3. 传输 RDB 文件——主服务器将生成的 RDB 文件发送给从服务器；4. 从服务器接收并应用 RDB 文件——从服务器接收 RDB 文件后，会清空当前的数据集，并载入 RDB 文件中的数据；5. 主服务器记录写命令——在 RDB 文件生成和传输期间，主服务器会记录所有接收到的写命令到 **replication backlog buffer**；6. 传输写命令——一旦 RDB 文件传输完成，主服务器会将 replication backlog buffer 中的命令发送给从服务器，从服务器会执行这些命令，以保证数据的一致性","**增量同步**：允许从服务器**从断点处继续同步**，而不是每次都进行完全同步。它基于 **psync 命令**，使用了运行 ID（run ID）和复制偏移量（offset）的概念。网络断开后重新连接时：① 从服务器在恢复网络后，会发送 psync 命令给主服务器，此时的 psync 命令里的 offset 参数不是 -1；② 主服务器收到该命令后，用 **CONTINUE 响应命令**告诉从服务器接下来采用增量复制的方式同步数据；③ 然后主服务器将主从服务器断线期间所执行的写命令发送给从服务器，从服务器执行这些命令","**主服务器怎么知道要将哪些增量数据发送给从服务器**：答案藏在这两个东西里——**repl_backlog_buffer**：是一个「环形」缓冲区，用于主从服务器断连后从中找到差异的数据（默认大小是 1M，由于它是环形缓冲区，当缓冲区写满后主服务器继续写入就会覆盖之前的数据）；**replication offset**：标记上面那个缓冲区的同步进度，主从服务器都有各自的偏移量，主服务器使用 master_repl_offset 来记录自己「写」到的位置，从服务器使用 slave_repl_offset 来记录自己「读」到的位置","**网络断开重连后**：从服务器会通过 psync 命令将自己的复制偏移量 slave_repl_offset 发送给主服务器，主服务器根据自己的 master_repl_offset 和 slave_repl_offset 之间的差距来决定执行哪种同步操作——如果判断出从服务器要读取的数据还在 repl_backlog_buffer 缓冲区里，那么主服务器将采用**增量同步**的方式；相反，如果判断出从服务器要读取的数据已经不存在 repl_backlog_buffer 缓冲区里，那么主服务器将采用**全量同步**的方式（这种方式比增量同步的性能损耗要大很多）。因此，为了避免在网络恢复时主服务器频繁地使用全量同步的方式，应该调整 repl_backlog_buffer 缓冲区大小，尽可能的大一些，减少出现从服务器要读取的数据被覆盖的概率，从而使得主服务器采用增量同步的方式"]},
{q:"redis哨兵机制的工作原理", a:["**背景**：在 Redis 的主从架构中，由于主从模式是读写分离的，如果主节点（master）挂了，那么将没有主节点来服务客户端的写操作请求，也没有主节点给从节点（slave）进行数据同步了。这时如果要恢复服务的话，需要人工介入，选择一个「从节点」切换为「主节点」，然后让其他从节点指向新的主节点，同时还需要通知上游那些连接 Redis 主节点的客户端，将其配置中的主节点 IP 地址更新为「新主节点」的 IP 地址","**哨兵机制**：Redis 在 2.8 版本以后提供的哨兵（Sentinel）机制，它的作用是**实现主从节点故障转移**——它会监测主节点是否存活，如果发现主节点挂了，它就会选举一个从节点切换为主节点，并且把新主节点的相关信息通知给从节点和客户端。哨兵其实是一个**运行在特殊模式下的 Redis 进程**，所以它也是一个节点，相当于「观察者节点」，观察的对象是主从节点。哨兵节点主要负责三件事情：**监控、选主、通知**","**哨兵机制的选主节点的算法**（当 redis 集群的主节点故障时，Sentinel 集群将从剩余的从节点中选举一个新的主节点）：","**1. 故障节点主观下线**：Sentinel 集群的每一个 Sentinel 节点会定时对 redis 集群的所有节点发心跳包检测节点是否正常，如果一个节点在 **down-after-milliseconds** 时间内没有回复 Sentinel 节点的心跳包，则该 redis 节点被该 Sentinel 节点主观下线","**2. 故障节点客观下线**：当节点被一个 Sentinel 节点记为主观下线时，并不意味着该节点肯定故障了，还需要 Sentinel 集群的其他 Sentinel 节点共同判断为主观下线才行——该 Sentinel 节点会询问其他 Sentinel 节点，如果 Sentinel 集群中**超过 quorum 数量**的 Sentinel 节点认为该 redis 节点主观下线，则该 redis 节点客观下线。如果客观下线的 redis 节点是从节点或者是 Sentinel 节点，则操作到此为止；如果客观下线的 redis 节点为主节点，则开始故障转移，从从节点中选举一个节点升级为主节点","**3. Sentinel 集群选举 Leader**：每一个 Sentinel 节点都可以成为 Leader，当一个 Sentinel 节点确认 redis 集群的主节点主观下线后，会请求其他 Sentinel 节点要求将自己选举为 Leader，被请求的 Sentinel 节点如果没有同意过其他 Sentinel 节点的选举请求，则同意该请求（选举票数 +1），否则不同意。如果一个 Sentinel 节点获得的选举票数达到 **Leader 最低票数（quorum 和 Sentinel 节点数/2+1 的最大值）**，则该 Sentinel 节点选举为 Leader，否则重新进行选举。举个例子：假设哨兵节点有 3 个，quorum 设置为 2，那么任何一个想成为 Leader 的哨兵只要拿到 2 张赞成票，就可以选举成功了","**4. Sentinel Leader 决定新主节点**：① 过滤故障的节点；② 选择优先级 **slave-priority 最大**的从节点作为主节点（如不存在则继续）；③ 选择**复制偏移量**（数据写入量的字节，记录写了多少数据，主服务器会把偏移量同步给从服务器，当主从的偏移量一致则数据是完全同步）**最大**的从节点作为主节点（如不存在则继续）；④ 选择 **runid**（redis 每次启动的时候生成随机的 runid 作为 redis 的标识）**最小**的从节点作为主节点"]},
{q:"redis集群的哈希槽原理", a:["**背景**：当 Redis 缓存数据量大到一台服务器无法缓存时，就需要使用 Redis 切片集群（Redis Cluster）方案，它将数据分布在不同的服务器上，以此来降低系统对单主节点的依赖，从而提高 Redis 服务的读写性能","**哈希槽（Hash Slot）映射规则**：Redis Cluster 方案采用哈希槽来处理数据和节点之间的映射关系。一个切片集群共有 **16384 个哈希槽**，这些哈希槽类似于数据分区，每个键值对都会根据它的 key 被映射到一个哈希槽中，具体执行过程分为两大步：① 根据键值对的 key，按照 **CRC16 算法**计算一个 **16 bit 的值**；② 再用 16bit 值对 **16384 取模**，得到 0~16383 范围内的模数，每个模数代表一个相应编号的哈希槽","**哈希槽映射到 Redis 节点有两种方案**：**平均分配**——在使用 cluster create 命令创建 Redis 集群时，Redis 会自动把所有哈希槽平均分布到集群节点上（比如集群中有 9 个节点，则每个节点上槽的个数为 16384/9 个）；**手动分配**——可以使用 cluster meet 命令手动建立节点间的连接组成集群，再使用 cluster addslots 命令指定每个节点上的哈希槽个数（**注意：在手动分配哈希槽时，需要把 16384 个槽都分配完，否则 Redis 集群无法正常工作**）","**集群的优点**：**高可用性**——节点之间采用主从复制机制，可以保证数据的持久性和容错能力，哪怕其中一个节点挂掉，整个集群还可以继续工作；**高性能**——采用分片技术将数据分散到多个节点，从而提高读写性能，当业务访问量大到单机 Redis 无法满足时可以通过添加节点来增加集群的吞吐量；**扩展性好**——可以根据实际需求动态增加或减少节点，集群模式中的某些节点还可以作为代理节点自动转发请求，增加数据模式的灵活度和可定制性","**集群的缺点**：**部署和维护较复杂**——需要考虑分片规则、节点的布置、主从配置以及故障处理等多个方面，需要较强的技术支持，增加了节点异常处理的复杂性和成本；**集群同步问题**——当某些节点失败或者网络出故障，集群中数据同步的问题也会出现，数据同步的复杂度和工作量随着节点的增加而增加，同步时间也较长，导致一定的读写延迟；**数据分片限制**——在一个 key 上修改多次可能会因为该 key 所在的节点位置变化而失败，此外由于将数据分散存储到各个节点，某些操作不能跨节点实现，不同节点之间的一些操作需要额外注意"]},
{q:"redis为什么用16384个槽", a:["**16384 是 2 的 14 次方**，而 CRC16 算法可产生 16 位的输出（即 0~65535），取模 16384 可以让哈希结果均匀分布","**集群节点数量一般不超过 1000 个**，16384 个槽位对每个节点的位图存储开销合理——节点只需要维护一个 16384 位（约 2KB）的位图来表示自己负责的槽位，消息传播中槽位信息占空间小","**避免多余性能损耗**：16384 足够支持大规模集群，同时节点间 Gossip 协议传播槽位信息时开销可控；如果槽位数量过大，心跳消息中携带的槽位信息会占用更多带宽，如果过小又不足以支撑大规模集群的负载均衡粒度"]},
{q:"Redis的cluster为什么要有主从结构", a:["**保证高可用**：主从结构让每个主节点都有对应的从节点作为备份，主节点挂了从节点顶上，避免单点故障导致整个集群不可用","**数据不丢失**：主从复制保持数据同步，主节点发生故障时从节点能够接管（客户端请求自动路由到新主），保证集群继续提供服务","**容错和故障恢复**：通过哨兵机制（Sentinel）监测主节点心跳，主节点故障时自动执行故障转移，从从节点中选举新的主节点并通知客户端，整个过程无需人工介入"]},
]},
{name:"缓存与场景", qa:[
{q:"缓存穿透、缓存击穿、缓存雪崩的含义和解决办法", a:["**缓存雪崩**：当大量缓存数据在同一时间过期（失效）或者 Redis 故障宕机时，如果此时有大量的用户请求都无法在 Redis 中处理，于是全部请求都直接访问数据库，从而导致数据库的压力骤增，严重的会造成数据库宕机，从而形成一系列连锁反应，造成整个系统崩溃。**解决方案：均匀设置过期时间**——如果要给缓存数据设置过期时间，应该避免将大量的数据设置成同一个过期时间，可以在对缓存数据设置过期时间时，给这些数据的过期时间加上一个随机数，这样就保证数据不会在同一时间过期","**缓存击穿**：如果缓存中的某个热点数据过期了，此时大量的请求访问了该热点数据，就无法从缓存中读取，直接访问数据库，数据库很容易就被高并发的请求冲垮。**解决方案：① 互斥锁方案**——当业务线程在处理用户请求时，如果发现访问的数据不在 Redis 里，就加个互斥锁，保证同一时间内只有一个请求来构建缓存（从数据库读取数据，再将数据更新到 Redis 里），当缓存构建完成后再释放锁；未能获取互斥锁的请求，要么等待锁释放后重新读取缓存，要么就返回空值或者默认值。实现互斥锁的时候**最好设置超时时间**，不然第一个请求拿到了锁然后这个请求发生了某种意外而一直阻塞、一直不释放锁，这时其他请求也一直拿不到锁，整个系统就会出现无响应的现象；**② 不给热点数据设置过期时间**——由后台异步更新缓存，或者在热点数据准备要过期前，提前通知后台线程更新缓存以及重新设置过期时间","**缓存穿透**：当用户访问的数据既不在缓存中也不在数据库中，导致请求在访问缓存时发现缓存缺失，再去访问数据库时发现数据库中也没有要访问的数据，没办法构建缓存数据来服务后续的请求，那么当有大量这样的请求到来时，数据库的压力骤增。**解决方案：① 非法请求的限制**——当有大量恶意请求访问不存在的数据的时候也会发生缓存穿透，因此在 API 入口处要判断请求参数是否合理、请求参数是否含有非法值、请求字段是否存在，如果判断出是恶意请求就直接返回错误，避免进一步访问缓存和数据库；**② 缓存空值或者默认值**——当线上业务发现缓存穿透的现象时，可以针对查询的数据在缓存中设置一个空值或者默认值，这样后续请求就可以从缓存中读取到空值或者默认值返回给应用，而不会继续查询数据库；**③ 布隆过滤器**——可以在写入数据库数据时使用布隆过滤器做个标记，然后在用户请求到来时，业务线程确认缓存失效后可以通过查询布隆过滤器快速判断数据是否存在，如果不存在就不用通过查询数据库来判断数据是否存在。即使发生了缓存穿透，大量请求只会查询 Redis 和布隆过滤器，而不会查询数据库，保证了数据库能正常运行（Redis 自身也是支持布隆过滤器的）"]},
{q:"redis如何应对热key", a:["**热 key 的定义**：通常以其接收到的 Key 被请求频率来判定，例如：① **QPS 集中在特定的 Key**——Redis 实例的总 QPS（每秒查询率）为 10,000，而其中一个 Key 的每秒访问量达到了 7,000；② **带宽使用率集中在特定的 Key**——对一个拥有上千个成员且总大小为 1 MB 的 HASH Key 每秒发送大量的 HGETALL 操作请求；③ **CPU 使用时间占比集中在特定的 Key**——对一个拥有数万个成员的 Key（ZSET 类型）每秒发送大量的 ZRANGE 操作请求","**解决方案一：在 Redis 集群架构中对热 Key 进行复制**——在 Redis 集群架构中，由于热 Key 的迁移粒度问题，无法将请求分散至其他数据分片，导致单个数据分片的压力无法下降；此时可以将对应热 Key 进行复制并迁移至其他数据分片，例如将热 Key foo 复制出 3 个内容完全一样的 Key 并命名为 foo2、foo3、foo4，将这三个 Key 迁移到其他数据分片来解决单个数据分片的热 Key 压力","**解决方案二：使用读写分离架构**——如果热 Key 的产生来自于读请求，可以将实例改造成读写分离架构来降低每个数据分片的读请求压力，甚至可以不断地增加从节点。但是读写分离架构在增加业务代码复杂度的同时，也会增加 Redis 集群架构复杂度：不仅要为多个从节点提供转发层（如 Proxy、LVS 等）来实现负载均衡，还要考虑从节点数量显著增加后带来故障率增加的问题，Redis 集群架构变更会为监控、运维、故障处理带来更大的挑战"]},
{q:"布隆过滤器的原理", a:["**布隆过滤器由「初始值都为 0 的位数组」和「N 个哈希函数」两部分组成**。当在写入数据库数据时，在布隆过滤器里做个标记，这样下次查询数据是否在数据库时，只需要查询布隆过滤器，如果查询到数据没有被标记，说明不在数据库中","**布隆过滤器会通过 3 个操作完成标记**：第一步，使用 N 个哈希函数分别对数据做哈希计算，得到 N 个哈希值；第二步，将第一步得到的 N 个哈希值对位数组的长度取模，得到每个哈希值在位数组的对应位置；第三步，将每个哈希值在位数组的对应位置的值设置为 1","**举例**：假设有一个位数组长度为 8、哈希函数 3 个的布隆过滤器。在数据库写入数据 x 后，把数据 x 标记在布隆过滤器时，数据 x 会被 3 个哈希函数分别计算出 3 个哈希值，然后对这 3 个哈希值对 8 取模，假设取模的结果为 1、4、6，然后把位图数组的第 1、4、6 位置的值设置为 1。当应用要查询数据 x 是否在数据库时，通过布隆过滤器只要查到位图数组的第 1、4、6 位置的值是否全为 1，只要有一个为 0，就认为数据 x 不在数据库中","**布隆过滤器存在误判（哈希冲突）**：布隆过滤器由于是基于哈希函数实现查找的，高效查找的同时存在哈希冲突的可能性，比如数据 x 和数据 y 可能都落在第 1、4、6 位置，而事实上可能数据库中并不存在数据 y，存在误判的情况。**所以，查询布隆过滤器说数据存在，并不一定证明数据库中存在这个数据，但是查询到数据不存在，数据库中一定就不存在这个数据**","**使用场景**：缓存穿透防护（大量请求只查询 Redis 和布隆过滤器，不会查询数据库）、判断数据是否存在避免无效查询数据库等"]},
{q:"redis做分布式锁原理", a:["**分布式锁是用于分布式环境下并发控制的一种机制**，用于控制某个资源在同一时刻只能被一个应用所使用。Redis 本身可以被多个客户端共享访问，正好就是一个共享存储系统，可以用来保存分布式锁，而且 Redis 的读写性能高，可以应对高并发的锁操作场景","**利用 Redis 的 SET 命令 NX 参数实现「key 不存在才插入」**：如果 key 不存在，则显示插入成功，可以用来表示加锁成功；如果 key 存在，则会显示插入失败，可以用来表示加锁失败","**基于 Redis 节点实现分布式锁时，对于加锁操作，需要满足三个条件**：① 加锁包括了读取锁变量、检查锁变量值和设置锁变量值三个操作，需要以原子操作的方式完成，所以使用 **SET 命令带上 NX 选项**来实现加锁；② 锁变量需要设置过期时间，以免客户端拿到锁后发生异常导致锁一直无法释放，所以在 SET 命令执行时加上 **EX/PX 选项**设置其过期时间；③ 锁变量的值需要能区分来自不同客户端的加锁操作，以免在释放锁时出现误释放操作，所以使用 SET 命令设置锁变量值时，每个客户端设置的值是一个**唯一值**（用于标识客户端）","**满足这三个条件的分布式命令如下**：**SET lock_key unique_value NX PX 10000**——lock_key 就是 key 键；unique_value 是客户端生成的唯一的标识，区分来自不同客户端的锁操作；NX 代表只在 lock_key 不存在时才对 lock_key 进行设置操作；PX 10000 表示设置 lock_key 的过期时间为 10s，这是为了避免客户端发生异常而无法释放锁","**解锁过程**：将 lock_key 删除（del lock_key），但不能乱删，要保证执行操作的客户端就是加锁的客户端——解锁的时候要先判断锁的 unique_value 是否为加锁客户端，是的话才将 lock_key 删除。可以看到解锁是有两个操作，这时就需要 **Lua 脚本**来保证解锁的原子性，因为 Redis 在执行 Lua 脚本时，可以以原子性的方式执行，保证了锁释放操作的原子性","**RedLock 算法**：为了提高分布式锁的可靠性，Redis 作者 Antirez 提出了 RedLock 算法，它基于多个独立的 Redis 实例来实现一个更安全的分布式锁——客户端尝试在多数（大于半数）Redis 实例上同时加锁，只有当在大多数实例上加锁成功时才认为获取锁成功；锁的超时时间应该远小于单个实例的超时时间以避免死锁；该方式可以通过跨多个节点减少单点故障的影响，提高了锁的可用性和安全性","**使用场景**：分布式锁常用于分布式环境下需要互斥控制的资源访问，比如秒杀扣库存、分布式任务调度等"]},
{q:"redis分布式锁怎么防止误删别人的锁", a:["**加锁时 value 设置唯一标识**：使用 SET lock_key unique_value NX PX 10000 加锁时，unique_value 是客户端生成的唯一标识（如 UUID/请求 id），用来区分来自不同客户端的锁操作","**解锁时先判断锁是不是自己的**：解锁的时候先判断锁的 unique_value 是否为加锁客户端，是的话才将 lock_key 删除——如果直接执行 del 删除，可能会误删其他客户端设置的锁","**比对+删除必须用 Lua 脚本保证原子性**：解锁涉及「先 GET 比对 value 是否相等」和「再 DEL 删除」两个操作，为了保证这两个操作的原子性，通过 lua 脚本来保证：// 释放锁时，先比较 unique_value 是否相等，避免锁的误释放 if redis.call(\"get\",KEYS[1]) == ARGV[1] then return redis.call(\"del\",KEYS[1]) else return 0 end——Redis 会把整个 Lua 脚本作为一个整体执行，执行过程中不会被其他命令打断，这样就不会出现「判断是自己的锁但删除前锁被其他客户端抢走」的误删问题"]},
{q:"redis和本地锁有什么区别", a:["**作用范围**：本地锁（synchronized/Lock）只对**单个 JVM 进程内**的线程互斥；分布式锁对**多个进程/服务器**之间共享的资源进行互斥控制——在微服务集群中，每个服务是独立的进程，本地锁无法跨进程生效","**实现方式**：本地锁基于 JVM 内存实现（synchronized 关键字、ReentrantLock 等）；分布式锁基于共享存储系统实现，比如 **Redis 的 SET NX 命令**（Redis 本身可以被多个客户端共享访问，正好就是共享存储系统）或 Zookeeper 临时节点","**使用场景**：本地锁解决单机多线程并发问题；分布式锁解决微服务集群多实例竞争共享资源的场景（如秒杀扣库存、分布式任务调度、防止多个实例同时执行同一定时任务）"]},
{q:"redis的hash和list区别", a:["**Hash（哈希）**：包含键值对的无序散列表，适合存储对象（如用户信息、购物车——用户 id 做 key、商品 id 做 field、数量做 value），支持对单个 field 的添加、获取、删除操作","**List（列表）**：一个有序链表，链表上的每个节点都包含一个字符串，元素可以重复，支持对链表的两端进行 push 和 pop 操作（LPUSH/RPUSH/LPOP/RPOP）、读取单个或多个元素、根据值查找或删除元素；支持阻塞操作（BLPOP/BRPOP），适合做消息队列、最新列表等场景","**主要区别**：Hash 是无序的键值对集合、按 field 存取；List 是有序的列表、支持头尾操作和阻塞读取"]},
{q:"Redis的key设计原则", a:["**key 尽量短**：key 太长占用内存空间，可以用有意义的缩写或编码替代冗长字符串","**有清晰的命名空间**：使用「业务:模块:ID」的格式组织 key（如 user:1001:profile、order:20240101:001），避免 key 混乱和冲突","**避免大 key**：value 过大的 key（字符串类型占用空间大于 1M 或集合类型元素数量超过 1 万个）会导致 Redis 性能下降、内存不足、阻塞其他操作等问题","**设置合理的 TTL**：给缓存数据设置过期时间，避免长时间无人访问的数据一直存在内存中不过期浪费内存","**避免 key 冲突**：不同业务使用不同的前缀，防止不同业务 key 相同导致数据覆盖"]},
]},
{name:"高并发", qa:[
{q:"redis为什么这么快还能持久化", a:["**写操作先写内存，再异步刷盘**：Redis 的主线程负责在内存中执行写命令（标记数据），持久化工作不阻塞主流程——**RDB 使用 bgsave 命令创建子进程**生成 RDB 文件，可以避免主线程的阻塞；**AOF 默认使用 Everysec 策略**，每次写操作命令执行完后先将命令写入到 AOF 文件的内核缓冲区，然后每隔一秒将缓冲区里的内容写回到硬盘，性能适中","**fork 子进程采用写时复制（COW）技术**：创建子进程时只复制父进程的页表，不复制实际数据，只有内存页被修改时才复制该页——这样即使数据量大，fork 的开销也小，不会阻塞主线程处理请求","**内存数据访问本身快**：Redis 的大部分操作都在内存中完成并采用了高效的数据结构，瓶颈可能是机器的内存或者网络带宽而并非 CPU，持久化不影响主流程","**单线程避免并发竞争**：Redis 采用单线程模型避免了多线程之间的竞争，省去了多线程切换带来的时间和性能上的开销，也不会导致死锁问题"]},
{q:"redis高并发使用哪些方案", a:["**读写分离**：主节点负责写，从节点负责读，水平扩展读能力——在完成主从复制之后，写数据时只写主库、读数据时只读从库，即使写请求会锁表或者锁记录也不会影响读请求的执行","**集群模式**：Redis Cluster 通过 16384 个哈希槽对数据分片，将数据分布在不同服务器上，多主多从，扩展容量和并发能力——当业务访问量大到单机 Redis 无法满足时，可以通过添加节点来增加集群的吞吐量","**多级缓存**：本地缓存（如 Caffeine）+ Redis 分层，热点数据在应用层本地缓存，减少 Redis 压力","**连接池**：复用连接减少创建销毁连接的开销；**合理数据分片**：把热点数据分散到不同节点；**限流降级**：对超出阈值的请求限流，保护 Redis 不被压垮"]},
]},
]});

/* ============================================================
 * 渲染与交互
 * ============================================================ */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const renderTxt = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<mark>$1</mark>");

function buildQA(item, si, idx){
  const aHtml = item.a.map(t => {
    const hasHl = /\*\*.+\*\*/.test(t);
    return `<li class="${hasHl?'has-hl':''}">${renderTxt(t)}</li>`;
  }).join("");
  const cHtml = item.c ? `<div class="codeblock">${esc(item.c)}</div>` : "";
  const m = state[idx] || "n";
  const mBtn = `<button class="mbtn m ${m==='n'?'active':''}" data-s="n">未掌握</button><button class="mbtn r ${m==='r'?'active':''}" data-s="r">待复习</button><button class="mbtn k ${m==='k'?'active':''}" data-s="k">已掌握</button>`;
  return `<div class="qa" id="q-${idx}">
    <div class="q-head" onclick="toggleQ(this)">
      <span class="num">${si+1}.${idx+1}</span>
      <span class="q">${esc(item.q)}</span>
      <span class="arrow"></span>
    </div>
    <div class="a-body"><ul>${aHtml}</ul>${cHtml}
      <div class="mastery">${mBtn}<button class="reset">清状态</button></div>
    </div>
  </div>`;
}

function render(){
  const q = searchVal;
  let html = "", nav = "", idx = 0, done = 0;
  const all = SECTIONS.reduce((n,s)=>n+s.chapters.reduce((x,c)=>x+c.qa.length,0),0);
  // 先遍历一遍生成主内容 + 计数器，同时统计已掌握
  const navGroups = [];
  SECTIONS.forEach((sec, si) => {
    const secTotal = sec.chapters.reduce((n,c)=>n+c.qa.length,0);
    html += `<div class="section" id="sec-${sec.id}"><div class="sec-head"><span class="no">PART ${String(si+1).padStart(2,"0")}</span><h2>${esc(sec.title)}</h2><span class="sub">${secTotal} 题</span></div>`;
    sec.chapters.forEach(ch => {
      html += `<div class="chapter-label">${esc(ch.name)}</div>`;
      ch.qa.forEach(item => {
        const hit = q==="" || item.q.toLowerCase().includes(q) || item.a.join("").toLowerCase().includes(q);
        if(hit) html += buildQA(item, si, idx);
        if(state[idx]==="k") done++;
        idx++;
      });
    });
    html += `</div>`;
  });
  // 第二遍生成目录（计数器与第一遍保持一致）
  idx = 0;
  SECTIONS.forEach((sec, si) => {
    let chNav = "";
    sec.chapters.forEach(ch => {
      let qs = "";
      ch.qa.forEach(item => {
        const st = state[idx]==="k" ? "<span class='done'>✓</span>" : "";
        qs += `<button class="nav-q" data-idx="${idx}">${esc(item.q.length>26?item.q.slice(0,26)+"…":item.q)}${st}</button>`;
        idx++;
      });
      chNav += `<div class="nav-group"><button class="nav-chapter"><span>${esc(ch.name)}</span><span class="cnt">${ch.qa.length}</span></button><div class="qs">${qs}</div></div>`;
    });
    navGroups.push(`<div class="nav-group"><button class="nav-chapter"><span>${esc(sec.title)}</span><span class="cnt">${sec.chapters.reduce((n,c)=>n+c.qa.length,0)}</span></button><div class="qs">${chNav}</div></div>`);
  });
  document.getElementById("main").innerHTML = html || `<div class="empty"><b>没有匹配的题目</b>换个关键词试试</div>`;
  document.getElementById("nav").innerHTML = navGroups.join("");
  document.getElementById("totalQ").textContent = all;
  refreshStat();
  // 展开所有匹配
  if(q !== "") document.querySelectorAll(".qa").forEach(el => el.classList.add("open"));
}

const state = JSON.parse(localStorage.getItem("ms_state") || "{}");
let searchVal = "";

function refreshStat(){
  const all = SECTIONS.reduce((n,s)=>n+s.chapters.reduce((x,c)=>x+c.qa.length,0),0);
  const done = Object.values(state).filter(v=>v==="k").length;
  const pct = all ? Math.round(done/all*100) : 0;
  document.getElementById("progressBar").style.width = pct + "%";
  document.getElementById("progressTxt").textContent = `已掌握 ${done} / ${all}（${pct}%）`;
}

function toggleQ(head){ head.closest(".qa").classList.toggle("open"); }

function saveState(){ localStorage.setItem("ms_state", JSON.stringify(state)); }

document.addEventListener("click", e => {
  const m = e.target.closest(".mbtn");
  if(m){
    const qa = m.closest(".qa");
    const key = qa.id.replace("q-","");
    state[key] = m.dataset.s;
    qa.querySelectorAll(".mbtn").forEach(b => b.classList.toggle("active", b===m));
    saveState(); refreshStat();
    return;
  }
  if(e.target.classList.contains("reset")){
    const qa = e.target.closest(".qa");
    delete state[qa.id.replace("q-","")];
    qa.querySelectorAll(".mbtn").forEach(b => b.classList.remove("active"));
    saveState(); refreshStat();
    return;
  }
  const nq = e.target.closest(".nav-q");
  if(nq){
    document.querySelectorAll(".nav-q").forEach(x=>x.classList.remove("current"));
    nq.classList.add("current");
    const el = document.getElementById("q-"+nq.dataset.idx);
    if(el){ el.scrollIntoView({behavior:"smooth",block:"start"}); el.classList.add("open"); }
    if(window.innerWidth<=960) closeSidebar();
    return;
  }
  const nc = e.target.closest(".nav-chapter");
  if(nc){ nc.parentElement.classList.toggle("open"); return; }
});

document.getElementById("search").addEventListener("input", e => {
  searchVal = e.target.value.trim().toLowerCase();
  render();
});
document.getElementById("btnExpand").onclick = () => document.querySelectorAll(".qa").forEach(el=>el.classList.add("open"));
document.getElementById("btnCollapse").onclick = () => document.querySelectorAll(".qa").forEach(el=>el.classList.remove("open"));
document.getElementById("btnReset").onclick = () => {
  if(confirm("确定清空所有掌握进度标记吗？")){ Object.keys(state).forEach(k=>delete state[k]); saveState(); refreshStat(); }
};
document.getElementById("btnHl").onclick = function(){
  document.body.classList.toggle("hl-mode");
  this.classList.toggle("active");
  this.textContent = document.body.classList.contains("hl-mode") ? "显示完整答案" : "只看高光";
};
document.getElementById("btnMenu").onclick = () => {
  document.getElementById("sidebar").classList.add("show");
  document.getElementById("mask").classList.add("show");
};
document.getElementById("mask").onclick = closeSidebar;
function closeSidebar(){
  document.getElementById("sidebar").classList.remove("show");
  document.getElementById("mask").classList.remove("show");
}

render();
</script>
</body>
</html>
